---
profile::gnmi_telemetry::username: rancid

profile::gnmi_telemetry::targets_sub:
  juniper:
    - interfaces-states
    - bgp
    - alarms
    - bfd

profile::gnmi_telemetry::site_mapping:
  eqiad: ['eqiad', 'eqord']
  codfw: ['codfw', 'eqdfw']
  ulsfo: ['ulsfo']
  esams: ['esams']
  eqsin: ['eqsin']
  drmrs: ['drmrs']
  magru: ['magru']

profile::gnmi_telemetry::ports:
  juniper: 32767

profile::gnmi_telemetry::outputs:
  prom-output:
    type: prometheus
    metric-prefix: "gnmi"
    expiration: 300s
    num-workers: 16 # T388641#10737894
    export-timestamps: true
    timeout: 50s
    event-processors:
      - delete-tag-name
      - description-to-tag
      - rename-interface-state
      - static-bgp-tags
      - rename-bgp-session-state
      - rename-bgp-global
      - rename-bgp-neighbor
      - rename-bgp-neighbor-tag
      - rename-bgp-neighbor-prefixes
      - rename-bgp-afi-safi
      - rename-bfd-session-state
      - rename-bfd-diagnostic-code
      - static-bfd-tags
      - rename-bfd-peer

profile::gnmi_telemetry::subscriptions:
  interfaces-states:
    paths:
      - "/interfaces/interface/state"
    stream-mode: sample
    sample-interval: 60s
    encoding: proto
  bgp:
    paths:
      - "/network-instances/network-instance/protocols/protocol/bgp/global/state/total-paths"
      - "/network-instances/network-instance/protocols/protocol/bgp/global/state/total-prefixes"
      - "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/peer-as"
      - "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/session-state"
      - "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/description"
      - "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/peer-type"
      - "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/peer-group"
      - "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/established-transitions"
      - "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/last-established"
      - "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/interface-error"
      - "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/afi-safis/afi-safi/state/prefixes"
    stream-mode: sample
    sample-interval: 60s
    encoding: proto
  alarms:
    paths:
      - "/system/alarms/alarm/state/id"
    stream-mode: sample
    sample-interval: 60s
    encoding: proto
  bfd:
    paths:
    - "/bfd/interfaces/interface/peers/peer/state/local-address"
    - "/bfd/interfaces/interface/peers/peer/state/remote-address"
    - "/bfd/interfaces/interface/peers/peer/state/session-state"
    - "/bfd/interfaces/interface/peers/peer/state/remote-session-state"
    - "/bfd/interfaces/interface/peers/peer/state/local-diagnostic-code"
    - "/bfd/interfaces/interface/peers/peer/state/remote-diagnostic-code"
    stream-mode: sample
    sample-interval: 60s
    encoding: proto
profile::gnmi_telemetry::processors:
  delete-tag-name:
    event-delete:
      tag-names:
        - "^subscription-name"
  description-to-tag:
    event-value-tag-v2:
      rules:
        - value-name: "/interfaces/interface/state/description"
          tag-name: "interface_description"
          consume: false
  rename-interface-state:
    event-strings:
      value-names: ["/interfaces/interface/state/oper-status"]
      transforms:
        - replace: {apply-on: "value", old: "UP", new: "1"}
        - replace: {apply-on: "value", old: "DOWN", new: "2"}
        - replace: {apply-on: "value", old: "TESTING", new: "3"}
        - replace: {apply-on: "value", old: "UNKNOWN", new: "4"}
        - replace: {apply-on: "value", old: "DORMANT", new: "5"}
        - replace: {apply-on: "value", old: "NOT_PRESENT", new: "6"}
        - replace: {apply-on: "value", old: "LOWER_LAYER_DOWN", new: "7"}
  static-bgp-tags:
    event-value-tag-v2:
      rules:
        - value-name: "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/peer-as"
          tag-name: peer_as
          consume: true
        - value-name: "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/description"
          tag-name: peer_descr
          consume: true
        - value-name: "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/peer-type"
          tag-name: peer_type
          consume: true
        - value-name: "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/peer-group"
          tag-name: peer_group
          consume: true
  rename-bgp-session-state:
    event-strings:
      value-names: ["/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/session-state"]
      transforms:
        - replace: {apply-on: "value", old: "IDLE", new: "1"}
        - replace: {apply-on: "value", old: "CONNECT", new: "2"}
        - replace: {apply-on: "value", old: "ACTIVE", new: "3"}
        - replace: {apply-on: "value", old: "OPENSENT", new: "4"}
        - replace: {apply-on: "value", old: "OPENCONFIRM", new: "5"}
        - replace: {apply-on: "value", old: "ESTABLISHED", new: "6"}
  rename-bgp-global:
    event-strings:
      value-names: ["/network-instances/network-instance/protocols/protocol/bgp/global.*"]
      transforms:
        - replace:
            apply-on: "name"
            old: "/network-instances/network-instance/protocols/protocol/bgp/global/state"
            new: "/bgp"
  rename-bgp-neighbor:
    event-strings:
      value-names: ["/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state.*"]
      transforms:
        - replace:
            apply-on: "name"
            old: "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state"
            new: "/bgp/neighbor"
  rename-bgp-neighbor-tag:
    event-strings:
      tag-names: ["neighbor_neighbor-address"]
      transforms:
        - trim-prefix:
            apply-on: "name"
            prefix: "neighbor_neighbor-"
  rename-bgp-neighbor-prefixes:
    event-strings:
      value-names: ["/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/afi-safis/afi-safi/state/prefixes.*"]
      transforms:
        - replace:
            apply-on: "name"
            old: "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/afi-safis/afi-safi/state"
            new: "/bgp/neighbor"
  rename-bgp-afi-safi:
    event-strings:
      tag-names: ["afi-safi_afi-safi-name"]
      transforms:
        - replace:
            apply-on: "name"
            old: "afi-safi_afi-safi-name"
            new: "afi-safi"
  static-bfd-tags:
    event-value-tag-v2:
      rules:
      - value-name: "/bfd/interfaces/interface/peers/peer/state/local-address"
        tag-name: local_address
        consume: true
      - value-name: "/bfd/interfaces/interface/peers/peer/state/remote-address"
        tag-name: remote_address
        consume: true
  rename-bfd-session-state:
    event-strings:
      value-names:
      - "/bfd/interfaces/interface/peers/peer/state/session-state"
      - "/bfd/interfaces/interface/peers/peer/state/remote-session-state"
      transforms: # https://github.com/openconfig/public/blob/master/release/models/bfd/openconfig-bfd.yang#L126
      - replace: {apply-on: "value", old: "ADMIN_DOWN", new: "1"}
      - replace: {apply-on: "value", old: "DOWN", new: "2"}
      - replace: {apply-on: "value", old: "INIT", new: "3"}
      - replace: {apply-on: "value", old: "UP", new: "4"}
  rename-bfd-diagnostic-code:
    event-strings:
      value-names:
      - "/bfd/interfaces/interface/peers/peer/state/local-diagnostic-code"
      - "/bfd/interfaces/interface/peers/peer/state/remote-diagnostic-code"
      transforms: # https://github.com/openconfig/public/blob/master/release/models/bfd/openconfig-bfd.yang#L154
      - replace: {apply-on: "value", old: "NO_DIAGNOSTIC", new: "0"}
      - replace: {apply-on: "value", old: "DETECTION_TIMEOUT", new: "1"}
      - replace: {apply-on: "value", old: "ECHO_FAILED", new: "2"}
      - replace: {apply-on: "value", old: "FORWARDING_RESET", new: "3"}
      - replace: {apply-on: "value", old: "PATH_DOWN", new: "4"}
      - replace: {apply-on: "value", old: "CONCATENATED_PATH_DOWN", new: "5"}
      - replace: {apply-on: "value", old: "ADMIN_DOWN", new: "6"}
      - replace: {apply-on: "value", old: "REVERSE_CONCATENATED_PATH_DOWN", new: "7"}
      - replace: {apply-on: "value", old: "NEIGHBOR_DOWN", new: "8"}
  rename-bfd-peer:
    event-strings:
      value-names:
      - "/bfd/interfaces/interface/peers/peer/state.*"
      transforms:
      - replace:
          apply-on: name
          old: "/bfd/interfaces/interface/peers/peer/state"
          new: "/bfd/peer"

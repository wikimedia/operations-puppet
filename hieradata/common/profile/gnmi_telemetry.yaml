---
profile::gnmi_telemetry::username: rancid

profile::gnmi_telemetry::targets_sub:
  juniper:
    - interfaces-states

profile::gnmi_telemetry::site_mapping:
  eqiad: ['eqiad', 'eqord']
  codfw: ['codfw', 'eqdfw']
  ulsfo: ['ulsfo']
  esams: ['esams']
  eqsin: ['eqsin']
  drmrs: ['drmrs']
  magru: ['magru']

profile::gnmi_telemetry::ports:
  juniper: 32767

profile::gnmi_telemetry::outputs:
  prom-output:
    type: prometheus
    metric-prefix: "gnmi"
    expiration: 120s
    num-workers: 4
    num-writers: 4
    export-timestamps: true
    timeout: 50s
    event-processors:
      - delete-tag-name
      - description-to-tag
profile::gnmi_telemetry::subscriptions:
  interfaces-states:
    paths:
      - "/interfaces/interface/state"
    stream-mode: sample
    sample-interval: 60s
    encoding: proto
profile::gnmi_telemetry::processors:
  delete-tag-name:
    event-delete:
      tag-names:
        - "^subscription-name"
  description-to-tag:
    event-value-tag-v2:
      rules:
        - value-name: "/interfaces/interface/state/description"
          tag-name: "interface_description"
          consume: false

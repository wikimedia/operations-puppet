profile::puppetdb::jvm_opts: '-Xmx4G'
profile::puppetdb::elk_logging: true
profile::puppetdb::ca_path: '/etc/ssl/certs/Puppet_Internal_CA.pem'
profile::puppetdb::puppetservers: []
profile::puppetdb::puppetboard_hosts: []
profile::puppetdb::ssldir: ~
profile::puppetdb::slaves: []
profile::puppetdb::log_level: info
profile::puppetdb::tmpfs_stockpile_queue: false
profile::puppetdb::clean_stockpile: false
profile::puppetdb::facts_blacklist: []
profile::puppetdb::facts_blacklist_type: 'literal'
profile::puppetdb::gc_interval: 20
profile::puppetdb::node_ttl: '7d'
profile::puppetdb::node_purge_ttl: '14d'
profile::puppetdb::report_ttl: '1d'
profile::puppetdb::ca_content: ~
profile::puppetdb::ssl_verify_client: optional
profile::puppetdb::sites: {}
profile::puppetdb::db_ro_host: '%{facts.networking.fqdn}'
profile::puppetdb::pdb_resource_exporter_config:
  series:
    - rtype: Nrpe::Monitor_service
      filter: .[] | .title as $title | .parameters as $parameters | [ ([.tags[] | select(startswith("profile:"))] | sort) | ($title),($parameters.nrpe_command | split(" ")[0]), (. | join("|"))] | @json
      uniq: False
      name: icinga_migration_count
    - rtype: Nrpe::Monitor_service
      filter: .[] | .title as $title | .parameters as $parameters | [ ([.tags[] | select(startswith("profile:"))] | sort) | ($title),($parameters.nrpe_command | split(" ")[0]), (. | join("|"))] | @json
      uniq: True
      name: icinga_migration_count_distinct
    - rtype: Nrpe::Monitor_service
      filter: .[] | .title as $title | select( .parameters.enable_nrpe2nodexp == true ) | .parameters as $parameters | [ ([.tags[] | select(startswith("profile:"))] | sort) | ($title),($parameters.nrpe_command | split(" ")[0]), (. | join("|"))] | @json
      uniq: True
      name: icinga_migration_nrpe2nodexp_count_distinct
    - rtype: Nrpe::Monitor_service
      filter: .[] | .title as $title | select( .parameters.enable_nrpe2nodexp == true ) | select( .parameters.enable_icinga_check == false ) | .parameters as $parameters | [ ([.tags[] | select(startswith("profile:"))] | sort) | ($title),($parameters.nrpe_command | split(" ")[0]), (. | join("|"))] | @json
      uniq: True
      name: icinga_migration_nrpe2nodexp_only_count_distinct
    - rtype: Nrpe::Monitor_service
      filter: .[] | select( .parameters.migration_task == "T321808") | .title as $title | .parameters as $parameters | [ ([.tags[] | select(startswith("profile:"))] | sort) | ($title),($parameters.nrpe_command | split(" ")[0]), (. | join("|"))] | @json
      uniq: True
      name: icinga_migration_unaudited_count_distinct

    - rtype: Monitoring::Check_prometheus
      filter: .[] | .title as $title | .parameters as $parameters | [ ([.tags[] | select(startswith("profile:"))] | sort) | ($title),"promql", (. | join("|"))] | @json
      uniq: False
      name: icinga_migration_count
    - rtype: Monitoring::Check_prometheus
      filter: .[] | .title as $title | .parameters as $parameters | [ ([.tags[] | select(startswith("profile:"))] | sort) | ($title),"promql", (. | join("|"))] | @json
      uniq: True
      name: icinga_migration_count_distinct

    - rtype: Monitoring::Service
      filter: .[] | .title as $title | .parameters as $parameters | [ ([.tags[] | select(startswith("profile:"))] | sort) | ($title),($parameters.check_command | split(" ")[0]), (. | join("|"))] | @json
      uniq: False
      name: icinga_migration_count
    - rtype: Monitoring::Service
      filter: .[] | .title as $title | .parameters as $parameters | [ ([.tags[] | select(startswith("profile:"))] | sort) | ($title),($parameters.check_command | split(" ")[0]), (. | join("|"))] | @json
      uniq: True
      name: icinga_migration_count_distinct
    - rtype: Monitoring::Service
      filter: .[] | select( .parameters.migration_task == "T321808") | .title as $title | .parameters as $parameters | [ ([.tags[] | select(startswith("profile:"))] | sort) | ($title),($parameters.check_command | split(" ")[0]), (. | join("|"))] | @json
      uniq: True
      name: icinga_migration_unaudited_count_distinct

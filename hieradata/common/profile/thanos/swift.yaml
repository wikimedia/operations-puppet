    auth:         'https://thanos-swift.discovery.wmnet'
    user:         'wdqs:savepoints'
  mlserve_prod:
    access:       '.admin'
    account_name: 'AUTH_mlserve'
    auth:         'https://thanos-swift.discovery.wmnet'
    user:         'mlserve:prod'
  mlserve_ro:
    access:       ''
    account_name: 'AUTH_mlserve'
    auth:         'https://thanos-swift.discovery.wmnet'
    user:         'mlserve:ro'
    stats_enabled: 'no'
  machinetranslation_ro:
    access:       ''
    account_name: 'AUTH_mlserve'
    auth:         'https://thanos-swift.discovery.wmnet'
    user:         'machinetranslation:ro'

# TODO: move this to module data.
# Local ports go between 6000 and 7000
profile::services_proxy::envoy::listen_ipv6: true
profile::services_proxy::envoy::listeners:
  # First, the discovery enabled services
  - name: mathoid
    port: 6003
    timeout: "3s"
    service: mathoid
  - name: eventgate-analytics
    port: 6004
    timeout: "10s"
    service: eventgate-analytics
    keepalive: "4.5s"
    retry:
      retry_on: "5xx"
      num_retries: 1
  - name: eventgate-main
    port: 6005
    timeout: "61s"
    service: eventgate-main
    keepalive: "4.5s"
    retry:
      retry_on: "5xx"
      num_retries: 2
      per_try_timeout: "20s"
  - name: sessionstore
    port: 6006
    service: sessionstore
    timeout: "2.5s"
  - name: echostore
    port: 6007
    service: echostore
    timeout: "2.5s"
  - name: termbox
    port: 6008
    service: termbox
    keepalive: "4.5s"
    retry:
      retry_on: "5xx"
      num_retries: 2
    timeout: "25s"
  - name: restbase
    port: 6011
    service: restbase-https
    upstream: restbase.discovery.wmnet
    timeout: "30s"
    keepalive: "4s" # this is needed to avoid reusing upstream-closed connections - see T263043, also T266855
    xfp: https # this is needed for private wikis - see T249535
  - name: push-notifications
    port: 6012
    service: push-notifications
    keepalive: "4.5s"
    timeout: "2.5s"
  - name: mobileapps
    port: 6012 #TODO: Duplicate
    service: mobileapps
    timeout: "120s"
  - name: eventgate-analytics-external
    port: 6013
    timeout: "5s"
    service: eventgate-analytics-external
    keepalive: "4.5s"
    retry:
      retry_on: "5xx"
      num_retries: 1
  - name: proton
    port: 6013 #TODO: Duplicate
    service: proton
    timeout: "120s"
  - name: citoid
    port: 6014
    service: citoid
    timeout: "120s"
    keepalive: "4.5s"
  - name: cxserver
    port: 6015

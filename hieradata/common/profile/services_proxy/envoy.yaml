  # Other services, mostly used by restbase
  - name: mwapi-async # mediawiki api for long-lasting async requests
    port: 6500
    service: "mw-api-int"
    upstream: "mw-api-int.discovery.wmnet"
    keepalive: "4s"
    timeout: "120s"
    xfp: https
  - name: mwapi  # MediaWiki-internal requests (T288848)
    port: 6501
    service: "mw-api-int"
    upstream: "mw-api-int.discovery.wmnet"
    keepalive: "4s"
    timeout: "60s"
    xfp: https
  - name: mw-api-int-async  # mw-on-k8s api for long-lasting async requests (T333120)
    port: 6500  # NOTE: re-use "mwapi-async" port to make the transition easier
    service: "mw-api-int"
    upstream: "mw-api-int.discovery.wmnet"
    keepalive: "4s"
    timeout: "120s"
    xfp: https
  - name: mw-api-int  # mw-on-k8s internal requests (T333120)
    port: 6501  # NOTE: re-use "mwapi" port to make the transition easier
    service: "mw-api-int"
    upstream: "mw-api-int.discovery.wmnet"
    keepalive: "4s"
    timeout: "60s"
    xfp: https
  - name: mw-api-int-async-ro  # mw-on-k8s api for long-lasting async requests (T333120)
    port: 6500  # NOTE: re-use "mwapi-async" port to make the transition easier
    service: "mw-api-int"
    upstream: "mw-api-int-ro.discovery.wmnet"
    keepalive: "4s"
    timeout: "120s"
    xfp: https
    retry:  # -ro should be safe to retry on
      retry_on: "5xx"
      num_retries: 1
  - name: restbase-for-services # applications that have call loops with restbase
    port: 6503
    service: restbase-https
    timeout: "122s"
    keepalive: "4s" # this is needed to avoid reusing upstream-closed connections - see T263043
    upstream: restbase.discovery.wmnet
    xfp: https # this is needed for private wikis - see T249535
  - name: machinetranslation  # called by cxserver
    port: 6504
    service: machinetranslation
    timeout: "120s"
    sets_sni: true
  - name: mw-wikifunctions-ro  # used by wikifunctions instead of mw-api-int T347544
    port: 6501  # NOTE: re-use "mwapi" port to make the transition easier
    service: "mw-wikifunctions"
    upstream: "mw-wikifunctions-ro.discovery.wmnet"
    keepalive: "4s"
    timeout: "60s"
    xfp: https
    sets_sni: true
    # We need > 1 possible Host headers here (wikifunctions, wikidata) and thus
    # http_host wouldn't cover this use case
    sni_rewrites_host_header: false
  - name: mw-jobrunner
    port: 6506
    # NOTE: The mw-jobrunner inbound listener uses a 1202.5s timeout.
    # Use a value a bit larger than that for the outbound listener's request
    # and stream-idle timeouts.
    timeout: "1205s"
    idle_timeout: "1205s"
    service: mw-jobrunner
    keepalive: "4s"
    xfp: https
    # NOTE: Similar to shellbox-video, in order to support long-running idle
    # connections that may traverse LVS, start keepalive early (5m).
    tcp_keepalive:
      keepalive_time: 300
  - name: mw-misc
    port: 6508
    service: mw-misc
    timeout: "30s"
    sets_sni: true
    keepalive: "4s"
  - name: noc
    port: 6509
    service: mw-misc
    timeout: "30s"
    sets_sni: true
    # Begin services CNAME'd to ingress endpoints
    # We duplicate the mw-misc service in order to make it work specifically
    # for noc, as the service is behind Kuberntes ingress, but the SNI rewrites
    # the Host HTTP header, required by the mediawiki instance itself.
    # We manually force the host header to use the right value.
    http_host: 'noc.wikimedia.org'
    keepalive: "4s"

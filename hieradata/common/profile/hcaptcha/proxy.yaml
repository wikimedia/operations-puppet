profile::hcaptcha::proxy::proxy_port: 10443
profile::hcaptcha::proxy::proxy_domain: 'hcaptcha.wikimedia.org'
# the API call sets https://assets-hcaptcha.wikimedia.org as the origin
# because the iframe is loaded from there
profile::hcaptcha::proxy::nginx_resolvers: "%{alias('profile::resolving::nameservers')}"
profile::hcaptcha::proxy::subdomains:
  assets: newassets
  imgs:   imgs
  report: accounts

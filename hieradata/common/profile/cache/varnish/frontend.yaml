profile::cache::varnish::frontend::packages_component: main
profile::cache::varnish::frontend::transient_gb: 0
profile::cache::varnish::frontend::listen_uds:
  - /run/varnish-frontend-0.socket
profile::cache::varnish::frontend::backends_in_etcd: true
profile::cache::varnish::frontend::uds_owner: haproxy
profile::cache::varnish::frontend::uds_group: root
profile::cache::varnish::frontend::uds_mode: '700'
# wikipedia.org receives ~300M mobile daily pageviews
#
# Unified:
# - it.wikipedia.org #  10M
# - fa.wikipedia.org #   5M
# - he.wikipedia.org #   1M
# - id.wikipedia.org #   2M
# - fr.wikipedia.org #  12M
# - de.wikipedia.org #  13M
#
# Remaining:           257M
#
# Of which:
# - en.wikipedia.org # 141M
# - Other            #  65M
# - ja.wikipedia.org #  20M
# - ru.wikipedia.org #  17M
# - es.wikipedia.org #  14M
profile::cache::varnish::frontend::enable_m_redir:
  - wikipedia.org
profile::cache::varnish::frontend::enable_m_redir_except:
  # T401595, T403510
  - test.wikipedia.org
  - ca.wikipedia.org
  - he.wikipedia.org
  - it.wikipedia.org
  - fa.wikipedia.org
  # T403510
  - id.wikipedia.org
  - fr.wikipedia.org
  - de.wikipedia.org
profile::cache::varnish::frontend::privileged_uds: '/run/varnish-privileged.socket'
profile::cache::varnish::frontend::separate_vcl: []
profile::cache::varnish::frontend::use_etcd_req_filters: false
profile::cache::varnish::frontend::use_ip_reputation: false
profile::cache::varnish::frontend::enable_monitoring: true
profile::cache::varnish::frontend::fe_jemalloc_conf: 'thp:never'
profile::cache::varnish::frontend::thread_pool_max: 12000
# complain if computed frontend memory size is below a certain threshold (150 GB).
# to override this, set check_min_fe_mem_value.
profile::cache::varnish::frontend::check_min_fe_mem: true

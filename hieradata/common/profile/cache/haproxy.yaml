profile::cache::haproxy::do_ocsp: true
profile::cache::haproxy::h2settings:
  header_table_size: 4096
  initial_window_size: 65535
  max_concurrent_streams: 100
profile::cache::haproxy::timeout:
  client: 120
  client_fin: 120
  connect: 3
  http_request: 3600
  keep_alive: 120
  server: 180
  tunnel: 3600
# port 80 timeout.
profile::cache::haproxy::redirection_timeout:
  client: 3
  client_fin: 1
  connect: 0 # N/A
  http_request: 3
  keep_alive: 3
  server: 0 # N/A
  tunnel: 0 # N/A
profile::cache::haproxy::tls13_ciphers: TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_256_GCM_SHA384
profile::cache::haproxy::tls_ciphers: -ALL:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256
profile::cache::haproxy::tls_port: 443
profile::cache::haproxy::tls_cachesize: 512000
profile::cache::haproxy::tls_session_lifetime: 86400
profile::cache::haproxy::unified_acme_chief: true
profile::cache::haproxy::unified_acme_chief_certs:
    - unified
    - unified-goog
profile::cache::haproxy::unified_certs:
    - digicert-2024-ecdsa-unified
profile::cache::haproxy::varnish_socket:
  prefix: 'unix'
  address: /run/varnish-frontend-0.socket

profile::cache::haproxy::monitoring_enabled: true
profile::cache::haproxy::version: haproxy28
profile::cache::haproxy::do_systemd_hardening: true
profile::cache::haproxy::http_disable_keepalive: true
profile::cache::haproxy::dedicated_hc_backend: true

profile::cache::haproxy::extended_logging: true
profile::cache::haproxy::use_haproxykafka: true

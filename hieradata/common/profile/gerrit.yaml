profile::gerrit::ipv6: ~
profile::gerrit::enable_monitoring: true

profile::gerrit::mask_service: false

profile::gerrit::host: 'gerrit.wikimedia.org'
profile::gerrit::config: 'gerrit.config.erb'

profile::gerrit::active_host: 'gerrit2003.wikimedia.org'
profile::gerrit::replica_host: 'gerrit1003.wikimedia.org'
profile::gerrit::spare_host: 'gerrit2002.wikimedia.org'

profile::gerrit::replica_hosts:
    - 'gerrit-replica.wikimedia.org'

profile::gerrit::spare_hosts:
    - 'gerrit-spare.wikimedia.org'

profile::gerrit::migration::data_dir: '/srv/gerrit'

profile::gerrit::lfs_replica_sync: true
profile::gerrit::lfs_sync_dest:
    - "%{lookup('profile::gerrit::replica_host')}"
    - "%{lookup('profile::gerrit::spare_host')}"

# External backups
profile::gerrit::backups_enabled: true
profile::gerrit::backup_set: 'gerrit-repo-data'

# SSL/TLS certs
profile::gerrit::use_acmechief: true

## Deployment
profile::gerrit::daemon_user: 'gerrit'
profile::gerrit::daemon_user_dir: "/srv/%{lookup('profile::gerrit::daemon_user')}"
# internal gerrit user, differenciated from SSH
profile::gerrit::service_account: 'gerrit2'
profile::gerrit::gerrit_site: "/srv/gerrit/site_path/review_site"
profile::gerrit::scap_user: 'gerrit-deploy'
profile::gerrit::manage_scap_user: true
profile::gerrit::scap_key_name: 'gerrit'

# List of gerrit servers used in firewall rules.
profile::gerrit::ssh_allowed_hosts:
 - "%{lookup('profile::gerrit::active_host')}"

# Assume all production nodes are replicas
profile::gerrit::git_dir: '/srv/gerrit/git'

profile::gerrit::ssh_host_keys:
  - 'ssh_host_ed25519_key'

profile::gerrit::spare_replication_enabled: true
profile::gerrit::replication::settings:
    replica-settings: &REPLICA_SETTINGS
        mirror: true
        replicateProjectDeletions: true
        replicateHiddenProjects: true
        defaultForceUpdate: true
        threads: 4
        replicationDelay: 5
        rescheduleDelay: 5
profile::gerrit::replication:
    github:
        url: 'git@github.com:wikimedia/${name}'
        authGroup: 'mediawiki-replication'
        remoteNameStyle: 'dash'
        mirror: false
        push:
            - '+refs/heads/*:refs/heads/*'
            - '+refs/tags/*:refs/tags/*'
        createMissingRepositories: false
        threads: 2
        maxRetries: 50
        rescheduleDelay: 15
        replicatePermissions: false
        #
        # We drop the whole apps/ hierarchy that has been entirely archived.
        # Notes:
        # - double escape backslashes: once for regex, once for gitconfig
        #   formatting
        # - there can be ONLY one inverted match, else the second will match
        #   the one excluded by the first - T392198
        # You are better of reparenting the project to All-Archived-Projects
        # which BLOCK Read for the group mediawiki-replication. This is only
        # kept to ensure we do not replicate the GitHub apps.
        #
        projects:
            - '^(?:(?!apps\\/).)*$'
    replica:
        <<: *REPLICA_SETTINGS
        url: "%{lookup('profile::gerrit::daemon_user')}@%{lookup('profile::gerrit::replica_host')}:/srv/gerrit/git/${name}.git"
    spare:
        <<: *REPLICA_SETTINGS
        url: "%{lookup('profile::gerrit::daemon_user')}@%{lookup('profile::gerrit::spare_host')}:/srv/gerrit/git/${name}.git"


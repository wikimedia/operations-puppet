# Service catalog.
# This entry includes all the information about the WMF internal and external services.
# Every entry in the hash must have a label (the service name) and its body must adhere to the
# Wmflib::Service type. Refer to the documentation of that type, and all the sub-types, for details.
#
# When adding a new field, it needs to be added to spicerack as well, see for example
# https://gerrit.wikimedia.org/r/c/operations/software/spicerack/+/909299
#
# Please keep entries separated by an empty line to allow for easy navigation of the file.

service::catalog:
  apertium:
    description: Machine Translation service. apertium.discovery.wmnet
    encryption: true
    ip:
      codfw:
        default: 10.2.1.11
      eqiad:
        default: 10.2.2.11
    lvs:
      class: low-traffic
      conftool:
        cluster: kubernetes
        service: kubesvc
      depool_threshold: 0.5
      enabled: true
      monitors:
        IdleConnection:
          max-delay: 300
          timeout-clean-reconnect: 3
      scheduler: mh
      scheduler_flag: mh-port
      ipip_encapsulation:
        - eqiad
        - codfw
    page: false
    probes:
      - type: http
        path: /listPairs
    port: 4737
    sites:
      - codfw
      - eqiad
    state: production
    discovery:
      - dnsdisc: apertium
        active_active: true

  apus:
    description: 'Ceph-backed async-replicated S3 cluster'
    discovery:
      - dnsdisc: apus
        active_active: true
    encryption: true
    ip:
      codfw:
        default: 10.2.1.10
      eqiad:
        default: 10.2.2.10
    lvs:
      class: low-traffic
      conftool:
        cluster: apus
        service: apus
      depool_threshold: 0.3
      enabled: true
      monitors:
        IdleConnection:
          max-delay: 300
          timeout-clean-reconnect: 3
        ProxyFetch:
          url:
            - https://apus.discovery.wmnet/
      scheduler: mh
      scheduler_flag: mh-port
      ipip_encapsulation:
        - eqiad
        - codfw
    page: true
    port: 443
    probes:
      - type: http
        path: /
        host: apus.discovery.wmnet
    sites:
      - codfw
      - eqiad
    state: production
    # T422166: Temporary exclusion due to docker-registry connection-caching issues.
    exclude_from_switchover: true

  aux-k8s-ctrl:
    description: 'Kubernetes API service for aux cluster'
    encryption: true
    ip:
      eqiad:
        default: '10.2.2.74'
      codfw:
        default: '10.2.1.74'
    lvs:
      class: 'low-traffic'
      conftool:
        cluster: 'aux-k8s'
        service: 'kubemaster'
      depool_threshold: 0.5
      enabled: true
      monitors:
        IdleConnection:
          max-delay: 300
          timeout-clean-reconnect: 3
      scheduler: mh
      scheduler_flag: mh-port
      ipip_encapsulation:
        - eqiad
        - codfw
    port: 6443
    sites:
      - 'eqiad'
      - 'codfw'
    state: 'production'

  k8s-ingress-aux:
    description: "istio-ingresscontroller on aux-k8s. k8s-ingress-aux-(ro|rw).discovery.wmnet"
    encryption: true
    ip: &k8s-ingress-aux_ips
      eqiad:
        default: 10.2.2.78
      codfw:
        default: 10.2.1.78
    lvs:
      class: low-traffic
      conftool:
        cluster: aux-k8s
        service: kubesvc
      depool_threshold: 0.5
      enabled: true
      monitors:
        IdleConnection:
          max-delay: 300
          timeout-clean-reconnect: 3
      scheduler: mh
      scheduler_flag: mh-port
      ipip_encapsulation:
        - eqiad
        - codfw
    # The ingressgateway does not accept connections on 30443 if no backend is
    # configured (which is fine from ingressgateways POV). That means PyBal might
    # see all hosts as down during initial setup of ingressgateway.
    # Also there is no TLS certificate or route for the discovery FQDN configured
    # in ingressgateway and it is not possible to do so just within it's envoy
    # instance (e.g. without adding another service).
    # Because of all that, just check the tcp connection here as well.
    #
    # Kubernetes will internally check the ingressgateways dedicated health check
    # port and will pull the iptables rules used to forward traffic to ingressgateway
    # in case health check fails. That in turn means tcp connections will be rejected
    # leading this check and PyBal monitor to fail.
    probes:
      - type: tcp-notls
    port: &k8s-ingress-aux_port 30443
    sites:
      - eqiad
      - codfw
    state: production
    page: false
    discovery:
      - dnsdisc: k8s-ingress-aux-ro
        active_active: true
      - dnsdisc: k8s-ingress-aux-rw
        active_active: false

  jaeger-collector-http:
    description: Jaeger tracing, collector (HTTP)
    encryption: true
    ip: *k8s-ingress-aux_ips
    page: false
    probes:
      - type: tcp
    port: *k8s-ingress-aux_port
    sites:
      - eqiad
    state: production


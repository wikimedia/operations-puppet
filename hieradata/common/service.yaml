      - eqiad
    state: production
    discovery:
      - dnsdisc: k8s-ingress-ml-serve
        active_active: true


  k8s-ingress-dse:
    description: istio-ingresscontroller on kubernetes. k8s-ingress-dse.discovery.wmnet
    encryption: true
    ip: &k8s-ingress-dse_ips
      eqiad:
        default: 10.2.2.91
      codfw:
        default: 10.2.1.91
    lvs:
      class: low-traffic
      conftool:
        cluster: dse-k8s
        service: kubesvc
      depool_threshold: 0.5
      enabled: true
      monitors:
        IdleConnection:
          max-delay: 300
          timeout-clean-reconnect: 3
      scheduler: mh
      scheduler_flag: mh-port
      ipip_encapsulation:
        - eqiad
        - codfw
    page: false
    # The ingressgateway does not accept connections on 30443 if no backend is
    # configured (which is fine from ingressgateways POV). That means PyBal might
    # see all hosts as down during initial setup of ingressgateway.
    # Also there is no TLS certificate or route for the discovery FQDN configured
    # in ingressgateway and it is not possible to do so just within it's envoy
    # instance (e.g. without adding another service).
    # Because of all that, just check the tcp connection here as well.
    #
    # Kubernetes will internally check the ingressgateways dedicated health check
    # port and will pull the iptables rules used to forward traffic to ingressgateway
    # in case health check fails. That in turn means tcp connections will be rejected
    # leading this check and PyBal monitor to fail.
    probes:
      - type: tcp-notls
    port: &k8s-ingress-dse_port 30443
    sites:
      - eqiad
      - codfw
    state: production
    discovery:
      - dnsdisc: k8s-ingress-dse
        active_active: false
      - dnsdisc: k8s-ingress-dse-aa
        active_active: true
    # not all services run in codfw
    exclude_from_switchover: true

  k8s-ingress-dse-postgresql:
    description: SNI-based TLS passthrough to PostgreSQL (CloudnativePG) clusters, via the dse-k8s istio-ingressgateway
    encryption: true
    # The eqiad VIP of k8s-ingress-dse. This service is eqiad-only, as the
    # cloudnative-pg operator is not deployed to dse-k8s-codfw.
    ip:
      eqiad:
        default: 10.2.2.91
    lvs:
      class: low-traffic
      conftool:
        cluster: dse-k8s
        service: kubesvc
      depool_threshold: 0.5
      enabled: true
      monitors:
        IdleConnection:
          max-delay: 300
          timeout-clean-reconnect: 3
      scheduler: mh
      scheduler_flag: mh-port
      ipip_encapsulation:
        - eqiad
    page: false
    # The ingressgateway only opens a listener on this port once at least one
    # Gateway object for it exists in the cluster (these are created by the
    # cloudnative-pg-cluster chart when its ingress option is enabled). Until
    # then, connections to the nodePort are refused. As with k8s-ingress-dse,
    # just check the tcp connection here.
    probes:
      - type: tcp-notls
    port: 31432
    sites:
      - eqiad
    state: production


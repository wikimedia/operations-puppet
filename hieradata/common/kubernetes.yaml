          - name: "istio-cni"
            type: "istio-cni"
            log_level: "info"
            kubernetes:
              kubeconfig: "/etc/cni/net.d/istio-kubeconfig"
              cni_bin_dir: "/opt/cni/bin"
              exclude_namespaces:
                - istio-system
                - kube-system
                - knative-serving
                - cert-manager
                - kserve

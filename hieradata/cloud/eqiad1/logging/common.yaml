kafka_clusters:
  logging-beta:
    zookeeper_cluster_name: main-deployment-prep
    brokers:
      deployment-kafka-logging01.deployment-prep.eqiad1.wikimedia.cloud:
        id: 1001
        rack: B

zookeeper_clusters:
  main-deployment-prep:
    hosts:
      deployment-zookeeper02.eqiad.wmflabs: '2'

prometheus_nodes:
  - logging-alert-01.logging.eqiad1.wikimedia.cloud
  - logging-alert-02.logging.eqiad1.wikimedia.cloud

profile::benthos::instances: {}

# API access
profile::opensearch::api::httpd_proxy::vhost: logs-api.svc.logging.eqiad1.wikimedia.cloud
profile::opensearch::api::httpd_proxy::serveradmin: 'https://wikitech.wikimedia.org/wiki/SRE/Observability'
profile::opensearch::api::httpd_proxy::auth_type: local-api
profile::opensearch::api::httpd_proxy::auth_realm: local
profile::opensearch::api::httpd_proxy::require_ssl: false
# we manage htaccess and htgroup files manually in beta
profile::opensearch::api::httpd_proxy::manage_local_users: false
# opensearch dashboards defines httpd mods 'authz_groupfile' and 'authz_user' in beta
# workaround to avoid duplicate declaration errors
profile::opensearch::api::httpd_proxy::install_httpd_mods: false
profile::opensearch::api::httpd_proxy::auth_file: '/etc/opensearch-api-htpasswd'
profile::opensearch::api::httpd_proxy::group_file: '/etc/opensearch-api-htgroup'

logstash::heap_memory: 3G
logstash::pipeline_batch_size: 1000

# known public
profile::logstash::collector::input_kafka_ssl_truststore_passwords:
  logging-beta: 'changeit'
profile::logstash::collector::input_kafka_consumer_group_id: 'logging-logstash'
# profile::logstash::collector::output_public_loki_host: 'logging-grafana-01.logging.eqiad1.wikimedia.cloud'

# There is no deployment server in the logging env.
scap::deployment_server: "%{facts.networking.fqdn}"
scap::enable_bootstrapping: false

profile::opensearch::dashboards::httpd_proxy::auth_file: '/etc/logstash/htpasswd'
profile::opensearch::dashboards::httpd_proxy::auth_type: 'local'
profile::opensearch::dashboards::httpd_proxy::auth_realm: 'local'
profile::opensearch::dashboards::httpd_proxy::vhost: 'beta-logs.wmcloud.org'
profile::opensearch::dashboards::httpd_proxy::serveradmin: 'root@logging-logstash-04.logging.eqiad1.wikimedia.cloud'
profile::opensearch::dashboards::phatality::provision_scap: false

# enforces phatality plugin version
profile::opensearch::dashboards::phatality::version: '2.7.0.3'

profile::opensearch::apt_component: 'component/opensearch27'
profile::opensearch::version: '2.7.0'
profile::opensearch::rack: ''
profile::opensearch::row: ''
profile::opensearch::instances: {}
profile::opensearch::base_data_dir: '/srv/opensearch'
profile::opensearch::pki_intermediate_name: &pki_intermediate_name 'BetaLogs_OpenSearch'
profile::opensearch::dc_settings:

  short_cluster_name: beta
  cluster_hosts:
    - logging-opensearch-ssd-01.logging.eqiad1.wikimedia.cloud
    - logging-opensearch-ssd-02.logging.eqiad1.wikimedia.cloud
    - logging-opensearch-ssd-03.logging.eqiad1.wikimedia.cloud
    - logging-opensearch-ssd-04.logging.eqiad1.wikimedia.cloud
    - logging-opensearch-ssd-05.logging.eqiad1.wikimedia.cloud
    - logging-opensearch-ssd-06.logging.eqiad1.wikimedia.cloud
    - logging-opensearch-hdd-01.logging.eqiad1.wikimedia.cloud
    - logging-opensearch-hdd-02.logging.eqiad1.wikimedia.cloud
    - logging-logstash-02.logging.eqiad1.wikimedia.cloud
    - logging-logstash-03.logging.eqiad1.wikimedia.cloud
    - logging-logstash-04.logging.eqiad1.wikimedia.cloud
  unicast_hosts:
    - logging-opensearch-ssd-01.logging.eqiad1.wikimedia.cloud
    - logging-opensearch-ssd-02.logging.eqiad1.wikimedia.cloud
    - logging-opensearch-ssd-03.logging.eqiad1.wikimedia.cloud
    - logging-opensearch-ssd-04.logging.eqiad1.wikimedia.cloud
    - logging-opensearch-ssd-05.logging.eqiad1.wikimedia.cloud
    - logging-opensearch-ssd-06.logging.eqiad1.wikimedia.cloud
    - logging-opensearch-hdd-01.logging.eqiad1.wikimedia.cloud
    - logging-opensearch-hdd-02.logging.eqiad1.wikimedia.cloud

# unset the explicit version setting
opensearch::curator::version: 'present'

profile::logstash::collector::cluster_name: *cluster_name
profile::logstash::collector::pki_intermediate_name: *pki_intermediate_name

profile::opensearch::common_settings:
  auto_create_index: true
  awareness_attributes: ''
  recover_after_nodes: 2
  recover_after_time: '1m'
  # Dont encourage some sort of accidental feedback loop
  send_logs_to_logstash: false
  http_port: 9200
  transport_tcp_port: 9300
  curator_uses_unicast_hosts: false
  filter_cache_size: '10%'
  holds_data: false
  disable_security_plugin: true

profile::opensearch::security_plugin::manage_internal_users: false
profile::opensearch::logstash::jobs_host: 'logging-logstash-03.logging.eqiad1.wikimedia.cloud'
profile::opensearch::curator::enable: true
profile::opensearch::logstash::curator_jobs:
  cluster_wide:
    '01':
      description: 'logstash: delete older than 14 days'
      action: delete_indices
      options:
        ignore_empty_list: true
        timeout_override: 300
      filters:
        - filtertype: pattern
          kind: prefix
          value: 'logstash-'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%m.%d'
          unit: days
          unit_count: 14

    '02':
      description: 'dlq: delete older than 2 days'
      action: delete_indices
      options:
        ignore_empty_list: true
        timeout_override: 120
      filters:
        - filtertype: pattern
          kind: prefix
          value: 'dlq-'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%m.%d'
          unit: days
          unit_count: 2

    '03':
      description: 'ecs-default policy rev 1: delete older than 2 weeks'
      action: delete_indices
      options:
        ignore_empty_list: true
        timeout_override: 120
      filters:
        - filtertype: pattern
          kind: prefix
          value: 'ecs-default-1-'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%W'
          unit: weeks
          unit_count: 2

    '04':
      description: 'ecs-test policy rev 1: delete older than 2 weeks'
      action: delete_indices
      options:
        ignore_empty_list: true
        timeout_override: 120
      filters:
        - filtertype: pattern
          kind: prefix
          value: 'ecs-test-1-'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%W'
          unit: weeks
          unit_count: 2

    '05':
      description: 'ecs-alerts policy rev 1: delete older than 2 weeks'
      action: delete_indices
      options:
        ignore_empty_list: true
        timeout_override: 120
      filters:
        - filtertype: pattern
          kind: regex
          value: '^ecs-(1.7.0-\d\d?-alerts|alerts-1)-.*$'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%W'
          unit: weeks
          unit_count: 2

    '06':
      description: 'ecs-alerts-2: delete older than 5 years'
      action: delete_indices
      options:
        ignore_empty_list: true
        timeout_override: 120
      filters:
        - filtertype: pattern
          kind: prefix
          value: 'ecs-alerts-2-'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y'
          unit: years
          # count of 6 to inclusively retain the last calendar day minus five years.
          # ( e.g. 2024(deleted 2030-01-01), 2025, 2026, 2027, 2028, 2029, 2030(current year index) )
          unit_count: 6

    '07':
      description: 'w3creportingapi-1.0.0: delete older than 2 weeks'
      action: delete_indices
      options:
        ignore_empty_list: true
        timeout_override: 120
      filters:
        - filtertype: pattern
          kind: prefix
          value: 'w3creportingapi-default-'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%W'
          unit: weeks
          unit_count: 2

    '08':
      description: 'ecs-probes-1: delete monitoring probes logs older than 10 days'
      action: delete_indices
      options:
        ignore_empty_list: true
        timeout_override: 120
      filters:
        - filtertype: pattern
          kind: prefix
          value: 'ecs-probes-1-'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%m.%d'
          unit: days
          unit_count: 10

    '09':
      description: 'ecs-mediawiki policy rev 1: delete older than 2 weeks'
      action: delete_indices
      options:
        ignore_empty_list: true
        timeout_override: 120
      filters:
        - filtertype: pattern
          kind: prefix
          value: 'ecs-mediawiki-1-'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%W'
          unit: weeks
          unit_count: 2

    '10':
      description: 'jaeger: delete older than 32 days'
      action: delete_indices
      options:
        ignore_empty_list: true
        timeout_override: 120
      filters:
        - filtertype: pattern
          kind: regex
          value: '^jaeger-(service|span)-'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%m.%d'
          unit: days
          unit_count: 32

    '11':
      description: 'thumbor: delete older than 7 days'
      action: delete_indices
      options:
        ignore_empty_list: true
        timeout_override: 120
      filters:
        - filtertype: pattern
          kind: prefix
          value: 'logstash-thumbor-'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%m.%d'
          unit: days
          unit_count: 7

    '12':
      description: 'ecs-k8s policy rev 1: delete older than 2 weeks'
      action: delete_indices
      options:
        ignore_empty_list: true
        timeout_override: 120
      filters:
        - filtertype: pattern
          kind: prefix
          value: 'ecs-k8s-1-'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%W'
          unit: weeks
          unit_count: 2

    '13':
      description: 'ecs-webrequest policy rev 1: delete older than 2 weeks'
      action: delete_indices
      options:
        ignore_empty_list: true
        timeout_override: 120
      filters:
        - filtertype: pattern
          kind: prefix
          value: 'ecs-webrequest-1-'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%W'
          unit: weeks
          unit_count: 2

# T390215
    '14':
      description: 'logstash-ml: delete after 10 days'
      action: delete_indices
      options:
        ignore_empty_list: true
        timeout_override: 120
      filters:
        - filtertype: pattern
          kind: prefix
          value: 'logstash-ml-'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%m.%d'
          unit: days
          unit_count: 10

    '20':
      description: 'all: after 1 days set number of replicas to 0'
      action: replicas
      options:
        count: 0
        ignore_empty_list: true
        timeout_override: 120
      filters:
        - filtertype: pattern
          kind: prefix
          exclude: true  # exclude special indexes
          value: '^\..*'
        - filtertype: age
          source: creation_date
          direction: older
          unit: days
          unit_count: 1

    '21':
      description: 'logstash-webrequest-1: after 1 day set number of replicas to 1'
      action: replicas
      options:
        count: 1
        ignore_empty_list: true
      filters:
        - filtertype: pattern
          kind: prefix
          value: 'logstash-webrequest-1-'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%m.%d'
          unit: days
          unit_count: 1

    '22':
      description: 'logstash-thumbor-1: after 1 day set number of replicas to 1'
      action: replicas
      options:
        count: 1
        ignore_empty_list: true
      filters:
        - filtertype: pattern
          kind: prefix
          value: 'logstash-thumbor-1-'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%m.%d'
          unit: days
          unit_count: 1

    '23':
      description: 'ecs-webrequest-1: after 1 day set number of replicas to 1'
      action: replicas
      options:
        count: 1
        ignore_empty_list: true
      filters:
        - filtertype: pattern
          kind: prefix
          value: 'ecs-webrequest-1-'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%W'
          unit: weeks
          unit_count: 1

    '24':
      description: 'logstash-ml-1: after 1 day set number of replicas to 1'
      action: replicas
      options:
        count: 1
        ignore_empty_list: true
      filters:
        - filtertype: pattern
          kind: prefix
          value: 'logstash-ml-1-'
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y.%m.%d'
          unit: days
          unit_count: 1

    # For any indices prefixed by "logstash-", and have "index.routing.allocation.require.disktype":"ssd" set,
    # and are older than 7 days, set "index.routing.allocation.require.disktype":"hdd".
    '40':
      description: 'logstash: allocate older shards on hdd nodes'
      action: allocation
      options:
        key: disktype
        value: hdd
        allocation_type: require
        ignore_empty_list: true
      filters:
        - filtertype: pattern
          kind: prefix
          value: 'logstash-'
        - filtertype: allocated
          key: disktype
          value: ssd
          allocation_type: require
          exclude: false
        - filtertype: age
          source: creation_date
          direction: older
          unit: days
          unit_count: 7

    '41':
      description: 'logstash-ml: allocate shards on hdd nodes after 14 days'
      action: allocation
      options:
        key: disktype
        value: hdd
        allocation_type: require
        ignore_empty_list: true
      filters:
        - filtertype: pattern
          kind: prefix
          value: 'logstash-ml-'
        - filtertype: allocated
          key: disktype
          value: ssd
          allocation_type: require
          exclude: false
        - filtertype: age
          source: creation_date
          direction: older
          unit: days
          unit_count: 14

    # forceMerge older indices (based on index creation_date) to 1 segments per shard.
    # Delay 120 seconds between each forceMerge operation to allow the cluster to quiesce.
    '90':
      description: 'all: forcemerge older indexes'
      action: forcemerge
      options:
        max_num_segments: 1
        delay: 120
        continue_if_exception: false
      filters:
        - filtertype: forcemerged
          max_num_segments: 1
        - filtertype: pattern
          kind: regex
          exclude: true  # exclude special indexes
          value: '^\..*'
        - filtertype: age
          source: creation_date
          direction: older
          unit: days
          unit_count: 2

profile::grafana::enable_loki: true
profile::grafana::enable_cas: false
profile::grafana::server_aliases: []
profile::grafana::domain: 'localhost'
profile::grafana::config:
  auth.ldap:
    enabled: false
  auth.proxy:
    enabled: false
profile::grafana::loki::allow_from:
  - 'logging-logstash-02.logging.eqiad1.wikimedia.cloud'
  - 'logging-logstash-03.logging.eqiad1.wikimedia.cloud'
  - 'logging-logstash-04.logging.eqiad1.wikimedia.cloud'
profile::grafana::loki::config:
  auth_enabled: false
  server:
    http_listen_port: 3100
    grpc_listen_port: 9096
    # Increase to 20mb from incredibly low 4mb default value.
    # Hitting this limit manifests as a 502 error on the frontend
    # and a "grpc: received message larger than max (<bytes> vs. 4194304)"
    # from the query scheduler
    grpc_server_max_send_msg_size: 20500000
    grpc_server_max_recv_msg_size: 20500000

  common:
    path_prefix: '/var/lib/loki'
    storage:
      filesystem:
        chunks_directory: '/var/lib/loki/chunks'
        rules_directory: '/var/lib/loki/rules'
    replication_factor: 1
    ring:
      instance_addr: '127.0.0.1'
      kvstore:
        store: 'inmemory'

  table_manager:
    retention_deletes_enabled: true
    retention_period: '3d'

  schema_config:
    configs:
      - from: '2022-01-01'
        store: 'boltdb-shipper'
        object_store: 'filesystem'
        schema: 'v11'
        index:
          prefix: 'index_'
          period: '24h'

  limits_config:
    retention_period: 7d

  compactor:
    delete_request_cancel_period: 10m
    retention_enabled: true
    retention_delete_delay: 2h

# MediaWiki apache configuration
mediawiki::sites:
  - name: beta-specific
    source: mediawiki/apache/beta/sites/beta_specific.conf
    priority: 1
  - name: main
    source: mediawiki/apache/beta/sites/main.conf
    priority: 1
  # the sites in beta are now organized like in production
  # this is slightly more complicated but ultimately worth it.
  - name: beta_sites
    priority: 2
    defaults:
      docroot: "/srv/mediawiki/docroot/standard-docroot"
      legacy_rewrites: false
      public_rewrites: true
      short_urls: false
      declare_site: false
      domain_suffix: "beta.wmcloud.org"
      variant_aliases:
        [
          "sr",
          "sr-ec",
          "sr-el",
          "zh",
          "zh-hans",
          "zh-hant",
          "zh-cn",
          "zh-hk",
          "zh-sg",
          "zh-tw",
        ]
    vhosts:
      - name: wikidata
        params:
          server_name: www.wikidata.beta.wmcloud.org
          docroot: "/srv/mediawiki/docroot/wikidata.org"
          wikibase_rewrites: true
          additional_rewrites:
            early: []
            late: []
      - name: wiktionary
        params:
          server_aliases: ["*.wiktionary.beta.wmcloud.org"]
          docroot: "/srv/mediawiki/docroot/wiktionary.org"
      - name: wikiquote
        params:
          server_aliases: ["*.wikiquote.beta.wmcloud.org"]
          docroot: "/srv/mediawiki/docroot/wikiquote.org"
      - name: wikimedia-misc-sites
        params:
          docroot: "/srv/mediawiki/docroot/wikimedia.org"
          server_aliases:
            [
              "foundation.wikimedia.beta.wmcloud.org",
              "incubator.wikimedia.beta.wmcloud.org",
              "login.wikimedia.beta.wmcloud.org",
              "meta.wikimedia.beta.wmcloud.org",
              "vote.wikimedia.beta.wmcloud.org"
            ]
      - name: wikimediacommons
        params:
          server_name: commons.wikimedia.beta.wmcloud.org
          wikibase_rewrites: true
          additional_rewrites:
            early: []
            late:
              - "    # /data/ path T163922"
              - "    RewriteRule ^/data/(.*)/(.*)$ %%{}{ENV:RW_PROTO}://commons.wikimedia.org/wiki/Special:PageData/$1/$2 [R=301,QSA]"
      - name: wikipedia
        params:
          server_aliases: [ "*.wikipedia.beta.wmcloud.org"]
          docroot: "/srv/mediawiki/docroot/wikipedia.org"
          additional_rewrites:
            early: []
            late:
              [
                "    RewriteRule ^/data/(.*)/(.*)$ /wiki/Special:PageData/$1/$2 [R=303,QSA]",
              ]
      - name: wikibooks
        params:
          server_aliases: ["*.wikibooks.beta.wmcloud.org"]
          docroot: "/srv/mediawiki/docroot/wikibooks.org"
      - name: wikisource
        params:
          server_aliases: ["*.wikisource.beta.wmcloud.org"]
          docroot: "/srv/mediawiki/docroot/wikisource.org"
      - name: wikinews
        params:
          server_aliases: ["*.wikinews.beta.wmcloud.org"]
          docroot: "/srv/mediawiki/docroot/wikinews.org"
      - name: wikiversity
        params:
          server_aliases: ["*.wikiversity.beta.wmcloud.org"]
          docroot: "/srv/mediawiki/docroot/wikiversity.org"
      - name: wikivoyage
        params:
          server_aliases: ["*.wikivoyage.beta.wmcloud.org" ]
          docroot: "/srv/mediawiki/docroot/wikivoyage.org"
          variant_aliases:
            [
              "zh",
              "zh-hans",
              "zh-hant",
              "zh-cn",
              "zh-hk",
              "zh-mo",
              "zh-my",
              "zh-sg",
              "zh-tw",
            ]
  # not a real wiki, but an alternative way to reach other wikis for auth cookie sharing
  # other than a path prefix, needs identical handling to proper wiki domains
  - name: auth
    priority: 2
    defaults:
      docroot: "/srv/mediawiki/docroot/auth"
      legacy_rewrites: false
      # robots.txt, favicon.ico are static files in the docroot instead
      public_rewrites: false
      domain_suffix: "beta.wmcloud.org"
    vhosts:
      - name: auth
        params:
          server_aliases: [
            "auth.wikimedia.beta.wmcloud.org"
          ]
          additional_rewrites:
            early:
              - "    # Redirect requests for the root of the domain to something nice"
              - "    RewriteRule ^/$ https://www.wikimedia.beta.wmcloud.org [R=302,L]"
              - "    # Serve static files before the below RewriteRule can match (T385520)"
              - "    RewriteRule ^/\\.well-known/ - [L]"
              - "    RewriteRule ^/static/ - [L]"
              - "    # T365162 strip the prefix used to identify the wiki"
              - "    # (T380551#10368927 don't mess up the 404 error page)"
              - "    RewriteCond %%{}{REQUEST_URI} !=/w/404.html"
              - "    RewriteRule ^/([^/]*)/(.*)$ /$2"
              - "    # Primary wiki redirector: [this applies after the prefix is stripped above]"
              - "    RewriteRule ^/$ /w/index.php"
              - "    # Custom error page (T383952)"
              - "    ErrorDocument 404 /404.html"
            late: []
  # www.wikimedia.beta.wmcloud.org also catches *.wikimedia.beta.wmcloud.org
  # so it needs to come last.
  # (keep in sync with hieradata/common/mediawiki.yaml)
  - name: www.wikimedia.beta.wmcloud.org
    template: mediawiki/apache/sites/included/www.wikimedia.org.conf.erb
    priority: 10

profile::mediawiki::webserver::default_php_version: "7.4"
profile::mediawiki::jobrunner::default_php_version: "7.4"
# Enable icu67 component - T345561
profile::mediawiki::php::icu67: true

# T367118 Moved confd definition out of scap::dsh
profile::confd::instances:
  main:
    interval: 300

profile::cache::haproxykafka::ensure: absent
profile::cache::haproxykafka::kafka_cluster_name: main-deployment-prep
profile::cache::haproxykafka::workers: 2
profile::cache::haproxykafka::message_buffer: 1.0e+6
profile::cache::haproxykafka::sdid: haproxykafka@0
profile::cache::haproxykafka::socket:
  path: /var/run/haproxykafka/haproxykafka.sock
  mode: "0622"
  user: haproxykafka
  group: haproxykafka
  batch_size: 102400
  batch_deadline: "1000ms"
profile::cache::haproxykafka::logparser:
  batch_size: 102400
  batch_deadline: "1000ms"
profile::cache::haproxykafka::kafka:
  topic: webrequest_undefined
  dlq_topic: webrequest_errors
  flush_timeout: 1000
  batch_size: 102400
  batch_deadline: "1000ms"
  rdkafka:
    acks: "all"
    client.id: "%{facts.networking.hostname}"
    security.protocol: "SSL"
    ssl.ca.location: "/etc/ssl/certs/wmf-ca-certificates.crt"
    ssl.cipher.suites: "ECDHE-ECDSA-AES256-GCM-SHA384"
    ssl.curves.list: "P-256"
    ssl.sigalgs.list: "ECDSA+SHA256"
    queue.buffering.max.messages: 720000
    queue.buffering.max.ms: 1000
    batch.num.messages: 9000
    compression.codec: "snappy"
    topic.request.required.acks: 1
profile::cache::haproxykafka::monitoring:
  enable_pprof: true
  enable_prometheus: true
  server_bind: ":9341"
  prometheus_prefix: "haproxykafka_"
  prometheus_parsing_buckets:
    - 5.0e-6
    - 1.0e-5
    - 5.0e-5
    - 1.0e-4
    - 5.0e-4
    - 1.0e-3
    - 5.0e-3
  prometheus_processing_buckets:
    - 1.0e-6
    - 5.0e-6
    - 1.0e-5
    - 2.0e-5
    - 3.0e-5
    - 5.0e-5
    - 1.0e-4
    - 5.0e-4
    - 1.0e-3
profile::cache::haproxykafka::transform_rules:
  haproxy_format: "02/Jan/2006:15:04:05.000"
  date_format: "2006-01-02T15:04:05Z"
  date_tz: UTC

# no GeoIP databases in the cloud
profile::cache::base::use_geo_ip: false

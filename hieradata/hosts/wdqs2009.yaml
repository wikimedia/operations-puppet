# override settings for wdqs2009, a temporary endpoint for the legacy
# full graph service. Ref T384422
cluster: wdqs-legacy-full
profile::envoy::ensure: present
profile::tlsproxy::envoy::ssl_provider: 'cfssl'
profile::tlsproxy::envoy::sni_support: 'yes'
profile::tlsproxy::envoy::services:
  - server_names:
      - '*'
    port: 80
profile::tlsproxy::envoy::cfssl_options:
  hosts:
    - "%{facts.fqdn}"
    - 'wdqs.discovery.wmnet'
    - 'wdqs.svc.codfw.wmnet'
    - 'wdqs.wikimedia.org'
    - 'query.wikidata.org'
    - 'query-legacy-full.wikidata.org'
profile::tlsproxy::envoy::global_cert_name: 'query-legacy-full.wikidata.org'
profile::tlsproxy::envoy::use_remote_address: false
profile::tlsproxy::envoy::listen_ipv6: true

lookup_options:
  profile::opensearch::common_settings:
    merge:
      strategy: first
profile::opensearch::rack: F7
profile::opensearch::row: F
profile::opensearch::version: '2.19.5'
profile::opensearch::config_version: '2'
profile::opensearch::java_home: '/usr/lib/jvm/java-21-openjdk-amd64'
# Full override of common_settings for OS2.
# The global lookup_options deep-merges common_settings, which unions
# arrays — so the role-level plugins_mandatory (with 'ltr') would merge
# with ours (with 'opensearch-ltr'), producing both. We force 'first'
# merge strategy above so this host-level hash replaces the role-level
# entirely. All role-level keys must be duplicated here to avoid losing
# production-tuned settings (heap_memory, shard limits, etc.).
# TODO: once all cloudelastic hosts are on OS2, move opensearch-ltr to
# the role level and remove this override + lookup_options to avoid drift.
profile::opensearch::common_settings:
  awareness_attributes: 'row'
  plugins_mandatory:
    - analysis-hebrew
    - analysis-icu
    - analysis-smartcn
    - analysis-stempel
    - analysis-ukrainian
    - cirrus-highlighter
    - opensearch-analysis-stconvert
    - opensearch-extra
    - opensearch-extra-analysis-esperanto
    - opensearch-extra-analysis-homoglyph
    - opensearch-extra-analysis-khmer
    - opensearch-extra-analysis-serbian
    - opensearch-extra-analysis-slovak
    - opensearch-extra-analysis-textify
    - opensearch-extra-analysis-turkish
    - opensearch-extra-analysis-ukrainian
    - opensearch-ltr
    - repository-s3
  heap_memory: '30G'
  bind_networks:
    - 0.0.0.0
  certificate_name: cloudelastic
  recover_after_time: '5m'
  search_shard_count_limit: 5000
  ltr_cache_size: '100mb'
  bulk_thread_pool_executors: 18
  bulk_thread_pool_capacity: 1000
  filter_cache_size: '20%'

profile::lvs::realserver::pools:
  search:
    services:
      - "opensearch_2@production-search-%{::site}"
  search-https:
    services:
      - nginx
      - "opensearch_2@production-search-%{::site}"
  search-omega-https:
    services:
      - nginx
      - "opensearch_2@production-search-omega-%{::site}"

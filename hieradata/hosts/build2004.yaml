profile::docker::builder::prune_images: true
# Generate reports and rebuild images weekly on this host.
profile::docker::reporter::generate_reports: false
profile::docker::builder::rebuild_images: false
profile::docker::builder::build_base_images: true
profile::docker::builder::docker_pkg: true

profile::docker::reporter::credentials::deploy_k8s_credentials: false

profile::java::java_packages:
  - version: "21"
    variant: "jdk"

debmonitor_servers:
  - debmonitor.discovery.wmnet
  - debmonitor-next.discovery.wmnet

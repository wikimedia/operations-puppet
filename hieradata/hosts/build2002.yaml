profile::docker::builder::prune_images: false
# Generate reports and rebuild images weekly on this host.
profile::docker::reporter::generate_reports: true
profile::docker::builder::rebuild_images: false
profile::docker::builder::build_base_images: false
profile::docker::builder::docker_pkg: false

profile::docker::reporter::credentials::deploy_k8s_credentials: true

profile::java::java_packages:
  - version: "8"
    variant: "jdk"
  - version: "17"
    variant: "jdk"
  - version: "21"
    variant: "jdk"

debmonitor_servers:
  - debmonitor.discovery.wmnet
  - debmonitor-next.discovery.wmnet

profile::cache::haproxy::available_certificates:
  upload:
    cert_paths:
        - /run/haproxy-tls/upload/live/ec-prime256v1.chained.crt.key
    server_names: &upload_cert_server_names
        - upload.wikimedia.org
        - maps.wikimedia.org
    warning_threshold: 21
    critical_threshold: 15
  upload-goog:
    cert_paths:
        - /run/haproxy-tls/upload-goog/live/ec-prime256v1.chained.crt.key
    server_names: *upload_cert_server_names

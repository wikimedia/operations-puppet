mysql_eqiad:
  __regex: !ruby/regexp /^(db1[0-9][0-9][0-9]|dbstore100[7-9]|dbproxy1[0-9][0-9][0-9]|es10[0-9][0-9]|pc10[0-9][0-9]|clouddb10[012][0-9]|an-redacteddb1001)\.eqiad\.wmnet$/
  cluster: mysql

mysql_codfw:
  __regex: !ruby/regexp /^(db2[0-9][0-9][0-9]|dbproxy2[0-9][0-9][0-9]|es200[1-4]|pc20[0-9][0-9]|es20[0-9][0-9])\.codfw\.wmnet$/
  cluster: mysql

extstorage_eqiad:
  __regex: !ruby/regexp /^(es101[1-9])\.eqiad\.wmnet$/

# Cephadm cluster selection
apus_eqiad:
  __regex: !ruby/regexp /^(moss|apus)-(be|fe)1[0-9]+\.eqiad\./
  profile::cephadm::cluster_label: apus
  cluster: apus

apus_codfw:
  __regex: !ruby/regexp /^(moss|apus)-(be|fe)2[0-9]+\.codfw\./
  profile::cephadm::cluster_label: apus
  cluster: apus

# Legacy hosts with a single object-server per port
# https://phabricator.wikimedia.org/T222366
swift_servers_per_port:
  __regex: !ruby/regexp /^ms-be(10([1-4][0-9]|50)|20[1-4][0-9])\.(codfw|eqiad)\.wmnet$/
  profile::swift::storage::servers_per_port: 0

# Hosts with 24x HDD https://phabricator.wikimedia.org/T252216
swift_24_drives:
  __regex: !ruby/regexp /^ms-be(205[7-9]|20[7-9][0-9]|106[0-58-9]|10[7-9][0-9])\.(codfw|eqiad)\.wmnet$/
  swift_storage_drives:
    - '/dev/sdc'
    - '/dev/sdd'
    - '/dev/sde'
    - '/dev/sdf'
    - '/dev/sdg'
    - '/dev/sdh'
    - '/dev/sdi'
    - '/dev/sdj'
    - '/dev/sdk'
    - '/dev/sdl'
    - '/dev/sdm'
    - '/dev/sdn'
    - '/dev/sdo'
    - '/dev/sdp'
    - '/dev/sdq'
    - '/dev/sdr'
    - '/dev/sds'
    - '/dev/sdt'
    - '/dev/sdu'
    - '/dev/sdv'
    - '/dev/sdw'
    - '/dev/sdx'
    - '/dev/sdy'
    - '/dev/sdz'

# hosts using the new storage schema (JBOD not RAID) cf T308677
swift_new_storage:
  __regex: !ruby/regexp /^ms-be(106[4-9]|10[7-9][0-9]|11[0-9][0-9]|2050|20[6-9][0-9])\.(codfw|eqiad)\.wmnet$/
  profile::swift::storage::disks_by_path: true
thanos_new_storage:
  __regex: !ruby/regexp /^thanos-be(100[5-9]|200[5-9])\.(codfw|eqiad)\.wmnet$/
  profile::swift::storage::disks_by_path: true

# require WriteBack policy to all hosts (independent of the role) that look
# like databases. Currently this only works for megacli systems, but it will
# be applied to HP RAIDs when available. Systems where this is not currently
# compatible are ignored and do not send any alert.
db_like_raid_policy:
  __regex: !ruby/regexp /^(db|dbstore|es|pc|clouddb)[12]\d\d\d\.(eqiad|codfw)\.wmnet$/
  profile::monitoring::raid_write_cache_policy: 'WriteBack'

wikikube_workers_exp:
  __regex: !ruby/regexp /^wikikube-worker-exp[12]001\.(codfw|eqiad)\.wmnet$/
  # mw-experimental hosts need the deployment group present as it will own
  # /srv/mediawiki
  profile::admin::groups:
    - deployment
  # deployment_group should be the same as hieradata/role/common/deployment_server/kubernetes.yaml
  deployment_group: "deployment"
  profile::kubernetes::node::mw_experimental: true
  profile::kubernetes::node::kubelet_node_labels:
    - dedicated=mw-experimental
  profile::kubernetes::node::kubelet_node_taints:
    - key: dedicated
      value: mw-experimental
      effect: NoExecute
    - key: dedicated
      value: mw-experimental
      effect: NoSchedule

memcached_wf_nftables:
  __regex: !ruby/regexp /^mc-wf[12]00[1-9]\.(eqiad|codfw)\.wmnet$/
  profile::firewall::provider: nftables

eqiad_memcached:
  __regex: !ruby/regexp /^mc10(5[5-9]|6[0-9]|7[0-2])\.eqiad\./
  profile::memcached::extstore_ensure: absent
  profile::memcached::size: 248832  # multiple of 1024

memcached_pki:
  __regex: !ruby/regexp /^mc10(5[5-9]|6[0-9]|7[0-2])\.eqiad\./
  profile::memcached::use_pki_certs: true

dse_k8s_workers_topolvm_balanced:
  __regex: !ruby/regexp /^dse-k8s-worker100[1-4]\.eqiad\.wmnet$/
  # Expose the free space in vg1 (a RAID1 pair of SSDs) to TopoLVM as the
  # 'balanced' device-class. See T432109.
  profile::kubernetes::node::lvmd::device_classes:
    - name: balanced
      volume-group: vg1
      default: true
      spare-gb: 10
  # The lvmd=enabled label schedules the TopoLVM CSI node plugin here; the
  # kubelet only sets it at registration time, so it also needs to be
  # added manually to existing nodes.
  profile::kubernetes::node::kubelet_node_labels:
    - lvmd=enabled

dse_k8s_workers_topolvm_capacity:
  __regex: !ruby/regexp /^dse-k8s-worker(102[4-8]\.eqiad|200[1-2]\.codfw)\.wmnet$/
  # Expose the free space in vg1 (a RAID10 array of 12 HDDs) to TopoLVM as
  # the 'capacity' device-class. See T432109.
  profile::kubernetes::node::lvmd::device_classes:
    - name: capacity
      volume-group: vg1
      default: true
      spare-gb: 10
  # The lvmd=enabled label schedules the TopoLVM CSI node plugin here; the
  # kubelet only sets it at registration time, so it also needs to be
  # added manually to existing nodes.
  profile::kubernetes::node::kubelet_node_labels:
    - lvmd=enabled

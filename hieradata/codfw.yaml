  apus:
    cluster_name: 'apus-codfw'
    mon_network: 2620:0:860:100::/56
    controller: 'apus-be2005.codfw.wmnet'
    osds: &osds
      - moss-be2003.codfw.wmnet
      - apus-be2004.codfw.wmnet
      - apus-be2005.codfw.wmnet
      - apus-be2006.codfw.wmnet
    monitors: *osds
    rgws:
      - apus-fe2003.codfw.wmnet
      - apus-fe2004.codfw.wmnet
      - apus-fe2005.codfw.wmnet

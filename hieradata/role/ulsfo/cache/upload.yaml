profile::cache::haproxy::use_benthos: true
profile::cache::haproxy::benthos_socket_address: &benthos_address "127.0.0.1:1221"
profile::benthos::use_geoip: false
profile::benthos::instances:
  haproxy_reqctl:
    # Prometheus exporter port
    port: 4153
    env_variables:
      enable_debug: true
      socket_address: *benthos_address
      msg_topic: haproxy_reqctl
      root_cas_file: /etc/ssl/certs/wmf-ca-certificates.crt
      pipeline_threads: 2
      benthos_fqdn: '%{facts.fqdn}'
      buffer_memory_limit_bytes: 134217728
      eventgate_url: https://eventgate-analytics.discovery.wmnet:4592/v1/events?hasty=true
    kafka:
      cluster: main
      site: eqiad
      # Topics listed here are for kafka message ingestion
      # Not needed in this case
      topics:
        - "none"

profile::cache::haproxy::available_certificates:
  upload:
    cert_paths:
        - /run/haproxy-tls/upload/live/ec-prime256v1.chained.crt.key
    server_names: &upload_cert_server_names
        - upload.wikimedia.org
        - maps.wikimedia.org
    warning_threshold: 21
    critical_threshold: 15
    ocsp: false
  upload-goog:
    cert_paths:
        - /run/haproxy-tls/upload-goog/live/ec-prime256v1.chained.crt.key
    server_names: *upload_cert_server_names
    warning_threshold: 21
    critical_threshold: 15
    ocsp: true
profile::cache::haproxy::enabled_certificates:
  - upload

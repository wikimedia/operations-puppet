profile::liberica::etcd_config:
  conftool_domain: codfw.wmnet
  datacenter: "%{::site}"
profile::lvs::interface_tweaks:
  ens3f0np0:
    txqlen: 10000
profile::liberica::bgp_config:
  peers:
    - 198.35.26.192 # cr3-ulsfo
    - 198.35.26.193 # cr4-ulsfo
profile::liberica::fp_config:
  log_level: info
  grpc:
    network: tcp
    address: 127.0.0.1:1102
  prometheus:
    addresses:
      - "%{facts.networking.ip}:3002"
      - "[%{facts.networking.ip6}]:3002"
  forwarding_plane: katran
  katran:
    interface: ens3f0np0
    conntrack_size: 8000000

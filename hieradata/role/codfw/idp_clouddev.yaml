profile::firewall::provider: nftables

# Apereo CAS / IDP
profile::idp::tomcat_version: "tomcat10"

profile::idp::enable_cors: true
profile::idp::tgc_cookie_same_site: "strict"
profile::idp::tgc_cookie_pin_to_session: false
profile::idp::envoy_termination: false

profile::idp::redis_server: rdb2011.codfw.wmnet
profile::idp::redis_port: 6378
profile::idp::redis_database: 2

profile::idp::ldap_attributes:
  - cn
  - memberOf
  - mail
  - mfa-method
  - uid


# TLS for caches -> web interfaces
profile::tlsproxy::instance::ssl_compatibility_mode: strong


profile::tlsproxy::envoy::tls_port: 7443
profile::tlsproxy::envoy::global_cert_name: "%{facts.networking.fqdn}"
profile::tlsproxy::envoy::firewall_src_sets:
    - CACHES
profile::tlsproxy::envoy::ssl_provider: 'cfssl'
profile::tlsproxy::envoy::cfssl_label: 'discovery2026'
profile::tlsproxy::envoy::cfssl_options:
  hosts:
    - cloudidp-dev.wikimedia.org
profile::tlsproxy::envoy::services:
  - server_names: ['cloudidp-dev.wikimedia.org']
    port: 8080
profile::tlsproxy::envoy::upstream_addr: "%{facts.networking.ip}"


profile::services_proxy::envoy::listen_ipv6: true

profile::idp::actuators:
  - sso
  - ssoSessions
profile::idp::server_name: https://cloudidp-dev.wikimedia.org
profile::idp::idp_nodes: []
profile::idp::is_staging_host: true
profile::idp::u2f_jpa_enable: false
profile::idp::expose_tomcat: false
profile::java::egd_source: "/dev/urandom"
profile::idp::u2f_token_expiry_days: 3650
profile::idp::oidc_issuers_pattern: ".*"
profile::java::java_packages:
  - version: "21"
    variant: "jdk"

profile::idp::services:
  keystone:
    id: 1
    service_class: "OidcRegisteredService"
    service_id: 'https://(keystone\.)?openstack\.codfw1dev\.wikimediacloud\.org(:25000)?(/.*)?'
    profile_format: "FLAT"
    response_type: "id_token token"

profile::idp::tomcat_heap_mem: '1024m'

ldap:
  ro-server: ldap-private-a.codfw1dev.wikimediacloud.org
  ro-server-fallback: ldap-private-b.codfw1dev.wikimediacloud.org
  rw-server: ldap-private-a.codfw1dev.wikimediacloud.org
  rw-server-fallback: ldap-private-b.codfw1dev.wikimediacloud.org

---
profile::wmcs::cloudgw::blackboxmonitor::wan_fqdn: wan.cloudgw.codfw1dev.wikimediacloud.org
profile::wmcs::cloudgw::blackboxmonitor::virt_fqdn: virt.cloudgw.codfw1dev.wikimediacloud.org

profile::wmcs::cloudgw::routing_source_ip: 185.15.57.1
profile::wmcs::cloudgw::virt_networks:
  # VLAN/Legacy
  - type: default
    networks:
      - 172.16.128.0/24
  # VXLAN/IPv4-only
  - type: default
    networks:
      - 172.16.129.0/24
  # VXLAN/Dualstack
  - type: default
    networks:
      - 172.16.130.0/24
      - 2a02:ec80:a100:1::/64
  # octavia-lb-mgmt-net
  - type: internal
    networks:
      - 172.16.131.0/24
      - 2a02:ec80:a100:100::/64
  # floating
  - type: floating
    networks:
      - 185.15.57.0/29
      - 185.15.57.16/29

profile::wmcs::cloudgw::virt_vlan: 2107
profile::wmcs::cloudgw::virt_netm: 29
profile::wmcs::cloudgw::virt_peer: 185.15.57.10
profile::wmcs::cloudgw::virt_netm_v6: 64
profile::wmcs::cloudgw::virt_peer_v6: 2a02:ec80:a100:fe04::2:1

profile::wmcs::cloudgw::wan_vlan: 2120
profile::wmcs::cloudgw::wan_netm: 29
# this is vrrp-gw-2120.wikimedia.org
profile::wmcs::cloudgw::wan_gw: 208.80.153.185
profile::wmcs::cloudgw::wan_netm_v6: 64
profile::wmcs::cloudgw::wan_gw_v6: 2a02:ec80:a100:fe03::1

profile::wmcs::cloudgw::vrrp_vips:
  # expected format by keepalived:
  # xx.yy.zz.ww/32 dev vlanXYZW
  # TODO: this would be more robust if using a custom data type
  - "185.15.57.9/29 dev vlan%{lookup('profile::wmcs::cloudgw::virt_vlan')}"
  - "208.80.153.190/29 dev vlan%{lookup('profile::wmcs::cloudgw::wan_vlan')}"
profile::wmcs::cloudgw::vrrp_vips_v6:
  - "2a02:ec80:a100:fe04::1:1/64 dev vlan%{lookup('profile::wmcs::cloudgw::virt_vlan')}"
  - "2a02:ec80:a100:fe03::2/64 dev vlan%{lookup('profile::wmcs::cloudgw::wan_vlan')}"

profile::wmcs::cloudgw::conntrackd:
  cloudgw2003-dev:
    local_addr: cloudgw2003-dev.codfw.wmnet
    remote_addr: cloudgw2002-dev.codfw.wmnet
    filter_ipv4:
      # don't sync conntrack info for the following local addresses
      - 10.192.20.18
      - 10.192.20.7
      - 185.15.57.9
      - 208.80.153.190
  cloudgw2002-dev:
    local_addr: cloudgw2002-dev.codfw.wmnet
    remote_addr: cloudgw2003-dev.codfw.wmnet
    filter_ipv4:
      # don't sync conntrack info for the following local addresses
      - 10.192.20.18
      - 10.192.20.7
      - 185.15.57.9
      - 208.80.153.190

---
profile::wmcs::cloudgw::blackboxmonitor::wan_fqdn: wan.cloudgw.eqiad1.wikimediacloud.org
profile::wmcs::cloudgw::blackboxmonitor::virt_fqdn: virt.cloudgw.eqiad1.wikimediacloud.org
# NOTE: this is set to false to prevent chicken-egg problems with the initial IPv6 setup
# because the exporter config puppet template reads the FQDN's IPv6 but the FQDN are set up manually via netbox
# after the puppet run has assigned the IPv6 to each interface
profile::wmcs::cloudgw::blackboxmonitor::do_ipv6: false
profile::wmcs::cloudgw::virt_subnets_cidr_v6:
  - 2a02:ec80:a000::/55
profile::wmcs::cloudgw::virt_peer_v6: 2a02:ec80:a000:fe04::2:1
profile::wmcs::cloudgw::wan_gw_v6: 2a02:ec80:a000:fe03::1

profile::wmcs::cloudgw::routing_source_ip: 185.15.56.1
profile::wmcs::cloudgw::virt_subnets_cidr: [172.16.0.0/21]
profile::wmcs::cloudgw::virt_floating: [185.15.56.0/25]
profile::wmcs::cloudgw::virt_vlan: 1107
profile::wmcs::cloudgw::wan_vlan: 1120
profile::wmcs::cloudgw::vrrp_vips:
  # expected format by keepalived:
  # xx.yy.zz.ww/29 dev vlanXYZW
  # TODO: this would be more robust if using a custom data type
  - "185.15.56.237/29 dev vlan%{lookup('profile::wmcs::cloudgw::virt_vlan')}"
  - "185.15.56.244/29 dev vlan%{lookup('profile::wmcs::cloudgw::wan_vlan')}"
profile::wmcs::cloudgw::vrrp_vips_v6:
  - "2a02:ec80:a000:fe04::1:1/64 dev vlan%{lookup('profile::wmcs::cloudgw::virt_vlan')}"
  - "2a02:ec80:a000:fe03::3/64 dev vlan%{lookup('profile::wmcs::cloudgw::wan_vlan')}"

profile::wmcs::cloudgw::conntrackd:
  cloudgw1003:
    local_addr: cloudgw1003.eqiad.wmnet
    remote_addr: cloudgw1004.eqiad.wmnet
    filter_ipv4:
      # don't sync conntrack info for the following local addresses
      - 10.64.20.25 # cloudgw1003.eqiad.wmnet
      - 10.64.20.26 # cloudgw1004.eqiad.wmnet
      - 185.15.56.237
      - 185.15.56.244
  cloudgw1004:
    local_addr: cloudgw1004.eqiad.wmnet
    remote_addr: cloudgw1003.eqiad.wmnet
    filter_ipv4:
      # don't sync conntrack info for the following local addresses
      - 10.64.20.25 # cloudgw1003.eqiad.wmnet
      - 10.64.20.26 # cloudgw1004.eqiad.wmnet
      - 185.15.56.237
      - 185.15.56.244

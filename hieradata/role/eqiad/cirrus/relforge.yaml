# don't monitor relforge, as it doesn't serve external traffic
profile::monitoring::notifications_enabled: false

profile::opensearch::dc_settings:
    # Since this is a two-node cluster where either host can be master,
    # you'll need to turn off master election on one of them before any
    # scheduled operations.
    # ref https://www.elastic.co/guide/en/elasticsearch/reference/current/voting-config-exclusions.html
    unicast_hosts:
      - relforge1008.eqiad.wmnet
      - relforge1009.eqiad.wmnet
      - relforge1010.eqiad.wmnet
    cluster_hosts:
      - relforge1008.eqiad.wmnet
      - relforge1009.eqiad.wmnet
      - relforge1010.eqiad.wmnet
    expected_nodes: 2

has_lvs: false

profile::opensearch::cirrus::storage_device: md2
profile::kibana::package_name: kibana-oss

profile::opensearch::dc_settings:
    # ES-specific: Not default
    unicast_hosts: # this is also the list of master eligible nodes
      - cloudelastic1009.eqiad.wmnet
      - cloudelastic1010.eqiad.wmnet
      - cloudelastic1011.eqiad.wmnet
    cluster_hosts:
      - cloudelastic1007.eqiad.wmnet
      - cloudelastic1008.eqiad.wmnet
      - cloudelastic1009.eqiad.wmnet
      - cloudelastic1010.eqiad.wmnet
      - cloudelastic1011.eqiad.wmnet
      - cloudelastic1012.eqiad.wmnet
    expected_nodes: 6
    # We should be able to run "OK" with 3 servers (half of the cluster).
    recover_after_nodes: 3

profile::opensearch::common_settings:
  watermarks:  # Cluster watermarks T368168
    low: '100gb' # Stop allocating shards to nodes
    high: '50gb' # Begin evicting shards off the node
    flood_stage: '10gb' # Set indexes read-only with allocated shards on affected node

profile::admin::groups:
  - contint-users
  - contint-admins
cluster: ci
contactgroups: 'admins,contint'

# envoy for TLS termination for doc.wikimedia.org behind ATS
profile::tlsproxy::envoy::ensure: present
profile::tlsproxy::envoy::firewall_src_sets:
  - CACHES
profile::tlsproxy::envoy::services:
  - server_names: ['*']
    port: 80

profile::tlsproxy::envoy::ssl_provider: 'cfssl'
profile::tlsproxy::envoy::global_cert_name: 'doc.discovery.wmnet'
profile::tlsproxy::envoy::cfssl_options:
  hosts:
    - doc.wikimedia.org
profile::tlsproxy::envoy::sni_support: "no"
profile::tlsproxy::envoy::cfssl_label: 'discovery2026'


profile::contacts::role_contacts: ['Collaboration Services']
profile::base::production::role_description: 'Wikimedia documentation server'

profile::firewall::provider: nftables

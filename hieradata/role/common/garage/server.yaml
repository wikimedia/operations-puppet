cluster: backup
profile::contacts::role_contacts: ['Data Persistence']
profile::base::production::role_description: 'Garage object service for media backups'
profile::puppet::agent::force_puppet7: true

profile::firewall::provider: nftables

profile::envoy::ensure: present
profile::tlsproxy::envoy::ssl_provider: cfssl
profile::tlsproxy::envoy::sni_support: "no"
profile::tlsproxy::envoy::tls_port: 3900
profile::tlsproxy::envoy::services:
  - server_names: ['*']
    port: 9000
profile::tlsproxy::envoy::global_cert_name: "garage"
profile::tlsproxy::envoy::firewall_src_sets:
  - MEDIABACKUP_WORKER_HOSTS

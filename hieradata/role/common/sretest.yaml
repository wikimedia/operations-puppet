# Submit to both production and staging debmonitor
debmonitor_servers:
  - debmonitor.discovery.wmnet
  - debmonitor-next.discovery.wmnet
profile::firewall::defs_from_etcd: true
profile::contacts::role_contacts:
  - 'Infrastructure Foundations'
profile::base::production::role_description: 'Host used for experiments by SREs'
profile::admin::groups:
  - sretest-roots
profile::firewall::provider: nftables
profile::syslog::remote::mtls_provider: 'cfssl'

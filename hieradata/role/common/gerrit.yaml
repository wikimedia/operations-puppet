profile::admin::groups:
  - gerrit-root
  - gerrit-admin
contactgroups: 'admins,gerrit'
profile::contacts::role_contacts: ['Collaboration Services']
profile::base::production::role_description: 'Gerrit Code Review server'

profile::firewall::provider: nftables

profile::tlsproxy::envoy::ssl_provider: cfssl
profile::tlsproxy::envoy::firewall_src_sets:
  - CACHES
  - BASTION_HOSTS
profile::tlsproxy::envoy::services:
  - server_names: ["*"]
    port: 443
profile::tlsproxy::envoy::tls_port: 8443
profile::tlsproxy::envoy::global_cert_name: "gerrit.wikimedia.org"
profile::tlsproxy::envoy::cfssl_options:
  hosts:
    - "%{lookup('profile::gerrit::host')}"
    - 'gerrit-replica.wikimedia.org'
    - 'gerrit-spare.wikimedia.org'
    - 'gerrit.discovery.wmnet'
    - 'gerrit-replica.discovery.wmnet'
    - 'gerrit-spare.discovery.wmnet'
    - "%{facts.networking.fqdn}"
profile::tlsproxy::envoy::upstream_tls: true
profile::tlsproxy::envoy::upstream_response_timeout: 0.0 # T421827


# Align timeouts in the ATS/Envoy/Apache chain
#
# ATS (downstream) > Envoy > Apache (upstream)
profile::tlsproxy::envoy::downstream_idle_timeout: 125.0
profile::tlsproxy::envoy::upstream_idle_timeout: 120.0
profile::gerrit::proxy::keepalive_timeout: 125

# Whether to actually bind the service IP to the network interface.
# defaults to true but allows to test gerrit on new machines without
# causing IP conflicts or having to request a separate service IP.
profile::gerrit::bind_service_ip: true

# Allow use of supplemental key for scap deployment
profile::ssh::server::authorized_keys_file:
  - '/etc/ssh/userkeys/%u'
  - '/etc/ssh/userkeys/%u.d/cumin'
  - '/etc/ssh/userkeys/%u.d/gerrit-scap'

profile::java::java_packages:
  - version: '17'
    variant: 'jdk'
profile::java::enable_dbg: true

# Set JAVA_HOME explicitly for the systemd unit
profile::gerrit::java_home: '/usr/lib/jvm/java-17-openjdk-amd64'
profile::gerrit::proxy::keepalive_toggle: true
profile::gerrit::proxy::max_keepalive_requests: 0
profile::gerrit::proxy::thread_limit: 64
profile::gerrit::proxy::threads_per_child: 25
profile::gerrit::proxy::max_request_workers: 150
profile::gerrit::proxy::async_request_worker_factor: 8
mtail::logs:
  - /var/log/apache2/*.https.access.log
mtail::group: 'adm'

profile::mail::default_mail_relay::smarthosts:
- 'mx-out1001.wikimedia.org'
- 'mx-out2001.wikimedia.org'

profile::firewall::nftables_throttling::ensure: absent
profile::firewall::nftables_throttling::nft_policy: drop
# allow 10 packets per second with a 30 burst capacity 
# ban clients for 60 seconds
profile::firewall::nftables_throttling::max_connections: 10
profile::firewall::nftables_throttling::burst_value: 30
profile::firewall::nftables_throttling::throttle_duration: 60
profile::firewall::nftables_throttling::tracking_timeout: 300
profile::firewall::nftables_throttling::port: 443
profile::firewall::nftables_throttling::nft_logging: true

profile::prometheus::nft_throttling_denylist::ensure: "%{lookup('profile::firewall::nftables_throttling::ensure')}"

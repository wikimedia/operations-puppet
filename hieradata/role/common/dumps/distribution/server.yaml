cluster: wmcs

contactgroups: "wmcs-team-email,team-data-platform,admins"

profile::admin::groups:
  - analytics-admins
  - dumps-roots
  - wmcs-roots

profile::lvs::realserver::pools:
  dumps-https:
    services:
      - nginx
  dumps-rsync:
    services:
      - rsync
  dumps-nfs:
    services:
      - nfs-kernel-server
profile::lvs::realserver::ipip::enabled: true
profile::base::enable_rp_filter: false

profile::dumps::distribution::blocked_user_agent_regex: 'Mozilla\/5\.0 \(Linux; Android\) AppleWebKit\/537\.36 \(KHTML, like Gecko\) Chrome\/34\.0\.1847\.131 Safari\/537\.36'
# Hadoop client packges are installed and configured to talk
# to the analytics-hadoop cluster.
profile::hadoop::common::hadoop_cluster_name: "analytics-hadoop"

# In order to fetch data from the Analytics Hadoop Cluster,
# a Kerberos keytab is needed to allow automated jobs to
# authenticate.
profile::kerberos::keytabs::keytabs_metadata:
  - role: "dumpsgen"
    owner: "dumpsgen"
    group: "dumpsgen"
    filename: "dumpsgen.keytab"

# Needed by Analytics java-based tools
profile::java::java_packages:
  - version: "8"
    variant: "jdk"
profile::java::extra_args:
  JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

# includes module for bandwidth limits
profile::nginx::variant: "full"

profile::contacts::role_contacts: ["WMCS"]
profile::base::production::role_description: 'clouddumps host in the public VLAN that distributes dumps to clients via NFS/Web/Rsync'

# This user uses rsync over ssh to publish dumps from the dse-k8s cluster.
# See #T389784 for more.
profile::ssh::server::match_config:
  - criteria: User
    patterns:
    - dumpsgen
    config:
      AllowTcpForwarding: 'no'

cluster: dumps
profile::admin::groups:
  - udp2log-users
  - deployment
  - snapshot-admins
  - snapshot-users
  - dumps-roots
profile::mediawiki::php::enable_fpm: false
profile::mediawiki::apc_shm_size: 128M
profile::contacts::role_contacts: ["Data Platform"]
profile::base::production::role_description: 'testbed for dumps of XML/SQL wiki content'
# Enable icu67 component - T345561
profile::mediawiki::php::icu67: true

profile::puppet::agent::force_puppet7: true

profile::mediawiki::php::php_versions: ['8.1']
profile::mediawiki::php::absented_php_versions: ['7.4']
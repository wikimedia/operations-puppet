# This is the conftool cluster name, don't be confused
cluster: dse_k8s
# cluster_name is used to look up cluster settings from kubernetes_clusters hiera key.
profile::kubernetes::cluster_name: "dse-k8s-%{::site}"

profile::base::overlayfs: true

# Enable ipip encapsulation
profile::lvs::realserver::ipip::enabled: true
# but disable MSS clamping. We reduce the MTU via Calico CNI instead
profile::lvs::realserver::ipip::clamping_enabled: false
# Allow to disable rp_filter on ipip interfaces (by setting all to disabled) and retain strict mode for all other interfaces
profile::base::enable_rp_filter:
  all_rp_filter: 0
  default_rp_filter: 1
# We don't need conftool safe restart scripts on k8s.
profile::lvs::realserver::use_conftool: false
profile::lvs::realserver::pools:
  k8s-ingress-dse: {}
  k8s-ingress-dse-aa: {}
  k8s-ingress-dse-postgresql: {}

prometheus::node_exporter::collectors_extra:
  - processes
profile::contacts::role_contacts:
  - 'Data Platform'
profile::base::production::role_description: 'DSE Kubernetes worker node - dedicated to wdqs'

# Install a backported 6.12 kernel to fix a Ceph client bug causing hangs.
# See T394897
profile::base::use_linux612_on_bookworm: true

# Data volume group for the WDQS workload, created by puppet and left pristine (no
# logical volumes) so that TopoLVM can provision LVs into it dynamically.
lvm::volume_groups:
  vg_data:
    createonly: true
    physical_volumes:
      - /dev/nvme0n1
      - /dev/nvme1n1

# Expose vg_data to TopoLVM as the 'performance' device-class,
# striping each logical volume across its two disks.
profile::kubernetes::node::lvmd::device_classes:
  - name: performance
    volume-group: vg_data
    default: true
    spare-gb: 10
    stripe: 2

# We do not wish to run any general purpose workload on these nodes, so we use a taint to identify
# it as a node that is dedicated to wdqs related tasks.
# The lvmd=enabled label schedules the TopoLVM CSI node plugin here; it should
# be set on every node that runs the lvmd systemd service.
profile::kubernetes::node::kubelet_node_labels:
  - dedicated=wdqs
  - lvmd=enabled
profile::kubernetes::node::kubelet_node_taints:
  - key: dedicated
    value: wdqs
    effect: NoExecute
  - key: dedicated
    value: wdqs
    effect: NoSchedule

# Experimental for T327300
profile::server_depool:
  policy: k8s

# This is the conftool cluster name, don't be confused
cluster: dse_k8s
# cluster_name is used to look up cluster settings from kubernetes_clusters hiera key.
profile::kubernetes::cluster_name: "dse-k8s-%{::site}"

profile::base::overlayfs: true

# Enable ipip encapsulation
profile::lvs::realserver::ipip::enabled: true
# but disable MSS clamping. We reduce the MTU via Calico CNI instead
profile::lvs::realserver::ipip::clamping_enabled: false
# Allow to disable rp_filter on ipip interfaces (by setting all to disabled) and retain strict mode for all other interfaces
profile::base::enable_rp_filter:
  all_rp_filter: 0
  default_rp_filter: 1
# We don't need conftool safe restart scripts on k8s.
profile::lvs::realserver::use_conftool: false
profile::lvs::realserver::pools:
  k8s-ingress-dse: {}
  k8s-ingress-dse-aa: {}
  k8s-ingress-dse-postgresql: {}

profile::admin::groups:
  - ml-team-admins
prometheus::node_exporter::collectors_extra:
  - processes
profile::contacts::role_contacts:
  - 'Data Platform'
  - 'Machine Learning'
profile::base::production::role_description: 'DSE Kubernetes worker node'

# Install a backported 6.12 kernel to fix a Ceph client bug causing hangs.
# See T394897
profile::base::use_linux612_on_bookworm: true

# whether or not to set readahead for OpenSearch pod RBDs (block devices), ref T419041
profile::kubernetes::node::dse_k8s::set_rbd_readahead: true

# Experimental for T327300
profile::server_depool:
  policy: k8s

# Any image larger than 1GB should be registered for p2p download through dragonfly
# ref T436089
profile::dragonfly::dfdaemon::proxy_urls_regex:
  - 'repos/data-engineering/airflow-dags/blobs/sha256.*'
  - 'repos/data-engineering/mediawiki-event-enrichment/blobs/sha256.*'
  - 'repos/data-engineering/mediawiki-event-enrichment/java/blobs/sha256.*'
  - 'repos/data-engineering/opensearch/blobs/sha256.*'
  - 'repos/data-engineering/spark/blobs/sha256.*'
  - 'repos/machine-learning/ml-pipelines/blobs/sha256.*'
  - 'repos/wme/pageviews-data-transfer/blobs/sha256.*'
  - 'repos/wme/pageviews-hdfs-transfer/blobs/sha256.*'
  - 'restricted/mediawiki-multiversion-cli/blobs/sha256.*'

profile::contacts::role_contacts: ['Machine Learning']
profile::base::production::role_description: 'ML Builder server'
profile::amd_gpu::use_rocm_amd_smi: true
profile::amd_gpu::is_basic_gpu_node: true
profile::base::overlayfs: true
profile::docker::ml_builder::docker_pkg: true
profile::docker::ml_builder::proxy_address: "webproxy.%{::site}.wmnet"
profile::docker::ml_builder::proxy_port: 8080
profile::docker::engine::settings:
  live-restore: true
  iptables: false
  data-root: "/srv/docker"
profile::admin::groups:
  - ml-team-admins
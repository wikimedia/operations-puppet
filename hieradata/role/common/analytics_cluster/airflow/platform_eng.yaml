# Notify the Data Platform SRE team about services on these hosts
contactgroups: 'admins,team-data-platform'

nagios_group: analytics_eqiad
cluster: airflow
profile::admin::groups:
  - analytics-admins
  - analytics-platform-eng-admins

profile::hadoop::common::hadoop_cluster_name: 'analytics-hadoop'
profile::hive::client::hive_service_name: 'analytics-hive'

profile::kerberos::keytabs::keytabs_metadata:
  - role: 'analytics-platform-eng'
    owner: 'analytics-platform-eng'
    group: 'analytics-platform-eng'
    filename: 'analytics-platform-eng.keytab'
# Context https://phabricator.wikimedia.org/T278353#6976509
profile::kerberos::client::dns_canonicalize_hostname: false

profile::java::java_packages:
  - version: '8'
    variant: 'jdk'
profile::java::extra_args:
  JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

profile::airflow::database_host_default: an-db1001.eqiad.wmnet

#Airflow version override
# profile::airflow::airflow_version: 2.10.3-py3.10-20241112'

# Set up airflow instances.
profile::airflow::instances:
  # airflow@platform_eng instance.
  platform_eng:
    firewall_srange: ANALYTICS_NETWORKS
    # Since we set security: kerberos a keytab must be deployed for the service_user.
    service_user: analytics-platform-eng
    service_group: analytics-platform-eng
    statsd_monitoring_enabled: true
    monitoring_enabled: true
    connections:
      analytics-hive:
        conn_type: hive_metastore
        host: analytics-hive.eqiad.wmnet
        port: 9083
        extra_dejson: {'authMechanism': 'GSSAPI'}
      kafka_test_eqiad:
        conn_type: kafka
        host: kafka-test1006.eqiad.wmnet,kafka-test1007.eqiad.wmnet,kafka-test1008.eqiad.wmnet,kafka-test1009.eqiad.wmnet,kafka-test1010.eqiad.wmnet
        port: 9093
        extra:
          group.id: airflow-platform-eng
          ssl.ca.location: /etc/ssl/certs/ca-certificates.crt
          bootstrap.servers: kafka-test1006.eqiad.wmnet:9093,kafka-test1007.eqiad.wmnet:9093,kafka-test1008.eqiad.wmnet:9093,kafka-test1009.eqiad.wmnet:9093,kafka-test1010.eqiad.wmnet:9093
          security.protocol: SSL
      kafka_jumbo_eqiad:
        conn_type: kafka
        host: kafka-jumbo1006.eqiad.wmnet,kafka-jumbo1007.eqiad.wmnet,kafka-jumbo1008.eqiad.wmnet,kafka-jumbo1009.eqiad.wmnet,kafka-jumbo1010.eqiad.wmnet,kafka-jumbo1011.eqiad.wmnet,kafka-jumbo1012.eqiad.wmnet,kafka-jumbo1013.eqiad.wmnet,kafka-jumbo1014.eqiad.wmnet,kafka-jumbo1015.eqiad.wmnet
        port: 9093
        extra:
          group.id: airflow-platform-eng
          ssl.ca.location: /etc/ssl/certs/ca-certificates.crt
          bootstrap.servers: kafka-jumbo1006.eqiad.wmnet:9093,kafka-jumbo1007.eqiad.wmnet:9093,kafka-jumbo1008.eqiad.wmnet:9093,kafka-jumbo1009.eqiad.wmnet:9093,kafka-jumbo1010.eqiad.wmnet:9093,kafka-jumbo1011.eqiad.wmnet:9093,kafka-jumbo1012.eqiad.wmnet:9093,kafka-jumbo1013.eqiad.wmnet:9093,kafka-jumbo1014.eqiad.wmnet:9093,kafka-jumbo1015.eqiad.wmnet:9093
          security.protocol: SSL
    airflow_config:
      datahub:
        enabled: False
      metrics:
        statsd_on: True

profile::contacts::role_contacts: ['Data Platform']
profile::base::production::role_description: 'Airflow instance for the Platform Engineering team in the Analytics Cluster'

profile::puppet::agent::force_puppet7: true

# We need to prevent the removal of the python2 packages because of hive and hive-hcatalog
profile::base::remove_python2_on_bullseye: false

profile::base::certificates::include_bundle_jks: true

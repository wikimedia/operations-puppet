cluster: 'hcaptcha'

profile::firewall::provider: nftables

profile::base::production::role_description: 'hCaptcha proxy for all sites (bird/anycast)'

profile::contacts::role_contacts: ['Traffic', 'ServiceOps']

profile::nginx::variant: 'custom'
profile::nginx::modules: ['lua']
profile::nginx::managed: false

profile::bird::advertise_vips:
  hcaptcha-proxy.anycast.wmnet:
    ensure: present
    address: 10.3.0.10
    check_cmd: '/usr/lib/nagios/plugins/check_http -H hcaptcha.wikimedia.org --ssl --sni -I 10.3.0.10 -p 4260 -u /healthz -t 1'
    service_type: hcaptcha-proxy

# this sets After/BindsTo to nginx on anycast-healthchecker.service
profile::bird::bind_anycast_services:
  - 'nginx'

profile::bird::routed_ganeti_apt: true

profile::bird::anycasthc_logging:
  level: 'info'
  num_backups: 1

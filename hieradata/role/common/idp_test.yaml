profile::idp::log_level: 'DEBUG'
profile::idp::tgc_cookie_same_site: 'strict'
profile::idp::tgc_cookie_pin_to_session: false
profile::tlsproxy::envoy::floc_opt_out: true
profile::tlsproxy::envoy::upstream_addr: 127.0.0.1
profile::tlsproxy::envoy::use_remote_address: true
profile::tlsproxy::envoy::listen_ipv6: true
profile::tlsproxy::envoy::services:
  - server_names: ['*']
    port: 8080
profile::tlsproxy::envoy::ssl_provider: 'acme'
profile::tlsproxy::envoy::global_cert_name: idp-test
profile::tlsproxy::envoy::firewall_global: true

profile::idp::enable_cors: true
profile::idp::cors_allow_credentials: true
profile::idp::cors_allowed_origins:
  - 'https://alerts.wikimedia.org'
profile::idp::services:
  puppetboard:
    id: 1
    service_id: 'https://puppetboard-(idp|saml)test\.wikimedia\.org(/.*)?'
    member_of_exclude: '^cn=tools(beta)?.*,ou=servicegroups,.*$'
    required_groups:
      - ops
      - ops-limited
      - idptest-users
    mfa: ['mfa-webauthn',]
  idp_cloud_dev:
    id: 2
    service_id: 'https://idp-dev\.wmcloud\.org(/.*)?'
  idm_dev:
    id: 3
    service_class: 'OidcRegisteredService'
    service_id: 'https://idm-test\.wikimedia\.org\/[\w\/]*'
    profile_format: 'NESTED'
  netbox_next:
    id: 4
    service_class: 'OidcRegisteredService'
    service_id: 'https://netbox-next\.wikimedia\.org\/[\w\/]*'
    required_groups:
      - wmf
      - netbox-readonly-access
  gitlab_oidc:
    id: 5
    service_class: 'OidcRegisteredService'
    service_id: 'https://gitlab\.wikimedia\.org(/.*)?'
  gitlab_replica_oidc:
    id: 6
    service_class: 'OidcRegisteredService'
    service_id: 'https://gitlab-replica(-a|-b)\.wikimedia\.org(/.*)?'
    required_groups:
      - nda
      - wmf
  juniper:
    id: 7
    service_class: 'OidcRegisteredService'
    service_id: 'https://apigw\.juniper\.net/css-asset/1\.0'
    profile_format: 'NESTED'
  datahub_staging:
    id: 8
    service_class: 'OidcRegisteredService'
    service_id: 'https://datahub-next\.wikimedia\.org(/.*)?'
    required_groups:
      - nda
      - wmf
  thanos_oidc:
    id: 9
    service_class: 'OidcRegisteredService'
    service_id: 'https://thanos\.o11y\.wmcloud\.org(/.*)?'
    required_groups:
      - nda
      - wmf
  logstash_oidc:
    id: 10
    service_class: 'OidcRegisteredService'
    service_id: 'https://beta-logs(-idp)?\.wmcloud\.org(/.*)?'
    required_groups:
      - nda
      - logstash-access
      - ops
  test_kitchen_next:
    id: 11
    service_class: 'OidcRegisteredService'
    service_id: 'http://test-kitchen-next\.wikimedia\.org(/.*)?'
    required_groups:
      - nda
      - wmf
  netbox_dev:
    id: 12
    service_class: 'OidcRegisteredService'
    service_id: 'https://netbox-dev\.wikimedia\.org\/[\w\/]*'
    required_groups:
      - wmf
      - nda
  prometheus_oidc:
    id: 13
    service_class: 'OidcRegisteredService'
    service_id: 'https://prometheus-(.+)\.o11y\.wmcloud\.org(/.*)?'
    required_groups:
      - nda
      - wmf
  airflow_test_k8s:
    id: 14
    service_class: 'OidcRegisteredService'
    service_id: 'https://airflow-test-k8s\.wikimedia\.org(/.*)?'
    required_groups:
      - wmf
      - nda
  alerts:
    id: 15
    service_class: 'OidcRegisteredService'
    service_id: 'https://alerts\.o11y\.wmcloud\.org(/.*)?'
    required_groups:
      - nda
      - wmf
  phabricator_dev:
    id: 16
    service_class: 'OidcRegisteredService'
    service_id: 'https://phabricator\.wmcloud\.org(/.*)?'
    required_groups: []
  growthbook_next:
    id: 17
    service_class: 'OidcRegisteredService'
    service_id: 'https://growthbook-next\.wikimedia\.org(/.*)?'
    required_groups:
      # A new user is automatically provisioned at login-time, and each user takes up
      # one seat in our license. As such, we restrict login to users belonging to the
      # growthbook LDAP groups defining their roles/permissions.
      - growthbook-admin
      - growthbook-customelevatedaccess
      - growthbook-readonly
  turnilo_next:
    id: 19
    service_id: 'https://turnilo-next\.wikimedia\.org(/.*)?'
    member_of_exclude: '^cn=tools(beta)?.*,ou=servicegroups,.*$'
    required_groups:
    - nda
    - wmf

profile::idp::ldap_attributes:
  - cn
  - memberOf
  - mail
  - mfa-method
  - uid
  - givenName
profile::tlsproxy::instance::ssl_compatibility_mode: strong
profile::idp::actuators:
  - sso
  - ssoSessions
profile::idp::server_name: https://idp-test.wikimedia.org
profile::idp::idp_nodes:
  - idp-test1005.wikimedia.org
  - idp-test2005.wikimedia.org
profile::idp::is_staging_host: true
profile::idp::redis_server: rdb2011.codfw.wmnet
profile::idp::redis_port: 6378
profile::idp::redis_database: 1
profile::idp::theme: wikimedia
profile::idp::u2f_jpa_enable: true
profile::idp::u2f_jpa_server: m1-master.eqiad.wmnet
profile::idp::u2f_jpa_db: cas_staging
profile::prometheus::memcached_exporter::arguments: '--memcached.address=localhost:11000'
profile::java::egd_source: '/dev/urandom'
profile::idp::u2f_token_expiry_days: 3650
profile::contacts::role_contacts: ['Infrastructure Foundations']
profile::base::production::role_description: 'CAS Identity provider (staging setup)'
profile::idp::oidc_id_token_claims: true
profile::idp::enable_webauthn: true
profile::idp::webauthn_relying_party: idp-test.wikimedia.org
profile::firewall::provider: nftables

profile::idp::tomcat_heap_mem: '4096m'
profile::java::java_packages:
  - version: "21"
    variant: "jdk"

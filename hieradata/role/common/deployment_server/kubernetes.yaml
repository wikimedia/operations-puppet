# Options for mw-on-k8s deployments for scap
scap::k8s_deployments:
  clusters:
    - eqiad
    - codfw
  file: /etc/helmfile-defaults/mediawiki-deployments.yaml
  releases_dir: /etc/helmfile-defaults/mediawiki/release

# MediaWiki-on-k8s Deployments managed by Scap. Describes what images are
# deployed where (deployment_targets) and how Scap should supervise the health
# of those releases when they're updated (supervision_rules).
profile::kubernetes::deployment_server::mediawiki::release::mw_deployments:
  deployment_targets:
    - namespace: mw-debug
      scope: train
      releases:
        pinkunicorn:
          stage: testservers
        next:
          stage: testservers
      mw_kind: "debug-image"
      mw_flavour: "publish-83"
      web_flavour: "webserver-bookworm"
    - namespace: mw-experimental
      scope: train
      releases:
        pinkllama:
          deploy: false
      mw_kind: "debug-image"
      mw_flavour: "publish-83"
      web_flavour: "webserver-bookworm"
    - namespace: mw-web
      scope: train
      releases:
        main: {}
        canary:
          stage: "canaries"
        next: {}
        migration: {}
      mw_flavour: "publish-83"
      web_flavour: "webserver-bookworm"
    - namespace: mw-api-int
      scope: train
      releases:
        main: {}
        canary:
          stage: "canaries"
        migration: {}
      mw_flavour: "publish-83"
      web_flavour: "webserver-bookworm"
    - namespace: mw-api-ext
      scope: train
      releases:
        main: {}
        canary:
          stage: "canaries"
        next: {}
        migration: {}
      mw_flavour: "publish-83"
      web_flavour: "webserver-bookworm"
    - namespace: mw-jobrunner
      scope: train
      releases:
        main: {}
        canary:
          stage: "canaries"
        migration: {}
      mw_flavour: "publish-83"
      web_flavour: "webserver-bookworm"
    - namespace: mw-parsoid
      scope: train
      releases:
        pinkllama:
          deploy: false
      mw_flavour: "publish-83"
      web_flavour: "webserver-bookworm"
    - namespace: mw-misc
      scope: train
      releases:
        main:
          stage: testservers
      mw_kind: "debug-image"
      mw_flavour: "publish-83"
      web_flavour: "webserver-bookworm"
    - namespace: mw-wikifunctions
      scope: train
      releases:
        group0: {}
        group1: {}
        group2: {}
      mw_flavour: "publish-83"
      web_flavour: "webserver-bookworm"
    - namespace: mw-videoscaler
      scope: train
      releases:
        main: {}
      mw_flavour: "publish-83"
      web_flavour: "webserver-bookworm"
    - namespace: mw-cron
      scope: train
      releases:
        main: {}
      mw_kind: "cli-image"
      mw_flavour: "publish-83"
      web_flavour: "webserver-bookworm"
    - namespace: mw-script
      scope: train
      releases:
        main:
          deploy: false
        next:
          deploy: false
      mw_kind: "cli-image"
      mw_flavour: "publish-83"
      web_flavour: "webserver-bookworm"
    - namespace: mediawiki-dumps-legacy
      scope: train
      releases:
        production: {}
      mw_flavour: "publish-83"
      mw_kind: "cli-image"
      dir: "dse-k8s-services"
      clusters: ["dse-k8s-eqiad"]
      web_flavour: "webserver-bookworm"
    - namespace: mw-pretrain
      scope: pretrain
      releases:
        main: {}
        canary:
          stage: canaries
        debug:
          stage: testservers
          mw_kind: "debug-image"
        jobrunner: {}
        jobrunner-canary:
          stage: canaries
      mw_flavour: "publish-83"
      web_flavour: "webserver-bookworm"
  supervision_rules:
    - scope: train
      stages:
        testservers:
          - commands:
            - "httpbb /srv/deployment/httpbb-tests/appserver/* --hosts=mwdebug.discovery.wmnet --https_port=4444 --retry_on_timeout"
            - "httpbb /srv/deployment/httpbb-tests/appserver/* --hosts=mwdebug-next.discovery.wmnet --https_port=4453 --retry_on_timeout"
        canaries:
          - logstash_check:
              threshold: 10
        production:
          - logstash_check:
              threshold: 150
    - scope: pretrain
      stages:
        testservers:
          - commands:
            - "httpbb /srv/deployment/httpbb-tests/pretrain/* --hosts=mw-pretrain.discovery.wmnet --https_port=30443 --request_header 'x-wikimedia-debug: backend=k8s-mw-pretrain' --retry_on_timeout"
        # TODO: Introduce logstash_check rules for the canary and production
        # stages, including pretrain-scope rules with appropriate thresholds
        # and a train-scope backstop rule.
        canaries: []
        production:
          # Run the httpbb pretrain suite again, this time against the main
          # traffic-serving release updated in the production stage, in hopes
          # of detecting errors surfaced by the test suite (and supplementing
          # organic testwiki traffic).
          - commands:
            - "httpbb /srv/deployment/httpbb-tests/pretrain/* --hosts=mw-pretrain.discovery.wmnet --https_port=30443 --retry_on_timeout"
profile::kubernetes::deployment_server::include_admin: true
# Default and environment specific generic values go here.
# default:
#   ..
# eqiad:
#   ..
profile::kubernetes::deployment_server::general:
  default:
    # Use the internal discovery domain as default registry
    docker:
      registry: "docker-registry.discovery.wmnet"
    # envoy
    mesh:
      image_version: 1.35.9-1
      telemetry:
        enabled: true
    # prometheus-statsd-exporter
    monitoring:
      image_version: 0.26.1-2-20250907
    # common sidecar images versions
    # TODO: autogenerate this from the registry.
    common_images:
      httpd:
        exporter: prometheus-apache-exporter:0.0.4-20240623
      mcrouter:
        mcrouter: mcrouter:2023.07.17.00-1-20240714
        exporter: prometheus-mcrouter-exporter:0.0.1-3-20240714
      nutcracker:
        nutcracker: nutcracker:0.0.5-20240825
        exporter: prometheus-nutcracker-exporter:0.0.2-20211010
      rsyslogd: rsyslog:8.2504.0-1
      statsd:
        exporter: prometheus-statsd-exporter:0.26.1-2-20250907
      # All vanilla PostgreSQL majors are published to the same image
      # repository, with the major version as the tag prefix.
      postgresql:
        "15": 2025-08-06-145838-e8a1b6ac1f969432aa274426a7db1baf8b02cb21@sha256:29254e052217729cbd96562e8d35827739ca6375a047653e1e206539d570fd87
        "17": 17-2026-07-17-091841-131dc49e888398c31163376f8c15962394316b2f@sha256:5ba36e45bc6db50b89acb1da0c1694a1a758de3243e562f6be6ec8736e1bd48c
      postgresql-documentdb:
        "17": 2025-10-24-084441-747c01dd2c614a9534f5dec8ba19309468a443f4@sha256:86ea4cdc7c894b0c581b95264d3d4b587b15eec455792da215c0e3d060267ddd
  eqiad:
    mesh:
      certmanager: &certmanager_eqiad
        enabled: true
        domains:
          - discovery.wmnet
          - svc.eqiad.wmnet
  codfw:
    mesh:
      certmanager: &certmanager_codfw
        enabled: true
        domains:
          - discovery.wmnet
          - svc.codfw.wmnet
  staging-eqiad:
    mesh:
      certmanager: &wikikube_staging_certmanager
        enabled: true
        # We have a wildcard DNS entry for *.k8s-staging.discovery.wmnet
        # used for ingress, but we can reuse that for NodePort services as well.
        domains:
          - k8s-staging.discovery.wmnet
        # Staging used a generic cergen cert with the following SAN
        # so we keep them for backwards compatibility.
        extraFQDNs:
          - staging.svc.eqiad.wmnet
  staging-codfw:
    mesh:
      certmanager:
        <<: *wikikube_staging_certmanager
        extraFQDNs:
          - staging.svc.codfw.wmnet
  ml-serve-eqiad:
    mesh:
      certmanager:
        <<: *certmanager_eqiad
  ml-serve-codfw:
    mesh:
      certmanager:
        <<: *certmanager_codfw
  ml-staging-codfw:
    mesh:
      certmanager:
        enabled: true
        # We have a wildcard DNS entry for *.k8s-ml-staging.discovery.wmnet
        # used for ingress, but we can reuse that for NodePort services as well.
        domains:
          - k8s-ml-staging.discovery.wmnet
        # Staging used a generic cergen cert with the following SAN
        # so we keep them for backwards compatibility.
        extraFQDNs:
          - ml-staging.svc.eqiad.wmnet
          - ml-staging.svc.eqiad.wmnet
  dse-k8s-eqiad:
    mesh:
      certmanager:
        <<: *certmanager_eqiad
  dse-k8s-codfw:
    mesh:
      certmanager:
        <<: *certmanager_codfw
  aux-k8s-eqiad:
    mesh:
      certmanager:
        <<: *certmanager_eqiad
  aux-k8s-codfw:
    mesh:
      certmanager:
        <<: *certmanager_codfw

profile::mediawiki::deployment::server::rsync_host: "deployment.%{::site}.wmnet"
profile::mediawiki::apc_shm_size: 128M

profile::contacts::role_contacts: ["ServiceOps"]
profile::base::production::role_description: 'Deployment server for all Wikimedia services'

# enable docker with the desired settings
profile::docker::engine::declare_service: false
profile::docker::engine::settings:
  data-root: "/srv/docker"
  live-restore: true
  iptables: false
  storage-driver: "overlay2"
profile::ci::pipeline::publisher::docker_registry_user: "ci-restricted"
# Prune at 3 days old instead of 14
docker::prune_old_images::older_than: 3

profile::monitoring::nrpe_check_disk_options: -w 10% -c 5% -W 6% -K 3% -l -e -A -i '/(var/lib|run)/(docker|kubelet)/*' --exclude-type=tracefs --exclude-type=overlay

# The deployment group for mediawiki is called "deployment".
# See T303857
deployment_group: "deployment"
# T434114
scap::logstash_credentials_group: "%{alias('deployment_group')}"

# T310395
profile::mediawiki::deployment::server::enable_auto_deploy: true
# See https://releases-jenkins.wikimedia.org/job/Automatic%20branch%20cut/configure for the schedule
# of the branch cut job that auto deployment relies on.
profile::mediawiki::deployment::server::auto_deploy_interval: Mon *-*-* 20:00:00 America/Los_Angeles
profile::mediawiki::deployment::server::auto_clean_interval: Mon *-*-* 21:00:00 America/Los_Angeles
profile::mediawiki::deployment::server::scap_clean_images_interval: Mon *-*-* 21:30:00 America/Los_Angeles
profile::mediawiki::deployment::server::pretrain_interval: "*-*-* 02:00:00 UTC"
# T367118 Add conftool-data for consumption by helmfile for maintenance jobs control
profile::confd::instances:
  main:
    interval: 30

# T383945
profile::mediawiki::deployment::server::ensure_spiderpig: present
profile::envoy::ensure: present
profile::tlsproxy::envoy::ssl_provider: cfssl
profile::tlsproxy::envoy::cfssl_label: 'discovery2026'
profile::tlsproxy::envoy::sni_support: "yes"
profile::tlsproxy::envoy::services:
   - server_names: ["spiderpig.wikimedia.org"]
     port: 9000
     cert_name: "spiderpig.wikimedia.org"
profile::tlsproxy::envoy::global_cert_name: "deployment.eqiad.wmnet"
# Unsetting the kubernetes client version will make it install kubectl versions matching all k8s versions
# we are currently using.
profile::kubernetes::client::version: ~


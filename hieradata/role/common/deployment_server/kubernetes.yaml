profile::resolving::domain_search:
  - wikimedia.org
  - eqiad.wmnet
  - codfw.wmnet
cluster: misc
# Needed for docker
profile::base::overlayfs: true
profile::admin::groups:
  - restricted
  - deployment
  - deploy-ml-service
  - wdqs-admins
  - deploy-design
  - deploy-phabricator
  - analytics-deployers
  - gerrit-deployers
  - zuul-deployers
  - deployment-ci-admins
  - deployment-jenkins
  - deployment-docker
  - research-deployers
  - platform-eng-deployers
  - release-engineering
  - airflow-deployers

# We still don't enable fpm here
profile::mediawiki::php::enable_fpm: false
profile::mediawiki::php::php_versions: ['8.3']
profile::mediawiki::php::absented_php_versions: ['8.1']
profile::mediawiki::php::enable_php83_icu72: true

# Default scap server configuration.  This is used in production.
# If you are setting up a scap server in labs, these will be used
# unless you override them for your labs project.
# See the overrides in hieradata/labs/deployment-prep/common.yaml
# for an example.

# keyholder::agent declarations.  These are created
# by the profile::keyholder::server class.  Each agent listed here
# will be present and useable by scap on the scap deploy server.
# NOTE: since labs
profile::keyholder::server::agents:
  mwdeploy:
    trusted_groups:
      - wikidev
      - mwdeploy
      - mwbuilder
      - deployment

  phabricator:
    trusted_groups:
      - deploy-phabricator

  gerrit:
    trusted_groups:
      - gerrit-deployers

  deploy-service:
    trusted_groups:
      - deployment

  dumpsdeploy:
    trusted_groups:
      - ops

  analytics_deploy:
    trusted_groups:
      - analytics-deployers

  deploy-librenms:
    trusted_groups:
      - ops

  deploy-debmonitor:
    trusted_groups:
      - ops

  apache2modsec:
    trusted_groups:
      - ops
      - gerrit-admin

  netbox:
    trusted_groups:
      - ops

  deploy-homer:
    trusted_groups:
      - ops

  deploy-hiddenparma:
    trusted_groups:
      - ops

  deploy-ci-docroot:
    trusted_groups:
      - deployment-ci-admins

  deploy-zuul:
    trusted_groups:
      - zuul-deployers

  deploy-jenkins:
    trusted_groups:
      - deployment-jenkins

  deploy-design:
    trusted_groups:
      - deploy-design

  scap:
    trusted_groups:
      - deployment

  # Shared ssh key for Release Engineering's Train-related
  # Gerrit patches (T310620)
  trainbranchbot:
    trusted_groups:
      - deployment

profile::mediawiki::scap_client::is_master: true

# General configs
cluster: relforge
profile::admin::groups:
  - elasticsearch-roots

# Role contacts appears to express ownership (comment 1 of 2)
profile::contacts::role_contacts: ['Data Platform']

# Whereas contact groups appears to define which team(s) receive alerts (comment 2 of 2)
contactgroups: 'team-data-platform,team-discovery'
profile::base::production::role_description: 'Elasticsearch relforge'

# Profile configuration follows

profile::opensearch::cirrus::ssl_provider: cfssl
profile::opensearch::cirrus::ferm_srange: '(($CUMIN_MASTERS $ANALYTICS_NETWORKS $STAGING_KUBEPODS_NETWORKS))'
profile::opensearch::cirrus::expose_http: false
profile::opensearch::cirrus::server::ship_server_json_logs: true

profile::opensearch::s3_username: 'search:platform'
profile::opensearch::rack: ''
profile::opensearch::row: ''
profile::opensearch::version: '2.19.5'
profile::opensearch::config_version: '2'
profile::opensearch::base_data_dir: /srv/opensearch
profile::opensearch::java_home: '/usr/lib/jvm/java-21-openjdk-amd64'
profile::opensearch::native_lib_path: '/usr/share/opensearch/plugins/opensearch-knn/lib'

profile::opensearch::instances:
    relforge-eqiad:
        cluster_name: 'relforge-eqiad'
        short_cluster_name: chi
        # Bootstrap-only node names for first cluster formation
        # Uncomment only when bootstrapping a brand-new cluster;
        # comment out again after the cluster has formed
#        initial_cluster_manager_nodes:
#          - relforge1008-relforge-eqiad
#          - relforge1009-relforge-eqiad
#          - relforge1010-relforge-eqiad
        heap_memory: '30G'
        http_port: 9200
        tls_port: 9243
        transport_tcp_port: 9300
        certificate_name: 'relforge.svc.eqiad.wmnet'
    relforge-eqiad-small-alpha:
        cluster_name: 'relforge-eqiad-small-alpha'
        short_cluster_name: omega
        # Bootstrap-only node names for first cluster formation
        # Uncomment only when bootstrapping a brand-new cluster;
        # comment out again after the cluster has formed
#        initial_cluster_manager_nodes:
#          - relforge1008-relforge-eqiad-small-alpha
#          - relforge1009-relforge-eqiad-small-alpha
#          - relforge1010-relforge-eqiad-small-alpha
        heap_memory: '4G'
        http_port: 9400
        tls_port: 9443
        transport_tcp_port: 9500
        certificate_name: 'relforge.svc.eqiad.wmnet'

profile::opensearch::common_settings:
    awareness_attributes: 'row'
    # We should be able to run "OK" with a single server.
    recover_after_nodes: 1
    recover_after_time: '1m'

    search_shard_count_limit: 1000

    # Allow reindex from eqiad or codfw to relforge
    reindex_remote_whitelist: 'search.svc.eqiad.wmnet:9243,search.svc.codfw.wmnet:9243'

    # Make the full cpu resources available for indexing
    bulk_thread_pool_executors: 32
    bulk_thread_pool_capacity: 1000

    # Increase the per-node cache for compiled LTR models from default 10MB
    ltr_cache_size: '100mb'

    auto_create_index: true
    plugins_mandatory:
      - analysis-hebrew
      - analysis-icu
      - analysis-nori
      - analysis-smartcn
      - analysis-stempel
      - analysis-sudachi
      - analysis-ukrainian
      - cirrus-highlighter
      - opensearch-analysis-stconvert
      - opensearch-extra
      - opensearch-extra-analysis-esperanto
      - opensearch-extra-analysis-homoglyph
      - opensearch-extra-analysis-khmer
      - opensearch-extra-analysis-serbian
      - opensearch-extra-analysis-slovak
      - opensearch-extra-analysis-textify
      - opensearch-extra-analysis-turkish
      - opensearch-extra-analysis-ukrainian
      - opensearch-ltr
      - opensearch-security
      - repository-s3

    filter_cache_size: '20%'
    script_max_compilations_per_minute: 10000
    send_logs_to_logstash: false
    # Write the on-disk JSON server logs in ECS format (T324335)
    ecs_server_logs: true
    # If this is set to true and the
    # security plugin is not listed under
    # plugins_mandatory above, the
    # opensearch service will fail to start.
    disable_security_plugin: true

profile::opensearch::cirrus::enable_remote_search: false

profile::tlsproxy::instance::nginx_variant: 'light'

profile::opensearch::cirrus::certificate_domains:
  - 'relforge.svc.eqiad.wmnet'

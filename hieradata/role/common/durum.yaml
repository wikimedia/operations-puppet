cluster: 'durum'

profile::durum::service::domain: 'check.wikimedia-dns.org'
profile::durum::service::ipv4: &landing_ipv4 185.71.138.139
profile::durum::service::ipv6: &landing_ipv6 2001:67c:930::2

profile::durum::service::ips:
  landing:
    - *landing_ipv4
    - *landing_ipv6
  success_doh:
    - &successdoh_ipv4
      185.71.138.140
    - &successdoh_ipv6
      2001:67c:930::3
  failure:
    - &failure_ipv4
      185.71.138.141
    - &failure_ipv6
      2001:67c:930::4
  success_dot:
    - &successdot_ipv4
      185.71.138.142
    - &successdot_ipv6
      2001:67c:930::5

profile::durum::service::common:
  durum_path: '/srv/durum'

profile::firewall::provider: nftables
profile::firewall::nftables_throttling::ensure: present
profile::firewall::nftables_throttling::policy: accept
# allow 25 parallel TCP connections, ban clients above for 300 seconds
profile::firewall::nftables_throttling::max_connections: 25
profile::firewall::nftables_throttling::throttle_duration: 300
profile::firewall::nftables_throttling::port: 443
profile::firewall::nftables_throttling::nft_logging: false

profile::bird::advertise_vips:
  check.wikimedia-dns.org:
    ensure: present
    address: *landing_ipv4
    check_cmd: "/usr/lib/nagios/plugins/check_http -H %{lookup('profile::durum::service::domain')} --ssl --sni -I %{lookup('profile::durum::service::ipv4')} -u / -t 1"
    address_ipv6: *landing_ipv6
    check_cmd_ipv6: "/usr/lib/nagios/plugins/check_http -H %{lookup('profile::durum::service::domain')} --ssl --sni -I %{lookup('profile::durum::service::ipv6')} -u / -t 1"
    service_type: durum
  yesdoh.check.wikimedia-dns.org:
    ensure: present
    address: *successdoh_ipv4
    check_cmd: "/usr/lib/nagios/plugins/check_http -H yesdoh.check.wikimedia-dns.org --ssl --sni -I 185.71.138.140 -u /check -t 1"
    address_ipv6: *successdoh_ipv6
    check_cmd_ipv6: "/usr/lib/nagios/plugins/check_http -H yesdoh.check.wikimedia-dns.org --ssl --sni -I 2001:67c:930::3 -u /check -t 1"
    service_type: durum
  no.check.wikimedia-dns.org:
    ensure: present
    address: *failure_ipv4
    check_cmd: "/usr/lib/nagios/plugins/check_http -H no.check.wikimedia-dns.org --ssl --sni -I 185.71.138.141 -u /check -t 1"
    address_ipv6: *failure_ipv6
    check_cmd_ipv6: "/usr/lib/nagios/plugins/check_http -H no.check.wikimedia-dns.org --ssl --sni -I 2001:67c:930::4 -u /check -t 1"
    service_type: durum
  yesdot.check.wikimedia-dns.org:
    ensure: present
    address: *successdot_ipv4
    check_cmd: "/usr/lib/nagios/plugins/check_http -H yesdot.check.wikimedia-dns.org --ssl --sni -I 185.71.138.142 -u /check -t 1"
    address_ipv6: *successdot_ipv6
    check_cmd_ipv6: "/usr/lib/nagios/plugins/check_http -H yesdot.check.wikimedia-dns.org --ssl --sni -I 2001:67c:930::5 -u /check -t 1"
    service_type: durum

profile::bird::bind_anycast_services:
  - 'nginx'

profile::bird::anycasthc_logging:
  level: 'info'
  num_backups: 1

profile::nginx::variant: 'custom'
profile::nginx::modules: []

profile::contacts::role_contacts: ['Traffic']
profile::base::production::role_description: 'Check service for Wikidough'

# Bug: T205378.
# This was enabled once but disabled on June 19 2025; preserving for posterity and possible later use.
profile::durum::do_ech: false
profile::durum::ech_key_dir: '/etc/ssl/ech'
profile::durum::ech_outer_sni: 'wikimedia-ech.org'

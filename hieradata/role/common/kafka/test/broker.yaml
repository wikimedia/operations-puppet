# Notify the Data Platform SRE team about services on these hosts
contactgroups: 'admins,team-data-platform'

cluster: kafka_test

profile::kafka::broker::kafka_cluster_name: test-eqiad

# Enable SSL/TLS for Kafka. When using PKI (default), this requires
# only profile::kafka::broker::ssl_password committed in
# the expected location in ops/puppet/private.
profile::kafka::broker::ssl_enabled: true
profile::base::certificates::include_bundle_jks: true

profile::kafka::broker::auth_acls_enabled: true

profile::kafka::broker::log_retention_hours: 24

profile::kafka::broker::monitoring_enabled: true
profile::kafka::broker::monitoring::is_critical: false

profile::kafka::broker::max_heap_size: '2g'

profile::kafka::broker::confluent_distribution: '77'

# The wdqs hosts below are those with the puppet role of wdqs::alternatives
# The are being used to test alternatives to blazegraph. See #T414782 and #T421048
profile::kafka::broker::custom_ferm_srange_components:
  - '$STAGING_KUBEPODS_NETWORKS'
  - '$DSE_KUBEPODS_NETWORKS'
  - '$AUX_KUBEPODS_NETWORKS'
  - '$PRODUCTION_NETWORKS'
  - '$FRACK_NETWORKS'
  - '(@resolve((wdqs1028.eqiad.wmnet)) @resolve((wdqs1028.eqiad.wmnet), AAAA))'
  - '(@resolve((wdqs1029.eqiad.wmnet)) @resolve((wdqs1029.eqiad.wmnet), AAAA))'
  - '(@resolve((wdqs1030.eqiad.wmnet)) @resolve((wdqs1030.eqiad.wmnet), AAAA))'
  - '(@resolve((wdqs1031.eqiad.wmnet)) @resolve((wdqs1031.eqiad.wmnet), AAAA))'
  - '(@resolve((wdqs1032.eqiad.wmnet)) @resolve((wdqs1032.eqiad.wmnet), AAAA))'
  - '(@resolve((wdqs2009.codfw.wmnet)) @resolve((wdqs2009.codfw.wmnet), AAAA))'

# To be changed during Kafka broker version upgrades
profile::kafka::broker::inter_broker_protocol_version: '3.7'

profile::java::java_packages:
  - version: '21'
    variant: 'jdk'
profile::kafka::broker::use_modern_jvm_default_opts: true

profile::contacts::role_contacts: ['Data Platform']
profile::base::production::role_description: "Kafka Broker in a 'test' Kafka cluster"

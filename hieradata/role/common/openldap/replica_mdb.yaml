profile::openldap::certname: ldap
profile::openldap::hash_passwords: SSHA
profile::openldap::storage_backend: mdb
profile::openldap::mirror_mode: false
profile::openldap::backup: false
profile::openldap::read_only: true
 
profile::lvs::realserver::pools:
  ldap-ro:
    services:
      - slapd
  ldap-ro-ssl:
    services:
      - slapd
profile::contacts::role_contacts: ['Infrastructure Foundations']
profile::base::production::role_description: 'LDAP read-only replica with MDB storage'
profile::lvs::realserver::ipip::enabled: true
profile::base::enable_rp_filter: false

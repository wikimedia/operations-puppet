cluster: cephosd

profile::contacts::role_contacts: ['Data Platform']
profile::base::production::role_description: 'DPE Ceph cluster administration host'

profile::firewall::provider: nftables

# Deploy the cluster administrative keyring, but do not import any keys.
# The cephosd hosts own the auth database with profile::ceph::auth::load_all.
profile::ceph::auth::deploy::selected_creds:
  - admin

# The OpenTofu root modules in dpe-infra. A path unit watches the state file of each one.
profile::ceph::admin::tofu_root_modules:
  - rgw_accounts
  - rgw_bucket_access
  - rgw_global_bucket
  - rgw_global_user

# The administration host of each site. Each host keeps a copy of the OpenTofu state snapshots
# of the other site.
profile::ceph::admin::state_hosts:
  eqiad: ceph-admin1001.eqiad.wmnet
  codfw: ceph-admin2001.codfw.wmnet

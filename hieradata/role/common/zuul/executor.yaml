# Image refs
# See https://gitlab.wikimedia.org/repos/releng/zuul/zuul/-/releases
profile::zuul::executor::image: 'docker-registry.wikimedia.org/repos/releng/zuul/zuul/zuul-executor:14.2.0-2@sha256:c9eb87aeec6ef79732400757dbfbe0947efb3a4a471d7d04e5cb2e19055f023a'

profile::contacts::role_contacts: ['Collaboration Services']
profile::admin::groups:
  - contint-roots

# Executor
profile::zuul::executor::finger_port: "%{alias('profile::zuul::base::finger_port')}"

# Docker
profile::base::overlayfs: true
profile::docker::engine::declare_service: true
profile::docker::engine::settings:
  iptables: false

# zuul-bwrap uses bwrap (bubblewrap) for isolation/sandboxing jobs
# it needs this or fails with an exception T403847#11164757
profile::base::unprivileged_userns_clone: true

profile::zuul::base::tls_config_dir: '/etc/zuul/zookeeper-tls'
profile::zuul::base::zookeeper_tls_fullchain: "%{hiera('profile::zuul::base::tls_config_dir')}/zuul_full_chain.pem"
profile::zuul::base::launcher_connection: 'zuul.eqiad1.wikimedia.cloud'

profile::zuul::executor::tls_config_dir: "%{hiera('profile::zuul::base::tls_config_dir')}"

# http(s) proxy configuration
profile::zuul::executor::http_proxy: "%{alias('http_proxy')}"
profile::zuul::executor::no_proxy: "%{alias('profile::environment::no_proxy_domains')}"

profile::base::production::role_description: 'CI server with newer version of zuul - T395938'
profile::contacts::role_contacts: ['Collaboration Services']
profile::admin::groups:
  - contint-roots
profile::zookeeper::cluster_name: "zuul-%{::site}"
profile::zookeeper::enable_tls: true

# Control the systemd services
profile::zuul::zuul_web::service_ensure: 'present'
profile::zuul::nodepool::service_ensure: 'present'
profile::zuul::scheduler::service_ensure: 'present'

# Docker
profile::base::overlayfs: true
profile::docker::engine::declare_service: true
profile::docker::engine::settings:
  iptables: false

# Nodepool - T400850
profile::zuul::nodepool::certificate_authority_data: ''
profile::zuul::nodepool::server_url: 'https://k8s-api.svc.zuul.eqiad1.wikimedia.cloud:6443'
profile::zuul::nodepool::tls_server_name: '127.0.0.1'
profile::zuul::nodepool::proxy_url: 'http://webproxy:8080'
profile::zuul::nodepool::image_version: 'wmf-12.0.0-5'

# Scheduler
profile::zuul::scheduler::image_version: 'wmf-12.0.0-5'

# zuul-web
profile::zuul::zuul_web::image_version: 'wmf-12.0.0-5'

# TLS termination
profile::envoy::ensure: present
profile::tlsproxy::envoy::firewall_src_sets:
  - CACHES
profile::tlsproxy::envoy::services:
  - server_names: ["*"]
    port: 80

profile::tlsproxy::envoy::tls_port: 443
profile::tlsproxy::envoy::ssl_provider: cfssl
profile::tlsproxy::envoy::cfssl_options:
  hosts:
    - zuul.wikimedia.org
profile::tlsproxy::envoy::global_cert_name: "zuul.wikimedia.org"

profile::tlsproxy::envoy::firewall_src_sets:
  - CACHES

# zookeeper <-> zuul certificates
profile::zuul::base::tls_config_dir: '/etc/zookeeper/zuul-tls'
profile::zuul::base::zookeeper_tls_fullchain: "%{hiera('profile::zuul::base::tls_config_dir')}/zuul_full_chain.pem"
profile::zookeeper::tls_keystore: "%{hiera('profile::zuul::base::tls_config_dir')}/zookeeper_zuul.keystore.p12"
profile::zookeeper::tls_truststore: "%{hiera('profile::zuul::base::zookeeper_tls_fullchain')}"
profile::zuul::main::tls_config_dir: "%{hiera('profile::zuul::base::tls_config_dir')}"

# debug TLS (zookeeper<->zuul)
profile::zookeeper::server::extra_java_opts: "-Djavax.net.debug=ssl,handshake"




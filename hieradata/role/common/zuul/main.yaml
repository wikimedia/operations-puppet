profile::base::production::role_description: 'CI server with newer version of zuul - T395938'
profile::contacts::role_contacts: ['Collaboration Services']
profile::admin::groups:
  - contint-roots
profile::zookeeper::cluster_name: "zuul-%{::site}"
profile::zookeeper::enable_tls: true

# Docker
profile::base::overlayfs: true
profile::docker::engine::declare_service: true
profile::docker::engine::settings:
  iptables: false

# Launcher - T424879
profile::zuul::base::launcher_connection: 'zuul.eqiad1.wikimedia.cloud'
profile::zuul::launcher::certificate_authority_data: ''
profile::zuul::launcher::server_url: 'https://k8s-api.svc.zuul.eqiad1.wikimedia.cloud:6443'
profile::zuul::launcher::image_version: '14.2.0-2@sha256:45fdaf78945261c976cd4a06e738eb2140aaf570e7a9f5fd5e42e7f3eaf39d89'

# Scheduler
profile::zuul::scheduler::image_version: '14.2.0-2@sha256:5a3d3a2dbec901820bee653276d6496c5a23d697463453ff7bdfca0d0a700cca'
profile::zuul::scheduler::tenant_config_source: 'puppet:///modules/profile/zuul/tenants.yaml'

# zuul-web
profile::zuul::zuul_web::image_version: '14.2.0-2@sha256:6ad1d89eece3640b248e4a35a194f8599ff2f1a6753c001de56bce683a5b4628'

# TLS termination
profile::envoy::ensure: present
profile::tlsproxy::envoy::firewall_src_sets:
  - CACHES
profile::tlsproxy::envoy::services:
  - server_names: ["*"]
    port: 80

profile::tlsproxy::envoy::tls_port: 443
profile::tlsproxy::envoy::ssl_provider: cfssl
profile::tlsproxy::envoy::cfssl_label: 'discovery2026'
profile::tlsproxy::envoy::cfssl_options:
  hosts:
    - zuul.wikimedia.org
profile::tlsproxy::envoy::global_cert_name: "zuul.wikimedia.org"

profile::tlsproxy::envoy::firewall_src_sets:
  - CACHES

# zookeeper <-> zuul certificates
profile::zuul::base::tls_config_dir: '/etc/zookeeper/zuul-tls'
profile::zuul::base::zookeeper_tls_fullchain: "%{hiera('profile::zuul::base::tls_config_dir')}/zuul_full_chain.pem"
profile::zookeeper::tls_keystore: "%{hiera('profile::zuul::base::tls_config_dir')}/zookeeper_zuul.keystore.p12"
profile::zookeeper::tls_truststore: "%{hiera('profile::zuul::base::zookeeper_tls_fullchain')}"
profile::zuul::main::tls_config_dir: "%{hiera('profile::zuul::base::tls_config_dir')}"
profile::zuul::launcher::tls_config_dir: "%{hiera('profile::zuul::base::tls_config_dir')}"
profile::zuul::launcher::zookeeper_tls_fullchain: "%{hiera('profile::zuul::base::zookeeper_tls_fullchain')}"
# debug TLS (zookeeper<->zuul)
profile::zookeeper::server::extra_java_opts: "-Djavax.net.debug=ssl,handshake"


# http(s) proxy configuration
profile::zuul::scheduler::http_proxy: "%{alias('http_proxy')}"
profile::zuul::scheduler::no_proxy: "%{alias('profile::environment::no_proxy_domains')}"
profile::zuul::launcher::http_proxy: "%{alias('http_proxy')}"
profile::zuul::launcher::no_proxy: "%{alias('profile::environment::no_proxy_domains')}"
profile::zuul::web::http_proxy: "%{alias('http_proxy')}"
profile::zuul::web::no_proxy: "%{alias('profile::environment::no_proxy_domains')}"

cluster: memcached_gutter
profile::admin::groups:
  - perf-roots
profile::memcached::version: 'present'
profile::memcached::growth_factor: 1.15
profile::memcached::min_slab_size: 48
profile::memcached::size: 240640
profile::memcached::extended_options:
  - 'modern'
profile::memcached::memcached_user: 'memcache'
profile::memcached::threads: 28
profile::memcached::performance_cpu_governor: true
profile::memcached::enable_tls: true
profile::memcached::ssl_cert: "%{facts.puppet_config.hostcert}"
profile::memcached::ssl_key: "%{facts.puppet_config.hostprivkey}"
profile::memcached::localcacert: "%{facts.puppet_config.localcacert}"
profile::memcached::notls_port: 11211
profile::memcached::port: 11214
profile::memcached::firewall_src_sets:
    - DOMAIN_NETWORKS
profile::contacts::role_contacts: ['ServiceOps']
profile::base::production::role_description: 'Memcached gutter/failover cluster'

profile::firewall::provider: nftables
profile::server_depool:
  policy: skip
  message: If there are any mc-gp* servers in the same rack, please contact ServiceOps.
# TODO: We could create a cookbook or update an existing on that checks that all mc* hosts
#       are healthy, ie mc-gp* servers can be safely stay offline for a bit.

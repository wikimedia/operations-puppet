profile::admin::groups:
  - deployment
  - restricted
  - mw-log-readers

role::logging::mediawiki::udp2log::logstash_host: 'logstash.svc.eqiad.wmnet'

profile::rsyslog::udp_tee::listen: '0.0.0.0:8420'
profile::rsyslog::udp_tee::destinations:
  - 'mwlog1003.eqiad.wmnet:8421'
  - 'mwlog2003.codfw.wmnet:8421'

profile::contacts::role_contacts: ['Observability']
profile::base::production::role_description: 'MediaWiki log collector'

profile::logrotate::hourly: true

# udp2log currently fails under python3
profile::base::remove_python2_on_bullseye: false

#profile::docker_registry::ci_restricted_user_password: defined in the private repo
#profile::docker_registry::kubernetes_user_password: defined in the private repo
#profile::docker_registry::ci_build_user_password: defined in the private repo
#profile::docker_registry::prod_build_user_password: defined in the private repo
#profile::docker_registry::ml_build_user_password: defined in the private repo
#profile::docker_registry::password_salt: defined in the private repo
profile::docker_registry::swift_username: "docker"
#profile::docker_registry::swift_password defined in the private repo
#profile::docker_registry::swift_container: "docker_registry"
profile::docker_registry::certname: "docker-registry.discovery.wmnet"
profile::docker_registry::alt_names:
  - "docker-registry.discovery.wmnet"
  - "docker-registry.svc.eqiad.wmnet"
  - "docker-registry.svc.codfw.wmnet"
  - "docker-registry.wikimedia.org"
profile::docker_registry::read_only_mode: false
profile::docker_registry::authorized_k8s_clusters:
 - main

# Disable blob cache for T390251
profile::docker_registry::nginx_blob_cache: false

profile::lvs::realserver::pools:
  docker-registry:
    services:
      - docker-registry
      - nginx
# Envoy will be added later, see T215810
#      - envoyproxy
profile::lvs::realserver::ipip::enabled: true
profile::base::enable_rp_filter: false

profile::nginx::variant: 'custom'
profile::nginx::modules: []
profile::contacts::role_contacts: ['ServiceOps']
profile::base::production::role_description: 'Docker registry HA'

# Set the size of the nginx's working dir space. It represents the maximum
# size limit for a compressed Docker layer to be accepted by the Registry.
# See T360637 and T404742 for more info
profile::nginx::tmpfs_size: '12g'

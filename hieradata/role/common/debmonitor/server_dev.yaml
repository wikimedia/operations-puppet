profile::debmonitor::server::public_server_name: debmonitor-next.wikimedia.org
profile::debmonitor::server::internal_server_name: debmonitor-next.discovery.wmnet
profile::debmonitor::server::django_mysql_db_host: 10.192.32.59
# Ship logs to logging pipeline local shim
service::configuration::logstash_host: localhost
profile::envoy::ensure: present
profile::tlsproxy::envoy::upstream_addr: 127.0.0.1
profile::tlsproxy::envoy::tls_port: 7443
profile::tlsproxy::envoy::services:
  - server_names: ['*']
    port: 80
profile::tlsproxy::envoy::global_cert_name: 'debmonitor-next.discovery.wmnet'
profile::tlsproxy::envoy::ssl_provider: 'cfssl'
profile::tlsproxy::envoy::cfssl_options:
  hosts:
    - debmonitor-next.wikimedia.org

profile::tlsproxy::envoy::firewall_src_sets:
  - CACHES

profile::contacts::role_contacts: ['Infrastructure Foundations']
profile::base::production::role_description: 'Debmonitor server'

profile::firewall::provider: nftables

profile::monitoring::notifications_enabled: false

debmonitor_servers:
  - debmonitor.discovery.wmnet
  - debmonitor-next.discovery.wmnet

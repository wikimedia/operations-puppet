profile::base::systemd::cpu_accounting: 'yes'
profile::base::systemd::blockio_accounting: 'yes'
profile::base::systemd::memory_accounting: 'yes'
# Profile::cache::base
profile::cache::varnish::frontend::cache_be_opts:
    port: 3128
    connect_timeout: '3s'
    first_byte_timeout: '65s'
    between_bytes_timeout: '33s'
    max_connections: 10000
    probe: 'varnish'
profile::cache::varnish::frontend::runtime_params:
    - default_ttl=86400
    - http_max_hdr=128 # temp mitigation for T226840
    - idle_send_timeout=125
    - nuke_limit=1000 # T266373
profile::cache::varnish::frontend::fe_vcl_config:
    allowed_methods: '^(GET|HEAD|OPTIONS|PATCH|POST|PURGE|PUT|DELETE)$'
    # accept "not upload" purge traffic
    purge_host_regex: '^(?!(upload|maps)\.wikimedia\.org)'
    static_host: 'en.wikipedia.org'
    top_domain: 'org'
    shortener_domain: 'w.wiki'
    pass_random: true
    upload_domain: 'upload.wikimedia.org'
    upload_webp_hits_threshold: 80
    maps_domain: 'maps.wikimedia.org'
    thumb_domain: 'thumb.wikimedia.org'
    measure_domain_regex: '^measure-(eqiad|codfw|esams|ulsfo|eqsin|drmrs|magru)\.wikimedia\.org$'
    admission_policy: 'none'
    # RTT is ~0, but 100ms is to accomodate small local hiccups, similar to
    # the +100 added in $::profile::cache::base::core_probe_timeout_ms
    varnish_probe_ms: 100
    keep: '1d'
    # "Temporary" until we can find a better way to combine a smaller cutoff
    # with pass_random behavior in cache_text.  See also: T266040 + T266373
    large_objects_cutoff: 67108864
    # By setting 'public_clouds_shutdown' to true, all non-API requests from
    # IPs belonging to public clouds like EC2 get blocked with a 429 response
    # at the varnish-fe layer.
    public_clouds_shutdown: false
    # By setting 'attack_mode' to true, all requests are ratelimited per-IP to
    # levels that will allow a couple human users but block anything in excess.
    attack_mode: false
    differential_privacy: true
    edge_uniques_same_site: 'None'
profile::cache::varnish::frontend::separate_vcl: ['misc']
profile::cache::varnish::frontend::fe_extra_vcl: ['normalize_path', 'geoip', 'media']
profile::cache::varnish::frontend::transient_gb: 5

profile::cache::kafka::statsv::ssl_enabled: true
profile::cache::kafka::statsv::monitoring_enabled: true
# Purges
profile::cache::purge::kafka_topics:
  - eqiad.resource-purge
  - codfw.resource-purge
profile::cache::purge::kafka_tls: true
profile::cache::purge::backend_addr: 127.0.0.1:3128
profile::cache::purge::frontend_addr: "/run/varnish-privileged.socket"

# This should match an entry in the kafka_clusters hash (defined in common.yaml).
# We use the fully qualified kafka cluster name (with datacenter), because we want
# to route all statsv -> statsd traffic to the datacenter that hosts the master
# statsd instance.  If the active statsd instance changes to codfw (for an extended period of time)
# should probably change this to main-codfw.  If you don't things will probably be fine,
# but statsv will have to send messages over UDP cross-DC to the active statsd instance.
profile::cache::kafka::statsv::kafka_cluster_name: main-eqiad

profile::cache::kafka::webrequest::varnishkafka_enabled: false
prometheus::varnishkafka_exporter::config:
  stats_files:
    - '/var/cache/varnishkafka/statsv.stats.json'

  required_entries:
    - 'kafka'
    - 'varnishkafka'

  num_entries_to_get: 2

# Default weights for conftool
profile::cache::base::default_weights:
  cdn: 1
  ats-be: 100

profile::lvs::realserver::pools:
  gerrit-https:
    services:
      - cdn

  text-https:
    services:
      - haproxy
      - varnish-frontend
  text:
    services:
      - haproxy
profile::lvs::realserver::ipip::enabled: true
profile::base::enable_rp_filter: false
profile::contacts::role_contacts: ['Traffic']
profile::base::production::role_description: 'text HAProxy/Varnish/ATS cache server'

profile::cache::varnish::frontend::use_etcd_req_filters: true
profile::cache::varnish::frontend::use_ip_reputation: true
profile::cache::haproxy::enable_coredumps: true
profile::cache::haproxy::enable_mlock: true
profile::cache::haproxy::use_correlation_id: true

profile::cache::kafka::certificate::ssl_key_password: ~

profile::trafficserver::backend::http_settings:
  accept_no_activity_timeout: 180
  connect_attempts_timeout: 9
  keep_alive_no_activity_timeout_in: 120
  keep_alive_no_activity_timeout_out: 120
  post_connect_attempts_timeout: 11
  transaction_no_activity_timeout_in: 200
  transaction_no_activity_timeout_out: 180
  transaction_active_timeout_in: 900
  transaction_active_timeout_out: 205
  send_100_continue_response: 0
  max_post_size: 0
  keep_alive_enabled_out: 1
  keep_alive_post_out: 1
  server_session_sharing_match: both
  server_session_sharing_pool: thread
  allow_half_open: 1

profile::firewall::provider: none

profile::cache::haproxykafka::kafka:
  topic: webrequest_frontend_text

profile::cache::haproxy::available_certificates:
  unified:
    cert_paths:
        - /run/haproxy-tls/unified/live/ec-prime256v1.chained.crt.key
    server_names: &unified_cert_server_names
        - wikipedia.org
        - '*.wikipedia.org'
        - '*.m.wikipedia.org'
        - wikimedia.org
        - '*.wikimedia.org'
        - '*.m.wikimedia.org'
        - '*.planet.wikimedia.org'
        - mediawiki.org
        - '*.mediawiki.org'
        - '*.m.mediawiki.org'
        - wikibooks.org
        - '*.wikibooks.org'
        - '*.m.wikibooks.org'
        - wikidata.org
        - '*.wikidata.org'
        - '*.m.wikidata.org'
        - wikinews.org
        - '*.wikinews.org'
        - '*.m.wikinews.org'
        - wikiquote.org
        - '*.wikiquote.org'
        - '*.m.wikiquote.org'
        - wikisource.org
        - '*.wikisource.org'
        - '*.m.wikisource.org'
        - wikiversity.org
        - '*.wikiversity.org'
        - '*.m.wikiversity.org'
        - wikivoyage.org
        - '*.wikivoyage.org'
        - '*.m.wikivoyage.org'
        - wiktionary.org
        - '*.wiktionary.org'
        - '*.m.wiktionary.org'
        - wikimediafoundation.org
        - '*.wikimediafoundation.org'
        - wmfusercontent.org
        - '*.wmfusercontent.org'
        - w.wiki
    warning_threshold: 21
    critical_threshold: 15
  unified-goog:
    cert_paths:
        - /run/haproxy-tls/unified-goog/live/ec-prime256v1.chained.crt.key
    server_names: *unified_cert_server_names
    warning_threshold: 21
    critical_threshold: 15
  wikipedia25:
    cert_paths:
      - /run/haproxy-tls/wikipedia25/live/ec-prime256v1.chained.crt.key
    server_names:
      - wikipedia25.org
      - www.wikipedia25.org
    warning_threshold: 21
    critical_threshold: 15
  wikiworkshop:
    cert_paths:
      - /run/haproxy-tls/wikiworkshop/live/ec-prime256v1.chained.crt.key
    server_names:
      - wikiworkshop.org
      - www.wikiworkshop.org
    warning_threshold: 21
    critical_threshold: 15

profile::cache::haproxy::use_etcd_req_filters: true
profile::cache::haproxy::use_etcd_known_client_ident: true
profile::cache::haproxy::use_etcd_moat_scope: true
profile::cache::haproxy::allowed_methods:
  - DELETE
  - GET
  - HEAD
  - OPTIONS
  - PATCH
  - POST
  - PUT
profile::cache::haproxy::use_datacenter_provenance: true
profile::cache::haproxy::use_cidergrinder: true
profile::cache::haproxy::use_webrequest_ipreputation: true
profile::cache::varnish::frontend::do_edge_uniques: true
profile::cache::varnish::frontend::use_private_repo: true

profile::benthos::use_geoip: false
profile::benthos::instances:
  haproxy_reqctl:
    # Prometheus exporter port
    port: 4153
    env_variables:
      enable_debug: true
      socket_address: "127.0.0.1:1221"
      msg_topic: haproxy_reqctl
      root_cas_file: /etc/ssl/certs/wmf-ca-certificates.crt
      pipeline_threads: 2
      benthos_fqdn: '%{facts.networking.fqdn}'
      buffer_memory_limit_bytes: 134217728
      eventgate_url: https://eventgate-analytics.discovery.wmnet:4592/v1/events?hasty=true
    kafka:
      cluster: main
      site: eqiad
      # Topics listed here are for kafka message ingestion
      # Not needed in this case
      topics:
        - "none"
profile::cache::varnish::frontend::rate_limiting_flags:
  auth: true
  known: true
  bot: true
  unid: true
  browser: true
profile::cache::base::extra_trust:
  - 185.15.56.0/24
  - 185.15.57.0/24

# Experimental for T327300
profile::server_depool:
  policy: local_command
  command: depool

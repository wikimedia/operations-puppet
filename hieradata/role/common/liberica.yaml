cluster: liberica
profile::contacts::role_contacts: ['Traffic']
profile::base::production::role_description: 'Liberica based loadbalancer'
profile::base::enable_rp_filter: false
profile::ssh::server::listen_addresses:
  - "%{facts.networking.ip}"
prometheus::node_exporter::web_listen_address: "%{facts.networking.ip}:9100"
prometheus::node_exporter::collectors_extra:
  - ipvs
  - meminfo_numa
profile::firewall::provider: none

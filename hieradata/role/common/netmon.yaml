profile::librenms::sitename: 'librenms.wikimedia.org'
profile::librenms::install_dir: '/srv/deployment/librenms/librenms'
profile::idp::client::httpd::sites:
  "%{alias('profile::librenms::sitename')}":
    document_root: "%{lookup('profile::librenms::install_dir')}/html"
    vhost_content: 'profile/idp/client/httpd-librenms.erb'
profile::contacts::role_contacts:
  - 'Infrastructure Foundations'
  - 'Observability'
profile::base::production::role_description: 'Network monitoring and management'
profile::firewall::provider: nftables

# Experimental for T327300
profile::server_depool:
  policy: skip

profile::bgpalerter::reports:
- file: reportPullAPI
  channels:
    - hijack
    - newprefix
    - visibility
    - path
    - misconfiguration
    - rpki
  params:
    maxAlertsAmount: 25
- file: reportEmail
  channels:
    - hijack
    - newprefix
    - visibility
    - path
    - misconfiguration
    - rpki
  params:
    showPaths: 5 # Amount of AS_PATHs to report in the alert
    senderEmail: "%{lookup('profile::bgpalerter::user')}@%{facts.networking.fqdn}"
    # BGPalerter uses nodemailer.
    # The smtp section can be configured with all the parameters available at https://nodemailer.com/smtp/
    # the following are just the most useful one
    smtp:
      host: localhost
      port: 25
      secure: false # If true the connection will use TLS when connecting to server. If false it will be still possible doing connection upgrade via STARTTLS
    notifiedEmails:
      default:
        - no-reply@wikimedia.org  # blackhole to mute software-update notifications
      noc:
        - noc@wikimedia.org
profile::bgpalerter::upstreams: []
profile::bgpalerter::downstreams:
  - 11820
  - 12654 # https://github.com/nttgin/BGPalerter/issues/732

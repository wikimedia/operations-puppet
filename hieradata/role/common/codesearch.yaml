profile::base::production::role_description: 'Wikimedia Codesearch'
# Like https://codesearch.wmcloud.org/ but in production
profile::contacts::role_contacts: ['Collaboration Services']
profile::monitoring::notifications_enabled: false

profile::admin::groups:
  - codesearch-roots

profile::codesearch::base_dir: '/srv'
# gunicorn3 is a virtual package, puppet would "install" it on every run
profile::codesearch::gunicorn_package: 'gunicorn'
profile::codesearch::ports:
    search: 6080
    extensions: 6081
    skins: 6082
    things: 6083
    core: 6084
    ooui: 6085
    operations: 6086
    armchairgm: 6087
    milkshake: 6088
    bundled: 6089
    deployed: 6090
    pywikibot: 6091
    services: 6092
    libraries: 6093
    analytics: 6094
    puppet: 6095
    shouthow: 6096
    wmcs: 6097
    devtools: 6098
    apps: 6099
profile::codesearch::lock_file_min_age: 60

# TLS termination for the CDN: codesearch-backend.wikimedia.org goes to
# the hound proxy, everything else to the frontend container
profile::codesearch::tls_proxy: true
profile::tlsproxy::envoy::global_cert_name: "codesearch.discovery.wmnet"
# hound_proxy (gunicorn) only listens on IPv4 (0.0.0.0:3002),
# the fqdn default makes envoy connect via IPv6
profile::tlsproxy::envoy::upstream_addr: 127.0.0.1
profile::tlsproxy::envoy::cfssl_options:
  hosts:
    - codesearch.wikimedia.org
    - codesearch-backend.wikimedia.org
profile::tlsproxy::envoy::services:
  - server_names: ['codesearch-backend.wikimedia.org']
    port: 3002
  - server_names: ['*']
    port: 3003
profile::tlsproxy::envoy::firewall_src_sets:
  - CACHES

# avoid confd spamming syslog (T417458)
profile::confd::instances:
  main:
    interval: 300

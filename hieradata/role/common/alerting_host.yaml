profile::base::overlayfs: true

profile::corto::active_host: 'alert1002.wikimedia.org'
profile::corto::irc_config::nick: 'cortobot'
profile::corto::irc_config::server: 'irc.libera.chat'
profile::corto::irc_config::port: 6697
profile::corto::irc_config::use_tls: true
# Channel specification moved to /srv/git/private
# profile::corto::irc_config::channels:
#   - '#corto-test'
#   - '#wikimedia-sre-onfire'

profile::corto::phabricator_url: 'https://phabricator.wikimedia.org'
profile::corto::phabricator_project: 'Wikimedia-Incident'
profile::corto::phabricator_user: corto
profile::corto::phabricator_policy::view: '#wmf-nda'
profile::corto::phabricator_policy::edit: '#wmf-nda'

# T367118 Moved confd definition out of scap::dsh
profile::confd::instances:
  main:
    interval: 300

profile::puppet::agent::interval: 5

profile::metamonitoring::ensure: 'present'
profile::metamonitoring::user: 'prometamon'
profile::metamonitoring::status_dir: '/var/lib/o11y-metamonitoring'

profile::contacts::role_contacts:
  - 'Observability'
profile::base::production::role_description: 'Titan hosts Thanos components'

cluster: titan
profile::resolving::domain_search:
  - wikimedia.org
  - eqiad.wmnet
  - codfw.wmnet
  - esams.wmnet
  - ulsfo.wmnet
  - eqsin.wmnet
  - drmrs.wmnet
  - magru.wmnet
profile::lvs::realserver::pools:
  thanos-query:
    services:
      - thanos-query
      - thanos-query-frontend
      - apache2
  thanos-web:
    services:
      - thanos-query
      - thanos-query-frontend
      - apache2

profile::envoy::ensure: present
profile::tlsproxy::envoy::sni_support: 'yes'
profile::tlsproxy::envoy::ssl_provider: cfssl
profile::tlsproxy::envoy::cfssl_options:
  hosts:
    - 'thanos-query'
    - 'thanos-query.svc.%{::site}.wmnet'
    - 'thanos-query.discovery.wmnet'
    - 'thanos.%{lookup("public_domain")}'
    - 'pyrra'
    - 'pyrra.wikimedia.org'
    - 'pyrra.svc.%{::site}.wmnet'
    - 'slo'
    - 'slo.wikimedia.org'
profile::tlsproxy::envoy::global_cert_name: 'thanos-query.discovery.wmnet'
profile::tlsproxy::envoy::use_remote_address: true
profile::tlsproxy::envoy::listen_ipv6: true
# force to talk on local internal v4 address
profile::tlsproxy::envoy::upstream_addr: "%{facts.ipaddress}"
# Let idle_timeout kick in instead for long-running/streaming requests. T337251
profile::tlsproxy::envoy::upstream_response_timeout: 0.0

# Hit object storage only for data older than this value. This represents the thanos store max_time.
# It also defines the length of the local retention window for Thanos Rule,
#  which must be greater than thanos store max_time to avoid gaps.
#  (https://phabricator.wikimedia.org/T352756).
# Arithmetic adjustments and type convertions are applied in the respective classes.
profile::thanos::object_store_cutoff_days: 15

# Retention custom settings -- see also T311690 and T351927
profile::thanos::retention::raw: '60w'
profile::thanos::retention::5m: '60w'
profile::thanos::retention::1h: '280w'

profile::thanos::compactor::concurrency: 2
profile::thanos::compactor::block_meta_fetch_concurrency: 64

profile::thanos::oidc_sso_enabled: true

profile::lvs::realserver::ipip::enabled: true
profile::base::enable_rp_filter: false

profile::memcached::size: 16384 # multiple of 1024, megabytes
profile::memcached::firewall_src_sets: ~
profile::memcached::firewall_srange: "%{alias('profile::thanos::frontends')}"
profile::memcached::extended_options:
  - 'modern'

profile::thanos::query_frontend::memcached_hosts:
  - '127.0.0.1'
profile::thanos::store::memcached_hosts: "%{alias('profile::thanos::query_frontend::memcached_hosts')}"

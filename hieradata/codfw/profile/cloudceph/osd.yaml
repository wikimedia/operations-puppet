# OSD nodes have their own storage vlan; these hosts
#  will have arbitrary cluster addresses in 192.168.4.0/22
#
# The 'public' address here does not refer to the WMF public vlan,
#  but rather the ceph 'public' address which is used by clients
#  (in the near-term, hypervisors) to access storage.  Do not be
#  alarmed that the public addresses are on private IPs.
#
# Please be aware the last 3 IPs on the first /24 in the storage
# subnet are reserved for network equipment (top-of-rack switches)
# so please do not assign to end hosts:
#
# 192.168.4.252
# 192.168.4.253
# 192.168.4.254
#
profile::cloudceph::osd::hosts:
  "cloudcephosd2004-dev.codfw.wmnet":
    public:
      addr: "10.192.20.6"
      iface: "ens1f0np0"
    cluster:
      addr: "192.168.4.4"
      prefix: 24
      iface: "ens1f1np1"
      single_iface: true
  "cloudcephosd2005-dev.codfw.wmnet":
    public:
      addr: "10.192.20.9"
      iface: "eno12399np0"
    cluster:
      addr: "192.168.4.5"
      prefix: 24
      iface: "eno12409np1"
      single_iface: true
  "cloudcephosd2006-dev.codfw.wmnet":
    public:
      addr: "10.192.20.13"
      iface: "eno12399np0"
    cluster:
      addr: "192.168.4.6"
      prefix: 24
      iface: "eno12409np1"
      single_iface: true
  "cloudcephosd2007-dev.codfw.wmnet":
    public:
      addr: "10.192.20.14"
      iface: "eno12399np0"
    cluster:
      addr: "192.168.4.7"
      prefix: 24
      iface: "eno12409np1"
      single_iface: true

profile::cloudceph::osd::cluster_networks:
  - "192.168.4.0/24"
profile::cloudceph::osd::with_location_hook: true
profile::cloudceph::osd::enable_qos: true

<VirtualHost *:80>
    ServerName beta.wmcloud.org
    ServerAlias beta.wmflabs.org

    Redirect / https://meta.wikimedia.beta.wmcloud.org/
</VirtualHost>

# T289318: Legacy wmflabs.org aliases
<VirtualHost *:80>
    ServerName legacy-wmflabs
    # Destinations handled by ATS (upload_domain, cache-upload, Hiera)
    ServerAlias config-master.wikimedia.beta.wmflabs.org
    ServerAlias upload.wikimedia.beta.wmflabs.org
    ServerAlias performance.wikimedia.beta.wmflabs.org
    # Destinations handled by mediawiki::sites (wikis and auth domain),
    # wwwportals.conf.erb, and www.wikimedia.org.conf.erb
    ServerAlias *.wikibooks.beta.wmflabs.org
    ServerAlias *.wikimedia.beta.wmflabs.org
    ServerAlias *.wikinews.beta.wmflabs.org
    ServerAlias *.wikipedia.beta.wmflabs.org
    ServerAlias *.wikiquote.beta.wmflabs.org
    ServerAlias *.wikisource.beta.wmflabs.org
    ServerAlias *.wikiversity.beta.wmflabs.org
    ServerAlias *.wikivoyage.beta.wmflabs.org
    ServerAlias *.wiktionary.beta.wmflabs.org
    ServerAlias auth.wikimedia.beta.wmflabs.org
    ServerAlias www.wikibooks.beta.wmflabs.org
    ServerAlias www.wikimedia.beta.wmflabs.org
    ServerAlias www.wikinews.beta.wmflabs.org
    ServerAlias www.wikipedia.beta.wmflabs.org
    ServerAlias www.wikiquote.beta.wmflabs.org
    ServerAlias www.wikiversity.beta.wmflabs.org
    ServerAlias www.wikivoyage.beta.wmflabs.org
    ServerAlias www.wiktionary.beta.wmflabs.org

    UseCanonicalName Off

    # Preserve subdomain
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^(.*)\.beta\.wmflabs\.org$ [NC]
    RewriteRule ^(.*)$ https://%1.beta.wmcloud.org$1 [R=308,L]
</VirtualHost>
# T289318: Legacy alias for pre-wmcloud Beta Wikidata, which was without "www"
<VirtualHost *:80>
    ServerName wikidata.beta.wmflabs.org
    ServerAlias m.wikidata.beta.wmflabs.org

    Redirect / https://www.wikidata.beta.wmcloud.org/
</VirtualHost>

# T396012: This is unused in practice because the edge handles this
# in rb-mw-mangling-beta.lua, same as in prod.
# This fallback is unique to Beta and kept here, because ATS plugins are
# easy to accidentally disable when syncing Hiera config between prod and beta.
<VirtualHost *:80>
    ServerName w.beta.wmcloud.org

    <Location ~ "^/.+">
        Redirect / "https://meta.wikimedia.beta.wmcloud.org/wiki/Special:UrlRedirector/"
    </Location>

    <Location ~ "^/$">
        Redirect / "https://meta.wikimedia.beta.wmcloud.org/wiki/Special:UrlShortener"
    </Location>
</VirtualHost>

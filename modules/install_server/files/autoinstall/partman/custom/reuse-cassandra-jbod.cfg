# SPDX-License-Identifier: Apache-2.0
# this workarounds LP #1012629 / Debian #666974
# it makes grub-installer to jump to step 2, where it uses bootdev
d-i	grub-installer/only_debian	boolean	false
d-i	grub-installer/bootdev	string	/dev/sda /dev/sdb

d-i	partman/reuse_partitions_recipe	string \
		/dev/sda|1 biosboot ignore none|2 fat32 ignore none|3 raid ignore none|4 ext4 keep /srv/sda4, \
		/dev/sdb|1 biosboot ignore none|2 fat32 ignore none|3 raid ignore none|4 ext4 keep /srv/sdb4, \
		/dev/mapper/*-swap|1 swap ignore none, \
		/dev/mapper/*-root|1 ext4 format /, \
		/dev/mapper/*-instance|1 ext4 keep /srv/cassandra

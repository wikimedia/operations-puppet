# Same as reuse-dbprov.cfg, but for hosts where the OS disk is sdb and the
# dumps disk is sda (e.g. dbprov2007 on trixie, as its OS virtual disk has a
# higher SCSI target than the dumps one)
d-i	partman/reuse_partitions_recipe	string \
		/dev/sdb|1 ext4 format /|2 linux-swap ignore none|3 unknown ignore none, \
		/dev/mapper/*|1 xfs keep /srv, \
		/dev/sda|1 xfs keep /srv/backups/dumps/ongoing

# common.cfg defaults to /dev/sda, which is the dumps disk here
d-i	grub-installer/bootdev	string	/dev/sdb

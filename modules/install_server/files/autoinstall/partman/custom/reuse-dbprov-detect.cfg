# The reuse recipe for the dbprov hosts is generated at install time by
# reuse-parts-dbprov.sh, because the controller does not present the OS and
# dumps volumes in a stable order, so their device names cannot be hardcoded.
# This overrides the partman/early_command from reuse-parts(-test).cfg, so
# it must also download reuse-parts.sh itself.
d-i	partman/early_command	string \
		set -eux; \
		wget -nv http://apt.wikimedia.org/autoinstall/scripts/reuse-parts.sh -O /lib/partman/display.d/70reuse-parts; \
		chmod +x /lib/partman/display.d/70reuse-parts; \
		wget -nv http://apt.wikimedia.org/autoinstall/scripts/reuse-parts-dbprov.sh -O /tmp/reuse-parts-dbprov.sh; \
		sh /tmp/reuse-parts-dbprov.sh

# Same as reuse-dbprov.cfg, but using the 'swap' action, as trixie's d-i
# no longer reuses existing swap partitions on its own (T428078)
d-i	partman/reuse_partitions_recipe	string \
		/dev/sda|1 ext4 format /|2 linux-swap swap none|3 unknown ignore none, \
		/dev/mapper/*|1 xfs keep /srv, \
		/dev/sdb|1 xfs keep /srv/backups/dumps/ongoing

# SPDX-License-Identifier: Apache-2.0
# This file overrides only the d-i settings needed for
# Kubernetes nodes using OverlayFS, on hosts that also carry local
# storage for TopoLVM.
#
# It is a copy of the kubernetes-node-containerd.cfg file, adapted for
# hosts where /dev/sda is a hardware RAID1 device that is used for the
# operating system. Any further RAID device (/dev/sdb, holding the vg1
# volume group used by TopoLVM) is deliberately left untouched, so that
# its logical volumes survive a reimage. See T412925.
#
# The partman priorities are set so that:
#   On the vg0 volume group on /dev/sda:
#     /                   gets at least 20% of the available space, up to 30 GB maximum
#     /var/lib/kubelet    gets at least 30% of the available space, up to 30 GB maximum
#     /var/lib/containerd gets the remaining 50% of the available space, with no maximum
#
# See T365283 for more information.
#
# The intended usage is to include this file last in netboot.cfg:
#
# partman/standard.cfg partman/custom/kubernetes-node-containerd-local-storage.cfg
#
# /dev/sda is an hardware raid device, thus switch partman's method to 'lvm'
d-i	partman-auto/method	string	lvm

# this workarounds LP #1012629 / Debian #666974
# it makes grub-installer to jump to step 2, where it uses bootdev
d-i	grub-installer/only_debian	boolean	false

d-i	partman-auto/disk	string	/dev/sda
d-i	grub-installer/bootdev	string	/dev/sda

# There is no swap on purpose, since Kubernetes does not want it.
d-i	partman-basicfilesystems/no_swap boolean false

# Partman auto recipe
d-i	partman-auto/expert_recipe	string					\
		lvm	 :: 							\
			300 300 300 grub					\
				$primary{ }					\
				method{ biosgrub }				\
			.							\
			100000 300000 -1 ext4					\
				$defaultignore{ }				\
				$primary{ }					\
				method{ lvm }					\
				device{ /dev/sda }				\
				vg_name{ vg0 }					\
			.							\
			1500 1520 30000 ext4					\
				method{ format }				\
				format{ }					\
				use_filesystem{ }				\
				filesystem{ ext4 }				\
				lv_name{ root }					\
				$defaultignore{ }				\
				$lvmok{ }					\
				mountpoint{ / }					\
				in_vg{ vg0 }					\
			.							\
			1500 1530 30000 ext4					\
				method{ format }				\
				format{ }					\
				use_filesystem{ }				\
				filesystem{ ext4 }				\
				lv_name{ kubelet }				\
				$defaultignore{ }				\
				$lvmok{ }					\
				mountpoint{ /var/lib/kubelet }			\
				in_vg{ vg0 }					\
			.							\
			1500 1550 -1 ext4					\
				method{ format }				\
				format{ }					\
				use_filesystem{ }				\
				filesystem{ ext4 }				\
				lv_name{ containerd }				\
				$defaultignore{ }				\
				$lvmok{ }					\
				in_vg{ vg0 }					\
				mountpoint{ /var/lib/containerd }		\
			.

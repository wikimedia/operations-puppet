# The reuse recipe for the H750-based stat hosts is generated at install
# time by reuse-parts-h750-stat.sh, because the controller does not present
# the OS and /srv volumes in a stable order across boots.
# This overrides the partman/early_command from reuse-parts(-test).cfg, so
# it must also download reuse-parts.sh itself.
d-i	partman/early_command	string \
		set -eux; \
		wget -nv http://apt.wikimedia.org/autoinstall/scripts/reuse-parts.sh -O /lib/partman/display.d/70reuse-parts; \
		chmod +x /lib/partman/display.d/70reuse-parts; \
		wget -nv http://apt.wikimedia.org/autoinstall/scripts/reuse-parts-h750-stat.sh -O /tmp/reuse-parts-h750-stat.sh; \
		sh /tmp/reuse-parts-h750-stat.sh

# These hosts have no swap volume, so don't warn about its absence.
d-i	partman-basicfilesystems/no_swap	boolean	false

# SPDX-License-Identifier: Apache-2.0
# Reuse recipe for the H750-based stat hosts, matching the layout created by
# partman/H750hwraid-2dev.cfg: a hardware RAID1 OS volume (sda) and a
# hardware RAID10 /srv volume (sdb), with no swap LV.
# If the controller ever presents the volumes in the opposite order, the
# recipe aborts safely with a partition count mismatch before any changes.

# Install grub on the OS volume.
d-i	grub-installer/bootdev	string	/dev/sda

d-i	partman/reuse_partitions_recipe	string \
	/dev/sda|1 ext4 format /boot|2 lvmpv ignore none, \
	/dev/sdb|1 lvmpv ignore none, \
	/dev/mapper/vg0-root|1 ext4 format /, \
	/dev/mapper/vg1-srv|1 ext4 keep /srv

# These hosts have no swap volume, so don't warn about its absence.
d-i	partman-basicfilesystems/no_swap	boolean	false

# SPDX-License-Identifier: Apache-2.0
# this workarounds LP #1012629 / Debian #666974
# it makes grub-installer to jump to step 2, where it uses bootdev
d-i	grub-installer/only_debian	boolean	false
# Install grub on all RAID member disks, not just /dev/sda
# (mirrors the behaviour of raid10-6dev.cfg used during initial imaging)
d-i	grub-installer/bootdev		string	/dev/sda /dev/sdb /dev/sdc /dev/sdd /dev/sde /dev/sdf

d-i	partman/reuse_partitions_recipe	string \
	/dev/sda|1 mdraid ignore none|2 mdraid ignore none, \
	/dev/sdb|1 mdraid ignore none|2 mdraid ignore none, \
	/dev/sdc|1 mdraid ignore none|2 mdraid ignore none, \
	/dev/sdd|1 mdraid ignore none|2 mdraid ignore none, \
	/dev/sde|1 mdraid ignore none|2 mdraid ignore none, \
	/dev/sdf|1 mdraid ignore none|2 mdraid ignore none, \
	/dev/md0|1 lvmpv ignore none, \
	/dev/mapper/vg*-root|1 ext4 format /, \
	/dev/mapper/vg*-srv|1 ext4 keep /srv, \
	/dev/mapper/*-swap|1 linux-swap swap none

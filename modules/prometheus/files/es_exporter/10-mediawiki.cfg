[query_log_mediawiki]
QueryIntervalSecs = 60
QueryIndices = <logstash*{now/d}>
QueryJson = {
    "size": 0,
    "track_total_hits": true,
    "query": {
      "bool": {
        "must": [
          {
            "term": {
              "type": "mediawiki"
            }
          }
        ],
        "filter": [
          { "range": { "@timestamp": { "gte": "now-1m", "lte": "now" } } }
        ]
      }
    },
    "aggs": {
      "servergroup": {
        "terms": {
          "size": 200,
          "field": "servergroup.keyword"
        },
        "aggs": {
          "level": {
            "terms": {
              "size": 200,
              "field": "level"
            },
          "aggs": {
            "channel": {
              "terms": {
                "size": 200,
                "field": "channel.keyword"
                }
              }
            }
          }
        }
      }
    }
  }


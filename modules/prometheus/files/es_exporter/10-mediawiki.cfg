[query_log_mediawiki_logins]
QueryIntervalSecs = 60
QueryIndices = <logstash*{now/d}>
QueryJson = {
    "size": 0,
    "track_total_hits": true,
    "query": {
      "bool": {
        "minimum_should_match": 1,
        "should": [
          {
            "match_phrase": {
              "channel.keyword": "goodpass"
            }
          },
          {
            "match_phrase": {
              "channel.keyword": "goodpass-priv"
            }
          },
          {
            "match_phrase": {
              "channel.keyword": "badpass"
            }
          },
          {
            "match_phrase": {
              "channel.keyword": "badpass-priv"
            }
          }
        ],
        "must_not": [
          {
            "match_phrase": {
            "normalized_message.keyword": "Password change in prefs for {priv} {name}: {status} - {clientip} - {xff} - {ua} - {geocookie}"
            }
          }
        ],
        "filter": [
          { "range": { "@timestamp": { "gte": "now-1m", "lte": "now" } } }
        ]
      }
    },
    "aggs": {
      "wiki": {
        "terms": {
          "size": 1000,
          "field": "wiki.keyword"
        },
        "aggs": {
          "privileged": {
            "terms": {
               "size": 2,
               "field": "user_is_privileged.keyword"
            },
          "aggs": {
            "successful": {
              "terms": {
                "size": 2,
                "field": "successful.keyword"
              }
            }
          }
         }
        }
      }
    }
  }

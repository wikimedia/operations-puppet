# Filters for parsing statsd-exporter logs from k8s.
filter {
  if [kubernetes][container_name] =~ /(statsd|metrics)-exporter/ {
    # store original copy unindexed
    ruby {
      code => "event.set('[event][original]', event.to_json)"
      id => "filter/ruby/kubernetes_statsd_exporter/write_event_original"
    }

    mutate {
      rename => { "log" => "_log" }
      add_field => {
        "[ecs][version]" => "1.11.0"
        "[service][type]" => "statsd-exporter"
      }
      id => "filter/mutate/kubernetes_statsd_exporter/rename"
    }

    logfmt {
      source => "_log"
      target => "_logfmt"
      id => "filter/logfmt/kubernetes_statsd_exporter/parse"
    }

    mutate {
      rename => {
        "[_logfmt][level]" => "[level]"
        "[_logfmt][time]" => "[timestamp]"
        "[_logfmt][msg]" => "[message]"
        "[_logfmt][source]" => "[log][file][path]"
      }
      id => "filter/mutate/kubernetes_statsd_exporter/ecs_normalization"
    }
  }
}

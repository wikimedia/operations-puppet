# Filters for parsing k8s logs forwarded from rsyslog input-file-{docker,kubernetes}.
filter {
  if [program] == "input-file-kubernetes" or [program] == "input-file-docker" {
    # containerd logs are formatted `<timestamp> <stream> <partial or full flag [FP]> (<json object>|<plain string entry>)`
    # https://github.com/kubernetes/design-proposals-archive/blob/main/node/kubelet-cri-logging.md
    # https://phabricator.wikimedia.org/T377132
    if [msg] =~ /^([0-9-T:\.Z]+) (stdout|stderr) [FP] .*$/ {
      # containerd logs
      dissect {
        mapping => {
          "msg" => "%{time} %{stream} %{} %{log}"
        }
        remove_field => [ "msg" ]
        add_tag => [ "k8s_containerd_msg_field_parsed" ]
        id => "filter/dissect/kubernetes_docker/dissect_msg_field"
      }
    }

    # Parse nested json from applications
    # Use multiline modifier to make sure embedded newlines are matched too
    if [log] =~ /^(?m){.*}$/ {

      mutate {
        rename => {
          "log" => "_log"
        }
        gsub => [
          # Remove Python escape sequences
          "_log", "\\x([a-f0-9]{2})", "<\1>"
        ]
        id => "filter/mutate/15/kubernetes_docker/move_and_clean_log_field"
      }

      json {
        source => "_log"
        remove_field => [ "_log" ]
        add_tag => [ "k8s_docker_log_field_parsed" ]
        id => "filter/json/15/kubernetes_docker/parse"
      }

    }

    # T390215 mobileapps is exceeding index field limits by logging query parameters as field keys
    if [request][query] {
      mutate {
        remove_field => [ '[request][query]' ]
        id => 'filter/mutate/kubernetes_docker/remove_request_query_field'
      }
    }
    # T390215 mobileapps out request field is exceeding field limit
    # T390215 mobileapps detail field data type is in conflict with itself and eventgate-analytics-external
    if [kubernetes][namespace_name] == "mobileapps" {
      mutate {
        remove_field => [ "detail", "out_request", "outRequest" ]
        id => "filter/mutate/kubernetes_docker/mobileapps_field_removal"
      }
      if [msg] =~ /(Incoming|Outgoing) request/ {
        mutate {
          replace => { "[@metadata][partition]" => "webrequest" }
          id => 'filter/kubernetes_docker/mutate/route_mobileapps_webrequests'
        }
      }
    }
    # T390215 mw-script: remove large fields
    if [kubernetes][labels][deployment] == "mw-script" {
      mutate {
        remove_field => [ "auxiliary_text", "source_text", "category", "template", "text", "heading", "outgoing_link" ]
        id => "filter/mutate/kubernetes_docker/remove_mw_script_large_fields"
      }
    }

    # Indexing Failures 2025-04
    # Generally from mediawiki-main-httpd-exporter and postgres
    # Conflicts with wikifeeds, kartotherian, eventgate, eventstreams, push-notifications, mobileapps, etc
    if [err] {
      ruby {
        code => "
          if event.get('err').is_a? String
            msg = event.get('err')
            event.remove('err')
            event.set('[err][message]', msg)
          end"
        id => "filter/ruby/kubernetes_docker/cast_err_field_to_hash"
      }
    }

    # Same as above but for 'error' (e.g. php-fpm-exporter or knative-serving in T288549)
    if [error] {
      ruby {
        code => "
          if event.get('error').is_a? String
            msg = event.get('error')
            event.remove('error')
            event.set('[error][message]', msg)
          end"
        id => "filter/ruby/kubernetes_docker/cast_error_field_to_hash"
      }
    }

    # TODO: this should be handled at the rsyslog layer
    if ![host][name] and [ecs] {
      mutate {
        rename => {
          "host" => "[host][name]"
        }
        id => "filter/kubernetes_docker/mutate_ecs"
      }
    }

    # not enough ecs adoption as of 2022-08-04 to justify a separate partition
    if ![ecs] {

      # if not ECS and "log" shows up in the json parsed result, force log to be a string
      # incident: T377422
      # cause: T365643
      if [log] {
        mutate {
          replace => {
            "log" => "%{log}"
          }
          id => "filter/kubernetes_docker/mutate/stringify_log_field"
        }
      }

      # T390215
      if [host] =~ /^ml-.*/ {
        mutate {
          replace => { "[@metadata][partition]" => "ml" }
          id => 'filter/kubernetes_docker/mutate/ml_partition'
        }
      }
      # T368180
      if [kubernetes][container_name] =~ /thumbor-808./ {
        drop { id => "filter/drop/kubernetes_docker/thumbor_unstructured_logs" }
      }
      if [name] == "KafkaSSE" {
        # T390140 - mutate assignments field to a string
        mutate {
          replace => { "assignments" => "%{assignments}" }
          id => "filter/kubernetes_docker/mutate/T390140_stringify_assignments_field"
        }
      }
      if [kubernetes][container_name] =~ /.+(proxy|httpd)$/ {
        # route to webrequest partition
        mutate {
          replace => { "[@metadata][partition]" => "webrequest" }
          id => "filter/kubernetes_docker/mutate/webrequest_partition"
        }
        # https://phabricator.wikimedia.org/T390215#11784911
        # ~500/sec
        if [requested_server_name] == "page-analytics.discovery.wmnet" {
          drop {
            percentage => 99
            id => "filter/kubernetes_docker/drop/page_analytics_webrequest"
          }
        }
        # ~3800/sec
        if [requested_server_name] =~ "^ratelimit-media.*" {
          drop {
            percentage => 99
            id => "filter/kubernetes_docker/drop/ratelimit_media_webrequest"
          }
        }
        # exclude istio-ingressgateway sampling per request:
        #   https://gerrit.wikimedia.org/r/c/operations/puppet/+/941434
        #   https://gerrit.wikimedia.org/r/c/operations/puppet/+/1289423/comments/db9b8e19_771ccff4
        if [kubernetes][labels][app] != "istio-ingressgateway"  {
          # T313099
          drop {
            percentage => 99
            id => "filter/kubernetes_docker/drop/webrequest"
          }
        }
      } else {
        if [@metadata][partition] == "default" {
          # route to k8s partition
          mutate {
            replace => { "[@metadata][partition]" => "k8s" }
            id => "filter/kubernetes_docker/mutate/k8s_partition"
          }
        }
      }
    }
  }
}

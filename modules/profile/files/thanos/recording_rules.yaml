groups:
  - name: service_slis
    rules:
      - record: cluster_site:sli_etcd_http_error_ratio:increase90d
        expr: 100 * sum by (cluster, site) (increase(etcd_http_failed_total{code=~"5.."}[90d])) /
                    sum by (cluster, site) (increase(etcd_http_received_total[90d]))

      - record: cluster_site:sli_etcd_http_error_ratio:increase91d
        expr: 100 * sum by (cluster, site) (increase(etcd_http_failed_total{code=~"5.."}[91d])) /
                    sum by (cluster, site) (increase(etcd_http_received_total[91d]))

      - record: cluster_site:sli_etcd_http_error_ratio:increase92d
        expr: 100 * sum by (cluster, site) (increase(etcd_http_failed_total{code=~"5.."}[92d])) /
                    sum by (cluster, site) (increase(etcd_http_received_total[92d]))

  - name: service_slo_targets
    rules:
      - record: service:error_slo:fraction
        labels:
          service: "etcd"
        expr: 0.001

      # Deprecated: Use service:error_slo:fraction instead. Retained for continuity.
      - record: service:error_slo:percent
        labels:
          service: "etcd"
        expr: 0.1

  - name: traffic
    rules:
      - record: site_cluster:haproxy_requests:avail2m
        expr: sum by(site, cluster) (cluster_code:haproxy_frontend_http_responses_total:rate2m{code="5xx"})
          / sum by(site, cluster) (cluster_code:haproxy_frontend_http_responses_total:rate2m{code=~"[12345]xx"})

      - record: global_job:haproxy_requests:avail2m
        expr: sum by(cluster) (cluster_code:haproxy_frontend_http_responses_total:rate2m{code="5xx"})
          / sum by(cluster) (cluster_code:haproxy_frontend_http_responses_total:rate2m{code=~"[12345]xx"})

      - record: global_job:varnish_requests:avail2m
        expr: sum by(job) (job_method_status:varnish_requests:rate2m{status=~"5.."})
          / sum by(job) (job_method_status:varnish_requests:rate2m{status=~"[12345].."})

  # Aggregated exporter metrics.
  #
  # The "<service>_up" metrics are exported by Prometheus sidecar exporter (e.g. mysql-exporter,
  # when the service itself doesn't support Prometheus natively).
  #
  # Such metrics are used to catch conditions such as the following:
  # * the exporter itself is up and able to export metrics to Prometheus (therefore the "up" metric is 1)
  # * the exporter can't talk to the underlying service (e.g. mysql is down, thus "mysql_up" is 0)
  #
  # The label_replace function is used to attach a new "exporter" label to the aggregated metric.
  #
  # The following query will list all the "up style" metrics:
  #   count by (__name__) ({__name__=~".*_up$"})

  - name: exporters
    rules:
      - record: exporter:up:avail
        expr: label_replace(
          sum(mysql_up) without (instance) / count(mysql_up) without (instance),
          "exporter", "mysql",
          "", ""
          )

      - record: exporter:up:avail
        expr: label_replace(
          sum(apache_up) without (instance) / count(apache_up) without (instance),
          "exporter", "apache",
          "", ""
          )

      - record: exporter:up:avail
        expr: label_replace(
          sum(etherpad_up) without (instance) / count(etherpad_up) without (instance),
          "exporter", "etherpad",
          "", ""
          )

      - record: exporter:up:avail
        expr: label_replace(
          sum(haproxy_up) without (instance) / count(haproxy_up) without (instance),
          "exporter", "haproxy",
          "", ""
          )

      - record: exporter:up:avail
        expr: label_replace(
          sum(pg_up) without (instance) / count(pg_up) without (instance),
          "exporter", "postgres",
          "", ""
          )

      - record: exporter:up:avail
        expr: label_replace(
          sum(varnish_up) without (instance) / count(varnish_up) without (instance),
          "exporter", "varnish",
          "", ""
          )

      - record: exporter:up:avail
        expr: label_replace(
          sum(openldap_up) without (instance) / count(openldap_up) without (instance),
          "exporter", "openldap",
          "", ""
          )

      - record: exporter:up:avail
        expr: label_replace(
          sum(memcached_up) without (instance) / count(memcached_up) without (instance),
          "exporter", "memcached",
          "", ""
          )

      - record: exporter:up:avail
        expr: label_replace(
          sum(mcrouter_up) without (instance) / count(mcrouter_up) without (instance),
          "exporter", "mcrouter",
          "", ""
          )

      - record: exporter:up:avail
        expr: label_replace(
          sum(phpfpm_up) without (instance) / count(phpfpm_up) without (instance),
          "exporter", "phpfpm",
          "", ""
          )

      - record: exporter:up:avail
        expr: label_replace(
          sum(redis_up) without (instance) / count(redis_up) without (instance),
          "exporter", "redis",
          "", ""
          )

      - record: exporter:up:avail
        expr: label_replace(
          sum(elasticsearch_node_stats_up) without (instance) / count(elasticsearch_node_stats_up) without (instance),
          "exporter", "elasticsearch",
          "", ""
          )

      - record: exporter:up:avail
        expr: label_replace(
          sum(squid_up) without (instance) / count(squid_up) without (instance),
          "exporter", "squid",
          "", ""
          )

  - name: logstash_slos
    rules:
      # record boolean logstash availabilty metric for pyrra logstash-availability bool_gauge SLO
      - record: logstash_sli_availability:bool
        expr: sum by (site) (increase(logstash_node_pipeline_events_filtered_total[5m])) > bool 1

  - name: search_slos
    rules:
      # record boolean search lag metric for pyrra search-update-lag bool_gauge SLO
      - record: search_sli_update_lag:bool
        expr: avg by (site, job_name) (flink_taskmanager_job_task_operator_lastBatchMedianLag{job_name=~"cirrus_streaming_updater_consumer_search_.*", prometheus="k8s"} / 1000) < bool 600
      ## the following two wdqs queries are intended to get the time in seconds of wdqs lag, while filtering out hosts receiving insufficient traffic
      # record boolean wdqs lag metric for pyrra wdqs-main-update-lag bool_gauge SLO
      - record: wdqs_sli_main_update_lag:bool
        expr: |
          (
            max(
                time() - blazegraph_lastupdated{cluster="wdqs-main",instance=~".*:9193"}
              and on (cluster)
                (
                    rate(
                      org_wikidata_query_rdf_blazegraph_filters_QueryEventSenderFilter_event_sender_filter_StartedQueries{instance=~".*:9102"}[5m]
                    )
                  >
                    1
                )
            )
          )
          < bool
          600
      # record boolean wdqs lag metric for pyrra wdqs-scholarly-update-lag bool_gauge SLO
      - record: wdqs_sli_scholarly_update_lag:bool
        expr: |
          (
            max(
                time() - blazegraph_lastupdated{cluster="wdqs-scholarly",instance=~".*:9193"}
              and on (cluster)
                (
                    rate(
                      org_wikidata_query_rdf_blazegraph_filters_QueryEventSenderFilter_event_sender_filter_StartedQueries{instance=~".*:9102"}[5m]
                    )
                  >
                    1
                )
            )
          )
          < bool
          600
      # wdqs availability SLIs
      - record: wdqs_sli_availability
        expr: (blazegraph_queries_done_total - blazegraph_queries_error_total) / blazegraph_queries_done_total
  - name: phpfpm_workers
    rules:
      # Use a recording rule to allow querying historical data without caring
      # about the very high cardinality labels
      - record: phpfpm_processes_total:sum
        expr: sum without (instance, pod_template_hash, kubernetes_pod_name) (phpfpm_processes_total)

  - name: editcheck_slos
    rules:
      - record: editcheck_sli_presavechecks_shown_vs_available_total
        expr: |
          (mediawiki_editcheck_preSaveChecks_total{kind="Available"} -
            ignoring(kind) mediawiki_editcheck_preSaveChecks_total{kind="NotShown"} -
            ignoring(kind) mediawiki_editcheck_preSaveChecks_total{kind="Shown"}
          )
      - record: editcheck_sli_presavechecks_available_total
        expr: sum without (kind) (mediawiki_editcheck_preSaveChecks_total{kind="Available"})

  - name: xlab_slos
    rules:
      - record: xlab_sli_standalone_event_system_total
        expr: sum(eventgate_events_produced_total{service="eventgate-analytics-external", stream="product_metrics.web_base", prometheus="k8s"}) + sum(eventgate_validation_errors_total{service="eventgate-analytics-external", error_type=~"HoistingError|MalformedHeaderError", prometheus="k8s"}) or vector(0)
      - record: xlab_sli_standalone_event_validation_total
        expr: sum(eventgate_events_produced_total{service="eventgate-analytics-external", stream="product_metrics.web_base", prometheus="k8s"}) + sum(eventgate_validation_errors_total{service="eventgate-analytics-external", error_type=~"HoistingError|MalformedHeaderError|ValidationError", prometheus="k8s"}) or vector(0)
      - record: xlab_sli_standalone_event_system_errors_total
        expr: eventgate_validation_errors_total{service="eventgate-analytics-external", error_type=~"HoistingError|MalformedHeaderError", prometheus="k8s"} or vector(0)
      - record: xlab_sli_standalone_event_validation_errors_total
        expr: eventgate_validation_errors_total{service="eventgate-analytics-external", stream="product_metrics.web_base", error_type=~"HoistingError|MalformedHeaderError|ValidationError", prometheus="k8s"} or vector(0)

  - name: prometheus_ingested_metrics
    rules:
      - record: prometheus_site:prometheus_tsdb_head_series:sum
        expr: sum by (prometheus,site) (prometheus_tsdb_head_series)

      - record: prometheus_site:prometheus_tsdb_head_series:sum_offset
        expr: sum by (prometheus,site) (prometheus_tsdb_head_series offset 7d)
        labels:
          offset: 7d

      - record: prometheus_site:prometheus_tsdb_head_series:sum_offset
        expr: sum by (prometheus,site) (prometheus_tsdb_head_series offset 14d)
        labels:
          offset: 14d

      - record: prometheus_site:prometheus_tsdb_head_series:sum_offset
        expr: sum by (prometheus,site) (prometheus_tsdb_head_series offset 21d)
        labels:
          offset: 21d

      - record: prometheus_site:prometheus_tsdb_head_series_sum_offset:avg
        expr: avg without (offset) (prometheus_site:prometheus_tsdb_head_series:sum_offset)

      - record: prometheus_site:prometheus_tsdb_head_series_sum_offset:stddev
        expr: stddev without (offset) (prometheus_site:prometheus_tsdb_head_series:sum_offset)

      - record: prometheus_site:prometheus_tsdb_head_series:zscore
        expr: |
          (
            prometheus_site:prometheus_tsdb_head_series:sum
              -
            prometheus_site:prometheus_tsdb_head_series_sum_offset:avg
          )
            /
          prometheus_site:prometheus_tsdb_head_series_sum_offset:stddev


      - record: prometheus_site:prometheus_tsdb_head_series_created:sum_rate1d
        expr: |
          sum by (prometheus, site) (rate(prometheus_tsdb_head_series_created_total[1d]))

      - record: prometheus_site:prometheus_tsdb_head_series_created:sum_rate1d_offset
        expr: |
          sum by (prometheus, site) (rate(prometheus_tsdb_head_series_created_total[1d] offset 7d))
        labels:
          offset: 7d

      - record: prometheus_site:prometheus_tsdb_head_series_created:sum_rate1d_offset
        expr: |
          sum by (prometheus, site) (rate(prometheus_tsdb_head_series_created_total[1d] offset 14d))
        labels:
          offset: 14d

      - record: prometheus_site:prometheus_tsdb_head_series_created:sum_rate1d_offset
        expr: |
          sum by (prometheus, site) (rate(prometheus_tsdb_head_series_created_total[1d] offset 21d))
        labels:
          offset: 21d

      - record: prometheus_site:prometheus_tsdb_head_series_created_sum_rate1d_offset:avg
        expr: avg without (offset) (prometheus_site:prometheus_tsdb_head_series_created:sum_rate1d_offset)

      - record: prometheus_site:prometheus_tsdb_head_series_created_sum_rate1d_offset:stddev
        expr: stddev without (offset) (prometheus_site:prometheus_tsdb_head_series_created:sum_rate1d_offset)

      - record: prometheus_site:prometheus_tsdb_head_series_created:zscore
        expr: |
          (
            prometheus_site:prometheus_tsdb_head_series_created:sum_rate1d
              -
            prometheus_site:prometheus_tsdb_head_series_created_sum_rate1d_offset:avg
          )
            /
          prometheus_site:prometheus_tsdb_head_series_created_sum_rate1d_offset:stddev


      - record: prometheus_site:prometheus_tsdb_head_samples_appended:sum_rate1d
        expr: |
          sum by (prometheus, site) (rate(prometheus_tsdb_head_samples_appended_total[1d]))

      - record: prometheus_site:prometheus_tsdb_head_samples_appended:sum_rate1d_offset
        expr: |
          sum by (prometheus, site) (rate(prometheus_tsdb_head_samples_appended_total[1d] offset 7d))
        labels:
          offset: 7d

      - record: prometheus_site:prometheus_tsdb_head_samples_appended:sum_rate1d_offset
        expr: |
          sum by (prometheus, site) (rate(prometheus_tsdb_head_samples_appended_total[1d] offset 14d))
        labels:
          offset: 14d

      - record: prometheus_site:prometheus_tsdb_head_samples_appended:sum_rate1d_offset
        expr: |
          sum by (prometheus, site) (rate(prometheus_tsdb_head_samples_appended_total[1d] offset 21d))
        labels:
          offset: 21d

      - record: prometheus_site:prometheus_tsdb_head_samples_appended_sum_rate1d_offset:avg
        expr: avg without (offset) (prometheus_site:prometheus_tsdb_head_samples_appended:sum_rate1d_offset)

      - record: prometheus_site:prometheus_tsdb_head_samples_appended_sum_rate1d_offset:stddev
        expr: stddev without (offset) (prometheus_site:prometheus_tsdb_head_samples_appended:sum_rate1d_offset)

      - record: prometheus_site:prometheus_tsdb_head_samples_appended:zscore
        expr: |
          (
            prometheus_site:prometheus_tsdb_head_samples_appended:sum_rate1d
              -
            prometheus_site:prometheus_tsdb_head_samples_appended_sum_rate1d_offset:avg
          )
            /
          prometheus_site:prometheus_tsdb_head_samples_appended_sum_rate1d_offset:stddev

      - record: prometheus_site:prometheus_tsdb_head_samples_appended_per_series:ratio_rate1d
        expr: |
          prometheus_site:prometheus_tsdb_head_samples_appended:sum_rate1d
            /
          prometheus_site:prometheus_tsdb_head_series:sum

https://revertrisk-language-agnostic.revertrisk.wikimedia.org:
- path: /v1/models/revertrisk-language-agnostic:predict
  json_body:
    instances:
      - rev_id: 21774755
        lang: en
  assert_status: 200
  assert_body_contains: predictions
  method: POST
https://revertrisk-multilingual.revertrisk.wikimedia.org:
- path: /v1/models/revertrisk-multilingual:predict
  json_body:
    rev_id: 21774755
    lang: en
  assert_status: 200
  assert_body_contains: output
  method: POST
https://revertrisk-wikidata.revertrisk.wikimedia.org:
- path: /v1/models/revertrisk-wikidata:predict
  json_body:
    rev_id: 1945516043
  assert_status: 200
  assert_body_contains: probabilities
  method: POST

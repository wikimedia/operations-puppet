#
# Per-suite settings for the Lift Wing httpbb suites, read by run_all.sh. This
# file keeps all service-specific knowledge out of run_all.sh.
#
# Format (one suite per line):
#   <suite-basename> [<dc> ...] [key=value ...]
# where <suite-basename> is the test file name without the .yaml extension.
#
# Tokens after the suite name, in any order:
#   codfw | eqiad          Restrict the suite to these datacentres. run_all.sh
#                          skips the suite in a datacentre that is not listed.
#                          With no datacentre token, the suite runs in both.
#   port=<n>               https port to use (default 30443, the shared
#                          inference ingress).
#   host_production=<host> Host header / target in production (default
#                          inference.svc.<dc>.wmnet).
#   host_staging=<host>    Host header / target in staging (default
#                          inference-staging.svc.codfw.wmnet).
#
# Any suite NOT listed here runs in both codfw and eqiad, on the shared
# inference ingress (inference.svc.<dc>.wmnet, port 30443). Lines that start
# with # and blank lines are ignored.
#
# Staging is codfw only and deploys a subset of services; that subset is
# expressed by which suites exist under staging/, so a suite that is
# datacentre-restricted to eqiad simply has no staging file.

# --- Datacentre availability ------------------------------------------------
# eqiad-only production suites (llm and experimental extra models).
test_embeddings            eqiad
test_semantic-highlighting eqiad
test_policy-violation      eqiad
test_llm-generation        eqiad

# --- Host/port overrides ----------------------------------------------------
# recommendation-api-ng has its own discovery record and port; it does not go
# through the shared inference ingress.
test_recommendation-api-ng port=31443 host_production=recommendation-api-ng.discovery.wmnet host_staging=recommendation-api-ng.k8s-ml-staging.discovery.wmnet

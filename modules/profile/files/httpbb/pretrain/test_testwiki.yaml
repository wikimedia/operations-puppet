# This file tests some urls for test.wikipedia.org in the Pretrain deployment
# SPDX-License-Identifier: Apache-2.0

https://test.wikipedia.org:
- path: /
  assert_status: 301
  assert_headers:
    Location: https://test.wikipedia.org/wiki/Main_Page

- path: /wiki
  assert_status: 301
  assert_headers:
    Location: https://test.wikipedia.org/wiki/Main_Page

# == Main Page ==
- path: /wiki/Main_Page
  assert_status: 200
  assert_body_contains: Wikipedia

- path: /w/index.php?title=Main_Page&action=render
  assert_status: 200
  assert_body_contains: Wikimedia

- path: /w/index.php?title=Main_Page&action=history
  assert_status: 200
  assert_body_contains: Revision history

- path: /w/index.php?title=Main_Page&action=info
  assert_status: 200
  assert_body_contains: Information for "Main Page"

- path: /w/index.php?title=Special:Log&page=Main_Page
  assert_status: 200
  assert_body_contains: Main public logs

- path: /wiki/Special:Export/Main_Page
  assert_status: 200
  assert_body_contains: <model>wikitext</model>

# == User/User talk namespace checks ==
# Extension:GlobalUserPage
- path: /wiki/User:BDavis_(WMF)
  assert_status: 200
  assert_body_contains: View on meta.wikimedia.org
- path: /wiki/User_talk:BDavis_(WMF)
  assert_status: 200
  assert_body_contains: BDavis (WMF)

# == Content
- path: /wiki/Sample_page
  assert_status: 200
  assert_body_contains: Sample page
- path: /w/api.php?action=parse&format=json&servedby=1&curtimestamp=1&responselanginfo=1&page=Sample%20page&redirects=1&prop=parsewarnings&parser=parsoid&utf8=1&formatversion=2
  assert_status: 200
  assert_body_contains: Sample page
# TODO: https://test.wikipedia.org/wiki/Wikipedia:Village_pump#c-BDavis_(WMF)-20260809211000-Adding_some_local_content_pages_for_Pretrain_project_testing
# - path: /wiki/Barack_Obama
#   assert_status: 200
#   assert_body_contains: Barack Obama

# == General MediaWiki checks ==
- path: /wiki/Special:SpecialPages
  assert_status: 200
  assert_body_contains: Special:Version

- path: /wiki/Special:Version
  assert_status: 200
  assert_body_contains: Brooke Vibber

- path: /wiki/Special:RecentChanges
  assert_status: 200
  assert_body_contains: Track the most recent changes to the wiki

- path: /wiki/Special:BlankPage
  assert_status: 200
  assert_body_contains: Blank page

- path: /w/CREDITS
  assert_status: 200
  assert_body_contains: BEGIN CONTRIBUTOR LIST

- path: /w/COPYING
  assert_status: 200
  assert_body_contains: License and copyright information

- path: /wiki/Special:ApiSandbox
  assert_status: 200
  assert_body_contains: JavaScript is required to use the API sandbox

- path: /w/api.php?action=help&recursivesubmodules=1
  assert_status: 200
  assert_body_contains: MediaWiki API help

- path: /w/skins/Timeless/resources/print.css
  assert_status: 200
  request_headers:
    Accept-Encoding: "deflate, gzip"
  assert_headers_absent:
    - Content-Encoding
    - Vary
  assert_headers_regex:
    Content-Type: ^text/css

# T106732 - Verify that .php URLs accessed via /w/ are not reachable
- path: /w/resources/Resources.php
  assert_status: 404

# == General webroot checks ==
- path: /apple-app-site-association
  assert_status: 200
  assert_body_regex: >-
    (?s)"appIDs".*"AKK7J2GV64.org.wikimedia.wikipedia".*"edit".*"exclude"\s*:\s*true

- path: /favicon.ico
  assert_status: 200
  assert_headers:
    Content-Type: image/vnd.microsoft.icon

- path: /api/
  assert_status: 200
  assert_body_contains: providing rich queries, editing and content access

# T357595 - Previously, anything matching /wiki.* would get an unintended 301.
- path: /nonexistent
  assert_status: 404
- path: /wikinonexistent
  assert_status: 404

https://www.wikifunctions.org:
- path: /wiki/Wikifunctions:Main_Page
  assert_status: 200
  assert_body_contains: Welcome to Wikifunctions
- path: /wiki/Z1
  assert_status: 200
  assert_body_contains: Object
- path: /view/en/Z1
  assert_status: 200
  assert_body_contains: Object
# Case-insensitive to allow the community's preference to settle on one or the
# other - T383032
- path: /view/fr/Z1
  assert_status: 200
  assert_body_regex: "[Oo]bjet"

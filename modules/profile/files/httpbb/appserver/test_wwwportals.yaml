# wwwportals.conf.erb
https://wikipedia.org:
- path: /
  assert_status: 301
  assert_headers:
    Location: https://www.wikipedia.org/
- path: /.well-known/assetlinks.json
  assert_status: 200
  assert_body_contains: org.wikipedia

https://www.wikipedia.org:
- path: /
  assert_status: 200
  assert_body_contains: The Free Encyclopedia
- path: /wiki/it:Saturno_(astronomia)?a=test
  request_headers:
    x-forwarded-proto: http
  assert_status: 302
  assert_headers:
      Location: http://it.wikipedia.org/wiki/Saturno_(astronomia)?a=test
- path: /?some=query
  assert_status: 301
  assert_headers:
    Location: https://www.wikipedia.org/

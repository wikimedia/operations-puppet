# Test legacy /beacon/event EventLogging proxy.
#   https://phabricator.wikimedia.org/T353817
#   NOTE: /beacon/event path shoud not end in a '/' for this test.
#   See:  https://phabricator.wikimedia.org/T353817#9928080
- path: '/beacon/event?%7B%22schema%22%3A%22Test%22%2C%22revision%22%3A15047841%2C%22wiki%22%3A%22472d1e0653ccb71526c091ecd2ea4bbe%22%2C%22event%22%3A%7B%22OtherMessage%22%3A%22httpbb_test%22%7D%7D;'
  assert_status: 204


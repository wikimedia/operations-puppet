# This file tests some urls for wikis in the main.conf file

https://en.wikipedia.org:
- path: /wiki/Main_Page
  assert_status: 200
  assert_body_contains: Wikipedia, the free encyclopedia
- path: /wiki/Special:Export/Pulsar
  assert_status: 200
  assert_body_contains: <model>wikitext</model>
- path: /wiki/Barack_Obama
  assert_status: 200
  assert_body_contains: Barack Obama
- path: /w/wiki.phtml?title=foo&action=info
  assert_status: 200
  assert_body_contains: Information for "Foo"
- path: /apple-app-site-association
  assert_status: 200
  assert_body_regex: >-
    (?s)("appID"\s*:\s*"AKK7J2GV64.org.wikimedia.wikipedia",\s*"paths":\s*\[\s*"/wiki/\*"|"appIDs".*"AKK7J2GV64.org.wikimedia.wikipedia".*"/wiki/\*")
- path: /favicon.ico
  assert_status: 200
  assert_headers:
    Content-Type: image/vnd.microsoft.icon
- path: /w/CREDITS
  assert_status: 200
  assert_body_contains: BEGIN CONTRIBUTOR LIST
- path: /w/COPYING
  assert_status: 200
  assert_body_contains: License and copyright information
- path: /w/skins/Timeless/resources/print.css
  assert_status: 200
  request_headers:
    Accept-Encoding: "deflate, gzip"
  assert_headers_absent:
    - Content-Encoding
    - Vary
  assert_headers_regex:
    Content-Type: ^text/css
# Verify that php URLs accessed via /w/ are not reachable.
# https://phabricator.wikimedia.org/T106732
- path: /w/resources/Resources.php
  assert_status: 404
- path: /api/
  assert_status: 200
  assert_body_contains: providing rich queries, editing and content access
# T357595 - Previously, anything matching /wiki.* would get an unintended 301.
- path: /nonexistent
  assert_status: 404
- path: /wikinonexistent
  assert_status: 404
- path: /wiki
  assert_status: 301
  assert_headers:
    Location: https://en.wikipedia.org/wiki/Main_Page

https://www.mediawiki.org:
- path: /wiki/User_hub
  assert_status: 200

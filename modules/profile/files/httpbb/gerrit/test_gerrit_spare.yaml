http://gerrit-spare.wikimedia.org:
- path: /
  assert_status: 403

https://gerrit-spare.wikimedia.org:
- path: /
  assert_status: 302
  assert_headers:
    Location: https://gerrit-spare.wikimedia.org/r/
- path: /r/
  assert_status: 404
- path: /r/admin/repos
  assert_status: 404
- path: /r/q/status:open
  assert_status: 404

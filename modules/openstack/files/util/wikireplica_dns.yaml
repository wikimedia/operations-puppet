---
# Wiki Replica DNS configuration
#
# Used to generate A and CNAME records for the given zones and hosts.
#
# zones:
#   zone_name.:  # trailing . is important!
#     hostname:
#       - Address 1
#       - Address 2
#       - ...
# cnames:
#   host.zone_name.:  # trailing . is important!
#     - fqdn 1.
#     - fqdn 2.
#     - ...
#
# This file is managed by Puppet
zones:
  analytics.db.svc.wikimedia.cloud.: &analytics
    s1: [172.20.255.2,  2a02:ec80:a000:2ff::2]
    s2: [172.20.255.3,  2a02:ec80:a000:2ff::3]
    s3: [172.20.255.4,  2a02:ec80:a000:2ff::4]
    s4: [172.20.255.5,  2a02:ec80:a000:2ff::5]
    s5: [172.20.255.6,  2a02:ec80:a000:2ff::6]
    s6: [172.20.255.7,  2a02:ec80:a000:2ff::7]
    s7: [172.20.255.8,  2a02:ec80:a000:2ff::8]
    s8: [172.20.255.9,  2a02:ec80:a000:2ff::9]
    x3: [172.20.255.18, 2a02:ec80:a000:2ff::18]
    x4: [172.20.255.21, 2a02:ec80:a000:2ff::21]
  analytics.db.svc.eqiad.wmflabs.: *analytics
  web.db.svc.wikimedia.cloud.: &web
    s1: [172.20.255.10, 2a02:ec80:a000:2ff::10]
    s2: [172.20.255.11, 2a02:ec80:a000:2ff::11]
    s3: [172.20.255.12, 2a02:ec80:a000:2ff::12]
    s4: [172.20.255.13, 2a02:ec80:a000:2ff::13]
    s5: [172.20.255.14, 2a02:ec80:a000:2ff::14]
    s6: [172.20.255.15, 2a02:ec80:a000:2ff::15]
    s7: [172.20.255.16, 2a02:ec80:a000:2ff::16]
    s8: [172.20.255.17, 2a02:ec80:a000:2ff::17]
    x3: [172.20.255.19, 2a02:ec80:a000:2ff::19]
    x4: [172.20.255.23, 2a02:ec80:a000:2ff::23]
  web.db.svc.eqiad.wmflabs.: *web
cnames:
  s7.analytics.db.svc.eqiad.wmflabs.:
    - centralauth.analytics.db.svc.eqiad.wmflabs.
    # [[wikitech:Help:Toolforge/Database#Metadata_database]]
    - meta.analytics.db.svc.eqiad.wmflabs.
  s7.analytics.db.svc.wikimedia.cloud.:
    - centralauth.analytics.db.svc.wikimedia.cloud.
    # [[wikitech:Help:Toolforge/Database#Metadata_database]]
    - meta.analytics.db.svc.wikimedia.cloud.
  x3.analytics.db.svc.wikimedia.cloud.:
    # No dblist for x3 so this has to be specified manually
    - termstore.wikidatawiki.analytics.db.svc.wikimedia.cloud.
  s7.web.db.svc.eqiad.wmflabs.:
    - centralauth.web.db.svc.eqiad.wmflabs.
    # [[wikitech:Help:Toolforge/Database#Metadata_database]]
    - meta.web.db.svc.eqiad.wmflabs.
  s7.web.db.svc.wikimedia.cloud.:
    - centralauth.web.db.svc.wikimedia.cloud.
    # [[wikitech:Help:Toolforge/Database#Metadata_database]]
    - meta.web.db.svc.wikimedia.cloud.
  x3.web.db.svc.wikimedia.cloud.:
    # No dblist for x3 so this has to be specified manually
    - termstore.wikidatawiki.web.db.svc.wikimedia.cloud.

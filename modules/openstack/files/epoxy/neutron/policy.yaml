"get_subnet": "role:reader and project_id:%(project_id)s or rule:shared or rule:external_network or (rule:admin_only) or (role:reader and rule:network_owner) or role:member and project_id:%(project_id)s or (role:member and rule:network_owner)"
"create_subnetpool": "rule:admin_only"
"get_subnetpool": "(rule:admin_only) or (role:reader and project_id:%(project_id)s) or rule:shared_subnetpools or (role:member and project_id:%(project_id)s)"
"update_subnet": "rule:admin_only"
"delete_subnet": "rule:admin_only"
"get_address_scope": "rule:regular_user"
"update_address_scope": "rule:admin_only"
"delete_address_scope": "rule:admin_only"
"create_network": "rule:admin_only"
"get_network": "rule:regular_user"
"get_network_ip_availability": ""
"update_network": "rule:admin_only"
"delete_network": "rule:admin_only"
"get_port": "(rule:admin_only) or (rule:service_api) or role:reader and rule:network_owner or role:reader and project_id:%(project_id)s or role:member and rule:network_owner or role:member and project_id:%(project_id)s"
"create_router": "rule:admin_only"
"get_router": "rule:admin_only"
"delete_router": "rule:admin_only"
"add_router_interface": "rule:admin_only"
"remove_router_interface": "rule:admin_only"
"get_agent": "rule:regular_user"
"get_l3-agents": "rule:regular_user"
"get_floatingip": "rule:regular_user"
"update_rbac_policy": "rule:admin_only"
"get_rbac_policy": "rule:admin_only"
"delete_rbac_policy": "rule:admin_only"
"get_auto_allocated_topology": "rule:admin_only"
"get_security_group": "rule:regular_user"
"get_security_group_rule": "rule:regular_user"


# The following allow heat/magnum to do necessary setup. There's a bit of explanation
#  at https://bugs.launchpad.net/neutron/+bug/1833455 although experimentation
#  shows the extra three rules are needed.
#
# See also upstream patch https://review.opendev.org/c/openstack/neutron/+/886214
"create_port:fixed_ips:ip_address": "(rule:shared) or (rule:admin_only) or (rule:context_is_advsvc) or (rule:service_api) or role:manager and project_id:%(project_id)s or role:member and rule:network_owner or rule:shared"
"create_port:fixed_ips:ip_address": "(rule:admin_only) or (rule:service_api) or role:manager and project_id:%(project_id)s or role:member and rule:network_owner or rule:shared"
"create_port:allowed_address_pairs": "(rule:admin_only) or (role:member and rule:network_owner) or role:manager and project_id:%(project_id)s or rule:shared"
"update_port:allowed_address_pairs": "(rule:admin_only) or (role:member and rule:network_owner) or role:manager and project_id:%(project_id)s or rule:shared"
"create_port:allowed_address_pairs:ip_address": "(rule:admin_only) or (role:member and rule:network_owner) or role:manager and project_id:%(project_id)s or rule:shared"
"update_port:allowed_address_pairs:ip_address": "(rule:admin_only) or (role:member and rule:network_owner) or role:manager and project_id:%(project_id)s or rule:shared"

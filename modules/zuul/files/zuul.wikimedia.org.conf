### puppet:///modules/profile/zuul/zuul.wikimedia.org.conf
#####################################################################
# vim: filetype=apache

<VirtualHost *:80>
    ServerName zuul.wikimedia.org

    LogLevel warn
    ErrorLog /var/log/apache2/zuul_error.log
    CustomLog /var/log/apache2/zuul_access.log wmf

    DocumentRoot /var/www/zuul

    ProxyPassMatch    ^(/zuul/status)$    http://localhost:9000/$1
    ProxyPassMatch    ^(/zuul/status\.json)$    http://localhost:9000/$1
    ProxyPassMatch    ^(/zuul/status/change/\d{1,9},\d{1,3})$    http://localhost:9000/$1

    ProxyRequests Off

    AllowEncodedSlashes NoDecode

    RewriteEngine on
    RewriteRule ^/api/tenant/(.*)/console-stream ws://localhost:9000/api/tenant/$1/console-stream [P]
    RewriteRule ^/(.*)$ http://localhost:9000/$1 [P]

    <Proxy http://localhost:9000/*>
        Require all granted
    </Proxy>

    <Directory />
        Require all granted
    </Directory>

    <Directory /var/www/zuul>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

</VirtualHost>

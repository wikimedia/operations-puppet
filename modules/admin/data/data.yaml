                 to be reviewed https://wikitech.wikimedia.org/wiki/Analytics/Data_access#User_responsibilities
                 There are two main use cases for this group.
                 1) No kerberos principal - the user wants to have access to the Mariadb MediaWiki-replicas
                    or to use one of the GPUs on the stat100x hosts.
                 2) With kerberos principal - the user wants the above plus access to the private data
                    stored in Hadoop (Webrequest, Eventlogging, Pageviews, etc..). In this case, the admin
                    needs to follow https://wikitech.wikimedia.org/wiki/Data_Platform/Systems/Kerberos/Administration#Create_a_principal_for_a_real_user
                 Often a user might want to have access to PII data on Turnilo or Superset, that requires
                 membership to either the 'wmf' or the 'nda' LDAP groups.
                 In case of doubt, please ask to the Analytics team.
                 More info https://wikitech.wikimedia.org/wiki/Analytics/Data_access#Access_Groups
                 For "no-ssh, no-kerberos" access create a shell account with an empty ssh key, grep for
                 "Added with no SSH access" to find examples in this file.
                 Approval requests for this group can be expedited by tagging Data-Engineering on phabricator

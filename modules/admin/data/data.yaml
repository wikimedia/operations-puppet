  ops-limited:
    # SRE members without full root.
    # Use cases: DCops ssh/throubleshooting, new SRE members, etc..
    # Ideally this group will be coupled with sudo_pair (or similar).
    # Note about the allowed privileges: the idea is to provide tools
    # (that require root privileges) to be able to successfully troubleshoot
    # a server with a little more than "read-only" access. Please be very mindful
    # with the extra tools that we allow.
    gid: 724
    description: 'Used for SREs without full root privileges'
    members: &ops_limited [*datacenter_ops, otto, matthieulec]
    privileges: ['ALL = NOPASSWD: /usr/sbin/dmidecode',
                 'ALL = NOPASSWD: /usr/bin/dmesg *',
                 'ALL = NOPASSWD: /usr/sbin/lldpctl *',
                 'ALL = NOPASSWD: /usr/sbin/traceroute *',

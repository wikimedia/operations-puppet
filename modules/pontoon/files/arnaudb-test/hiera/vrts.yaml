profile::admin::groups:
  - vrts-roots
profile::vrts::active_host: 'arndb-tst-vrts-01.devtools.eqiad1.wikimedia.cloud'
profile::vrts::passive_host: 'arndb-tst-vrts-02.devtools.eqiad1.wikimedia.cloud'
profile::vrts::database_host: arndb-tst-puppet-01.devtools.eqiad1.wikimedia.cloud
profile::vrts::database_port: '3306'
profile::vrts::install_version: '6.5.10'
profile::vrts::daemon: true
profile::vrts::local_database: false
profile::vrts::database_name: vrts
profile::vrts::database_pass: StrongPass123!
profile::vrts::database_user: vrts
profile::vrts::exim_database_name: exim
profile::vrts::exim_database_pass: StrongPass123!
profile::vrts::exim_database_user: vrts
profile::vrts::download_url: 'https://download.znuny.org/releases'
profile::vrts::http_proxy: ''
profile::vrts::https_proxy: ''
profile::mail::vrts::training::train_spamassassin: true
profile::mail::vrts::training::train_rspamd: true



profile::mail::default_mail_relay::enabled: false

# envoy for TLS termination behind ATS
profile::tlsproxy::envoy::ssl_provider: 'cfssl'
profile::tlsproxy::envoy::global_cert_name: 'arndb-tst-vrts-01.devtools.eqiad1.wikimedia.cloud'
profile::tlsproxy::envoy::cfssl_options:
  hosts:
    - arndb-tst-vrts-01.devtools.eqiad1.wikimedia.cloud
profile::tlsproxy::envoy::firewall_src_sets:
  - CACHES
profile::tlsproxy::envoy::upstream_response_timeout: 130.0
profile::tlsproxy::envoy::tls_port: 443

profile::contacts::role_contacts: ['Collaboration Services']
profile::base::production::role_description: 'VRTS Web Application Server'

profile::vrts::public_dns: 'arndb-tst-vrts-01.devtools.eqiad1.wikimedia.cloud'

profile::firewall::provider: ferm

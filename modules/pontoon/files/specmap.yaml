# Map roles to VM specifications:
# * (image, flavor) the VM configuration to use.
#   images available include:
#     - debian-12.0-bookworm (default)
#     - debian-13.0-trixie
#   commonly-used flavors include:
#     - g4.cores2.ram4.disk20
#     - g4.cores4.ram8.disk20
#     - g4.cores8.ram16.disk20
#     - g4.cores16.ram32.disk20
#
# * hostname to use when adding hosts to the stack.
#   Reflects the production conventions in manifests/site.pp (e.g. role
#   swift::proxy hosts are 'ms-fe' hostnames).
#   Can be omitted when role == hostname (e.g. webperf)
#
# The specifications in <stack>/specmap.yaml will take
# precedence when found.


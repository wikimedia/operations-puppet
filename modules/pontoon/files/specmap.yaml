# Map roles to VM specifications:
# * (image, flavor) the VM configuration to use
# * hostname to use when adding hosts to the stack
#
# The specifications in <stack>/specmap.yaml will take
# precedence when found.

__default:
  image: 'debian-12.0-bookworm'
  flavor: 'g4.cores1.ram2.disk20'

# Roles with higher requirements than default
puppetserver::pontoon:
  flavor: 'g4.cores2.ram4.disk20'
  hostname: 'puppet'

pki::multirootca:
  hostname: 'pki'

pontoon::lb:
  hostname: 'lb'

logging::opensearch::collector:
  flavor: 'g4.cores2.ram4.disk20'
  hostname: 'logs-fe'

prometheus:
  flavor: 'g4.cores2.ram4.disk20'

kubernetes::master_stacked:
  flavor: 'g4.cores2.ram4.disk20'

wmcs::toolforge::metal::control:
  flavor: 'g4.cores2.ram4.disk20'
  image: 'debian-13.0-trixie'

wmcs::toolforge::metal::worker:
  flavor: 'g4.cores2.ram4.disk20'
  image: 'debian-13.0-trixie'

# Roles pinned to Debian release other than default
kafka::logging:
  image: 'debian-11.0-bullseye'
  hostname: 'kafka-logs'

alerting_host:
  hostname: 'alerts'

syslog::centralserver:
  hostname: 'centrallog'

kafka::monitoring_bullseye:
  hostname: 'kafkamon'
